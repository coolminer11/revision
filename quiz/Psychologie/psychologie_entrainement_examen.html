h2{font-size:1.18em;margin:.2em 0 .7em}
h3{font-size:1.04em;margin:1.1em 0 .4em;padding-left:10px;border-left:4px solid var(--a)}
button{font-size:1em;padding:9px 14px;border:0;border-radius:10px;cursor:pointer;margin:6px 6px 0 0;font-weight:600;font-family:inherit}

.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.76em;font-weight:700;color:#fff;background:var(--a)}
.big{font-size:1.15em;font-weight:600;margin:.6em 0 .4em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:10px}
.opts button{margin:0;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--a);color:var(--tx);text-align:left;font-weight:600}
.opts button:hover{border-color:var(--a)}
.opts button.good{background:#1f9d5528;border-color:var(--ok)}.opts button.bad{background:#d6454522;border-color:var(--no)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.duel button{margin:0;padding:18px 12px;font-size:1.05em;background:var(--bg);border:2px solid var(--line);color:var(--tx)}
.duel button:hover{border-color:var(--a)}
.duel button.good{background:#1f9d5528;border-color:var(--ok)}.duel button.bad{background:#d6454522;border-color:var(--no)}

table{width:100%;border-collapse:collapse;font-size:.92em;margin:6px 0}td,th{border-bottom:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}

.leg{display:flex;flex-wrap:wrap;gap:6px}.leg span{color:#fff;border-radius:999px;padding:3px 10px;font-size:.82em;font-weight:700}
.warn{background:#e0a80018;border-left:4px solid #e0a800;padding:8px 11px;border-radius:8px;margin:8px 0;font-size:.93em}
ul.err li{margin:6px 0}
@media(max-width:560px){.cols,.duel{grid-template-columns:1fr}td:first-child{white-space:normal}}

`<h3>Neurotransmetteurs</h3>${T([["Acétylcholine","muscles, mémoire"],["Dopamine","récompense, motivation, mouvement (Parkinson)"],["Noradrénaline","vigilance, stress"],["Sérotonine","humeur, sommeil, appétit"],["GABA","principal INHIBITEUR"],["Glutamate","principal EXCITATEUR"],["Endorphines","douleur"]])}`],
["cer","8. Le cerveau",T([["Triunique","reptilien, limbique, néocortex (simplification historique!)"],["Bulbe rachidien","respiration, cœur"],["Pont / mésencéphale","relais, sommeil / réflexes, éveil"],["Cervelet","coordination, équilibre (vélo)"],["Thalamus","RELAIS sensoriel vers le cortex"],["Hypothalamus","HOMÉOSTASIE : faim, soif, température"],["Hippocampe","nouveaux souvenirs (H. M. : amnésie antérograde, mais apprentissages procéduraux OK)"],["Amygdale","peur, menaces"],["Hypophyse","glande hormonale"],["Frontal","planifier, inhiber, décider, mouvement"],["Pariétal","toucher, corps, espace"],["Temporal","audition, langage, mémoire"],["Occipital","vision"],["Hémisphères","gauche → côté droit du corps, langage · droit → côté gauche, visuospatial · reliés par le corps calleux · ils travaillent ENSEMBLE"],["Matière grise / blanche","corps cellulaires / axones myélinisés"]])],
["apr","9. Apprentissage",T([["Apprentissage","changement durable dû à l'expérience"],["Habituation","réponse ↓ à un stimulus répété"],["Sensibilisation","réponse ↑ après une frayeur"],["Classique (Pavlov)","SI (nourriture) → RI · SN (cloche) + SI → SC → RC (salive à la cloche)"],["Termes","acquisition, extinction, récupération spontanée, généralisation, discrimination"],["Opérant (Skinner)","conséquences : renforcement ↑, punition ↓ · positif = AJOUTE, négatif = RETIRE"],["Façonnement","renforcer de petites approximations"],["Latent (Tolman)","appris mais caché jusqu'à ce que ce soit utile"],["Intuition (Köhler)","eurêka, solution soudaine"],["Observation (Bandura)","attention → rétention → reproduction → motivation"]])+`<div class="warn">Renforcement négatif ≠ punition! Il AUGMENTE le comportement (la ceinture fait arrêter le bip).</div>`]
];
$("v-fiche").innerHTML=`<div class="card"><h2>Fiche couleur</h2>${legend}<p class="mut">Astuce : lis une section, puis cache la colonne de droite avec ta main et récite.</p></div>`+F.map(([k,t,h])=>`<div class="card" ${ca(k)}><h2 style="color:${COL[k]}">${t}</h2>${h}</div>`).join("");

/* ③ PIÈGES */
let pgF=new Set(Object.keys(COL)),pgO,pgI,pgS,pgStreak,pgBest=0,pgW,pgDone;
function pgHome(){$("v-piege").innerHTML=`<div class="card"><h2>⚔️ Pièges : choisis le bon jumeau</h2>
<p>Deux concepts qu'on confond facilement. Tu lis la situation et tu choisis le bon. Pas de chrono : vise la <b>série la plus longue sans erreur</b>.</p>
<div class="chips">${Object.keys(COL).map(k=>`<button class="chip ${pgF.has(k)?"on":""}" ${ca(k)} onclick="pgTog('${k}')">${COLN[k]} (${PG.filter(p=>p[4]===k).length})</button>`).join("")}</div>
<button class="p" onclick="pgStart()">Commencer (${PG.filter(p=>pgF.has(p[4])).length} pièges)</button></div>`;}
window.pgTog=k=>{pgF.has(k)?pgF.delete(k):pgF.add(k);pgHome();};
window.pgStart=(list)=>{pgO=shuf(list||PG.filter(p=>pgF.has(p[4])));if(!pgO.length)return;pgI=0;pgS=0;pgStreak=0;pgW=[];pgRender();};
function pgRender(){const v=$("v-piege");if(pgI>=pgO.length){v.innerHTML=`<div class="card"><h2>Score : ${pgS}/${pgO.length}</h2><p>Meilleure série : <b>${pgBest}</b> 🔥</p>${pgW.length?`<h3>Tes pièges à revoir</h3><ul class="err">${pgW.map(p=>`<li ${ca(p[4])}><span class="tag">${COLN[p[4]]}</span> ${p[0]} → <b>${p[1]}</b> (pas ${p[2]})</li>`).join("")}</ul><button class="p" onclick="pgStart(pgW.slice())">Refaire mes erreurs (${pgW.length})</button>`:"<p>🔥 Aucune erreur!</p>"}<button class="s" onclick="pgHome()">Menu</button></div>`;return;}
 const p=pgO[pgI];pgDone=false;const opts=shuf([p[1],p[2]]);
 v.innerHTML=`<div class="card" ${ca(p[4])}><div class="stat"><span>Piège <b>${pgI+1}/${pgO.length}</b></span><span>Score <b>${pgS}</b></span><span>Série <b>${pgStreak}</b> 🔥</span><span>Record <b>${pgBest}</b></span></div><div class="bar"><div style="width:${pgI/pgO.length*100}%"></div></div>
 <span class="tag">${COLN[p[4]]}</span><div class="big">${p[0]}</div>
 <div class="duel">${opts.map(o=>`<button onclick="pgPick(this,'${esc(o)}')">${o}</button>`).join("")}</div><div id="pgf"></div></div>`;}
window.pgPick=(btn,o)=>{if(pgDone)return;pgDone=true;const p=pgO[pgI],ok=o===p[1];
 [...btn.parentNode.children].forEach(b=>{if(b.textContent===p[1])b.classList.add("good");else if(b===btn)b.classList.add("bad");});
 if(ok){pgS++;pgStreak++;pgBest=Math.max(pgBest,pgStreak);}else{pgStreak=0;pgW.push(p);}
 $("pgf").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Oui!":"❌ Piège!"} <b>${p[1]}</b>, pas ${p[2]}.<div class="tip">${p[3]}</div></div><button class="p" id="pgn" onclick="pgI++;pgRender()">Suivant →</button>`;$("pgn").focus();};
pgHome();

/* ④ ASSOCIER */
let asN,asSel,asErr,asLeft;
function asHome(){$("v-assoc").innerHTML=`<div class="card"><h2>🔗 Associer</h2><p>Clique un élément à gauche, puis sa définition à droite.</p>${Object.entries(AS).map(([n,d])=>`<button class="chip" ${ca(d.c)} style="--a:${COL[d.c]};margin:4px" onclick="asStart('${esc(n)}')">${n}</button>`).join("")}</div><div id="asb"></div>`;}
window.asStart=n=>{asN=n;asSel=null;asErr=0;const d=AS[n];asLeft=d.p.length;
 $("asb").innerHTML=`<div class="card" ${ca(d.c)}><h2 style="color:${COL[d.c]}">${n}</h2><div class="stat"><span>Restant <b id="asr">${asLeft}</b></span><span>Erreurs <b id="ase">0</b></span></div>
 <div class="cols"><div>${shuf(d.p.map((x,i)=>[x[0],i])).map(([t,i])=>`<div class="tile" data-i="${i}" data-s="L" onclick="asClick(this)">${t}</div>`).join("")}</div>
 <div>${shuf(d.p.map((x,i)=>[x[1],i])).map(([t,i])=>`<div class="tile" data-i="${i}" data-s="R" onclick="asClick(this)">${t}</div>`).join("")}</div></div><div id="asf"></div></div>`;$("asb").scrollIntoView({behavior:"smooth"});};
window.asClick=el=>{if(el.classList.contains("done"))return;
 if(!asSel||asSel.dataset.s===el.dataset.s){if(asSel)asSel.classList.remove("sel");asSel=el;el.classList.add("sel");return;}
 if(asSel.dataset.i===el.dataset.i){[asSel,el].forEach(t=>{t.classList.remove("sel");t.classList.add("done");});asSel=null;asLeft--;$("asr").textContent=asLeft;
  if(!asLeft)$("asf").innerHTML=`<div class="fb ok">${asErr===0?"🔥 Parfait, zéro erreur!":"✅ Terminé avec "+asErr+" erreur(s). Refais-le pour viser 0."}</div><button class="p" onclick="asStart('${esc(asN)}')">Refaire</button>`;}
 else{asErr++;$("ase").textContent=asErr;const a=asSel;[a,el].forEach(t=>t.classList.add("bad"));setTimeout(()=>{[a,el].forEach(t=>t.classList.remove("bad","sel"));},450);asSel=null;}};
asHome();

/* ⑤ CAS PRATIQUES */
let csN,csO,csI,csS,csW,csDone;
function csHome(){$("v-cas").innerHTML=`<div class="card"><h2>🧩 Cas pratiques</h2><p>Une situation concrète, tu choisis la bonne catégorie. C'est le format des questions d'application.</p>${Object.entries(CAS).map(([n,d])=>`<button class="chip" style="--a:${COL[d.c]};margin:4px" onclick="csStart('${esc(n)}')">${n} (${d.q.length})</button>`).join("")}<br><button class="p" style="margin-top:12px" onclick="csStart('🔀 Tout mélangé')">🔀 Tout mélangé (${Object.values(CAS).reduce((s,d)=>s+d.q.length,0)})</button></div><div id="csb"></div>`;}
window.csStart=(n,list)=>{csN=n;const all=list||(n==="🔀 Tout mélangé"?Object.entries(CAS).flatMap(([k,d])=>d.q.map(q=>[q[0],q[1],k])):CAS[n].q.map(q=>[q[0],q[1],n]));csO=shuf(all);csI=0;csS=0;csW=[];csRender();$("csb").scrollIntoView({behavior:"smooth"});};
function csRender(){const b=$("csb");if(csI>=csO.length){b.innerHTML=`<div class="card"><h2>Score : ${csS}/${csO.length}</h2>${csW.length?`<h3>À revoir</h3><ul class="err">${csW.map(q=>`<li>${q[0]} → <b>${q[1]}</b></li>`).join("")}</ul><button class="p" onclick="csStart(csN,csW.slice())">Refaire mes erreurs (${csW.length})</button>`:"<p>🔥 Parfait!</p>"}<button class="s" onclick="csStart(csN)">Recommencer</button></div>`;return;}
 const q=csO[csI],d=CAS[q[2]];csDone=false;
 b.innerHTML=`<div class="card" ${ca(d.c)}><div class="stat"><span>Cas <b>${csI+1}/${csO.length}</b></span><span>Score <b>${csS}</b></span></div><div class="bar"><div style="width:${csI/csO.length*100}%"></div></div>
 <span class="tag">${q[2]}</span><div class="big">${q[0]}</div><div class="opts">${d.o.map(o=>`<button onclick="csPick(this,'${esc(o)}')">${o}</button>`).join("")}</div><div id="csf"></div></div>`;}
window.csPick=(btn,o)=>{if(csDone)return;csDone=true;const q=csO[csI],ok=o===q[1];
 [...btn.parentNode.children].forEach(x=>{if(x.textContent===q[1])x.classList.add("good");else if(x===btn)x.classList.add("bad");});
 if(ok)csS++;else csW.push(q);
 $("csf").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Bonne réponse!":"❌ C'était : <b>"+q[1]+"</b>"}</div><button class="p" id="csn" onclick="csI++;csRender()">Suivant →</button>`;$("csn").focus();};
csHome();

/* ⑥ ORDRE */
let orN,orNext,orErr;
function orHome(){$("v-ordre").innerHTML=`<div class="card"><h2>🔢 Mettre en ordre</h2><p>Clique les étapes dans le bon ordre.</p>${Object.entries(ORD).map(([n,d])=>`<button class="chip" style="--a:${COL[d.c]};margin:4px" onclick="orStart('${esc(n)}')">${n}</button>`).join("")}</div><div id="orb"></div>`;}
window.orStart=n=>{orN=n;orNext=0;orErr=0;const d=ORD[n];
 $("orb").innerHTML=`<div class="card" ${ca(d.c)}><h2 style="color:${COL[d.c]}">${n}</h2><div class="stat"><span>Erreurs <b id="ore">0</b></span></div><ol class="seq" id="ors"></ol>
 <div class="opts" id="oro">${shuf(d.s.map((s,i)=>[s,i])).map(([s,i])=>`<button data-i="${i}" onclick="orPick(this)">${s}</button>`).join("")}</div><div id="orf"></div></div>`;$("orb").scrollIntoView({behavior:"smooth"});};
window.orPick=btn=>{const d=ORD[orN];if(+btn.dataset.i===orNext){$("ors").insertAdjacentHTML("beforeend",`<li>${btn.textContent}</li>`);btn.remove();orNext++;
  if(orNext===d.s.length)$("orf").innerHTML=`<div class="fb ok">${orErr?"✅ Terminé avec "+orErr+" erreur(s). Recommence pour viser 0.":"🔥 Parfait du premier coup!"}</div><button class="p" onclick="orStart('${esc(orN)}')">Refaire</button>`;}
 else{orErr++;$("ore").textContent=orErr;btn.classList.add("bad");setTimeout(()=>btn.classList.remove("bad"),450);}};
orHome();

/* ⑦ QUIZ ÉCRIT */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}
const words=a=>a.split(/[^a-z0-9-]+/).filter(Boolean);
function has(a,kk){if(a.includes(kk))return true;if(kk.includes(" ")||kk.length<5)return false;const tol=kk.length>=8?2:1;
 return words(a).some(w=>{for(let L=kk.length-1;L<=kk.length+1;L++){if(w.length>=L-1&&lev(w.slice(0,L),kk)<=tol)return true;}return false;});}
function match(a,k){const kk=norm(k);
 if(kk==="#incond")return a.includes("inconditionn")||a.includes("inconditon");
 if(kk==="#cond")return /conditionn|conditon/.test(a.replace(/inconditi?on+\w*/g,""));
 if(kk[0]==="="){const t=kk.slice(1);return words(a).some(w=>w===t||(t.length>=6&&lev(w,t)<=1));}
 if(kk[0]==="!"){const t=kk.slice(1);return words(a).some(w=>w.startsWith(t));}
 if(/^\d+$/.test(kk))return new RegExp("(^|\\D)"+kk+"(\\D|$)").test(a);
 return has(a,kk);}
function check(q,a){a=norm(a);const r=q[2];if(!Array.isArray(r))return r.k.filter(g=>g.some(k=>match(a,k))).length>=r.n;return r.every(g=>g.some(k=>match(a,k)));}
let qzF=new Set(Object.keys(COL)),qzO,qzI,qzS,qzW,qzDone,qzRound=1;
function qzHome(){$("v-quiz").innerHTML=`<div class="card"><h2>✍️ Quiz écrit</h2><p>Tu écris la réponse. Accents, majuscules et petites fautes sont acceptés. Après chaque question : la réponse + un truc de la couleur du thème.</p>
<div class="chips">${Object.keys(COL).map(k=>`<button class="chip ${qzF.has(k)?"on":""}" ${ca(k)} onclick="qzTog('${k}')">${COLN[k]} (${Q.filter(q=>q[0]===k).length})</button>`).join("")}</div>
<button class="p" onclick="qzGo()">Commencer (${Q.filter(q=>qzF.has(q[0])).length} questions)</button></div>`;}
window.qzTog=k=>{qzF.has(k)?qzF.delete(k):qzF.add(k);qzHome();};
window.qzGo=()=>{const l=Q.filter(q=>qzF.has(q[0]));if(!l.length)return;qzRound=1;qzStart(l);};
function qzStart(l){qzO=shuf(l);qzI=0;qzS=0;qzW=[];qzRender();}
function qzRender(){const v=$("v-quiz");if(qzI>=qzO.length)return qzEnd();const q=qzO[qzI];qzDone=false;
 v.innerHTML=`<div class="card" ${ca(q[0])}><div class="stat"><span>Question <b>${qzI+1}/${qzO.length}</b> ${qzRound>1?"(reprise des erreurs)":""}</span><span>Score <b>${qzS}</b></span></div><div class="bar"><div style="width:${qzI/qzO.length*100}%"></div></div>
 <span class="tag">${COLN[q[0]]}</span><div class="big">${q[1]}</div><input id="qa" autocomplete="off" placeholder="Écris ta réponse…"><div class="mut" style="margin-top:5px">Entrée = valider</div>
 <div id="qf"></div><div id="qb"><button class="p" onclick="qzSub()">Valider</button><button class="s" onclick="qzSub(true)">Je sais pas</button></div></div>`;
 const i=$("qa");i.focus();i.onkeydown=e=>{if(e.key==="Enter"){qzDone?qzNext():qzSub();}};}
window.qzSub=skip=>{if(qzDone)return;const q=qzO[qzI],a=$("qa").value;if(!skip&&!a.trim())return;qzDone=true;
 const ok=!skip&&check(q,a);if(ok)qzS++;else qzW.push(q);
 $("qf").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Bonne réponse!":"❌ Pas tout à fait."}<br><b>Réponse :</b> ${q[3]}<div class="tip">${TRUC[q[0]]}</div></div>`;
 $("qb").innerHTML=`<button class="p" onclick="qzNext()">Suivante →</button>${ok||skip?"":`<button class="s" onclick="qzOver()">J'avais raison</button>`}`;$("qa").focus();};
window.qzOver=()=>{qzS++;qzW.pop();qzNext();};
window.qzNext=()=>{qzI++;qzRender();};
function qzEnd(){const pct=Math.round(qzS/qzO.length*100);
 $("v-quiz").innerHTML=`<div class="card"><h2>Terminé! ${qzS}/${qzO.length} (${pct} %)</h2><p>${pct>=90?"🔥 T'es prêt.":pct>=70?"👍 Pas pire! Revois tes erreurs.":"📖 Relis la fiche des couleurs où tu as le plus d'erreurs, puis refais-les."}</p>
 ${qzW.length?`<h3>À revoir</h3><ul class="err">${qzW.map(q=>`<li ${ca(q[0])}><span class="tag">${COLN[q[0]]}</span> <b>${q[1]}</b><br>→ ${q[3]}</li>`).join("")}</ul><button class="p" onclick="qzRound++;qzStart(qzW.slice())">Refaire seulement mes erreurs (${qzW.length})</button>`:""}
 <button class="s" onclick="qzHome()">Menu du quiz</button></div>`;}
qzHome();
show("plan");

</script>
