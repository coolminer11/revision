 --cli:#f59e0b;--str:#8b5cf6;--p1:#3b82f6;--p2:#10b981;--p3:#f97316;--p4:#ef4444;--p5:#06b6d4;--rap:#64748b;--a:var(--b)}

<div id="v-plan"></div><div id="v-histoire" hidden></div><div id="v-blurt" hidden></div><div id="v-assoc" hidden></div>

</div>
<script>
const $=i=>document.getElementById(i);
const nrm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ").replace(/\s+/g," ");
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const TABS=[["plan","① Méthode"],["histoire","② L'histoire"],["blurt","③ Vide-cerveau"],["assoc","④ Associer"],["cas","⑤ Cas 4P"],["trier","⑥ Trier"],["ordre","⑦ Mettre en ordre"],["quiz","⑧ Quiz final"]];
function show(t){TABS.forEach(([k])=>{$("v-"+k).hidden=k!==t;});[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));window.scrollTo(0,0);}
$("nav").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" onclick="show('${k}')">${l}</button>`).join("");

/* ① MÉTHODE */
$("v-plan").innerHTML=`<div class="card"><h2>🎯 Comment apprendre le marketing VITE</h2>
<p>Les chapitres 4 et 5, c'est une seule grosse chaîne : <b>comprendre le client → choisir qui on vise → bâtir les 4P</b>. Si tu retiens la chaîne, les définitions rentrent toutes seules. Fais les onglets dans l'ordre.</p>
<table style="width:100%;text-align:left"><tr><th>Onglet</th><th>Ce que ça fait</th><th>Temps</th></tr>
<tr><td>② L'histoire</td><td>Toute la matière en une chaîne logique, avec les rappels des ch. 1-3 dont t'as besoin (FFOM, PESTE, besoins, mission).</td><td>10 min</td></tr>
<tr><td>③ Vide-cerveau</td><td><b>Blurting</b> : tu écris tout de mémoire, la page te dit ce qui manque.</td><td>5 min/thème</td></tr>
<tr><td>④ Associer</td><td>Relier chaque terme à sa définition — c'est là que tu arrêtes de mélanger segmentation/ciblage/positionnement.</td><td>10 min</td></tr>
<tr><td>⑤ Cas 4P</td><td>Une situation → quel P? C'est le type de question d'exam le plus fréquent.</td><td>10 min</td></tr>
<tr><td>⑥ Trier</td><td>Classer : critères de segmentation, phases du cycle de vie, types d'intermédiaires, etc.</td><td>10 min</td></tr>
<tr><td>⑦ Mettre en ordre</td><td>Les processus (plan de marketing, achat, développement de produit) remis dans le bon ordre.</td><td>5 min</td></tr>
<tr><td>⑧ Quiz final</td><td>Réponses écrites, puis reprise de tes erreurs jusqu'à 0.</td><td>25 min</td></tr></table>
<h3>Les 4 règles</h3>
<ol><li><b>Essaie avant de regarder.</b> Se tromper puis voir la réponse, ça imprime 2× mieux que relire.</li>
<li><b>Explique à voix haute</b> comme à un ami de 12 ans. Si tu bloques, c'est un trou.</li>
<li><b>Refais tes erreurs</b> 10 min plus tard, puis une fois avant l'exam.</li>
<li><b>Pour chaque concept, invente TON exemple</b> (une marque que t'aimes). Un exemple personnel se retient 10× mieux qu'une définition.</li></ol>
<h3>🎨 Le code de couleurs</h3>
<p>Chaque notion garde <b>toujours la même couleur</b>, dans tous les onglets. Ton cerveau retient la couleur avant le mot : quand tu vois orange à l'exam, tu penses « distribution ».</p>
<div class="leg">
<span class="lg c-cli">🟡 Client · besoins · recherche</span><span class="lg c-str">🟣 Stratégie · S-C-P · plan</span>
<span class="lg c-p1">🔵 P1 Produit</span><span class="lg c-p2">🟢 P2 Prix</span><span class="lg c-p3">🟠 P3 Place</span>
<span class="lg c-p4">🔴 P4 Promotion</span><span class="lg c-p5">🩵 P5 People</span><span class="lg c-rap">⬜ Rappels ch. 1-3</span></div>
<button class="p" onclick="show('histoire')">Commencer → L'histoire</button></div>`;

/* ② HISTOIRE */
$("v-histoire").innerHTML=`<div class="card story"><h2>📖 Ch. 4 et 5 en une histoire</h2>
<p>Lis 2 fois, puis raconte-la à voix haute. Les <span class="rap">encadrés bleus</span> sont les rappels des chapitres 1-3 sans lesquels le reste ne tient pas debout.</p>

<h3>0. D'où ça vient (rappel ch. 1-3)</h3>
<div class="rap">L'entreprise a <b>4 grandes fonctions</b> : Finance-Comptabilité, <b>Marketing</b>, Production, RH. Le marketing, c'est donc <b>une fonction</b> de l'entreprise, pas l'entreprise au complet. Et avant de décider quoi que ce soit, le gestionnaire <b>planifie</b> (le P de PODC) : il part de la <b>mission</b>, analyse l'externe avec <b>PESTE</b> et l'interne avec <b>FFOM</b>, puis fixe ses objectifs. Le plan de marketing, c'est exactement cette démarche appliquée au client.</div>

<h3 class="h-cli">1. C'est quoi le marketing</h3>
<p>Le <b>marketing</b> = l'ensemble des activités qui consistent à <b>cerner (identifier) des clients potentiels</b> — le <b>marché cible</b> — à <b>concevoir des produits adaptés</b>, et à établir les <b>politiques de prix, de distribution, de communication et de vente</b>. Bref : <b>le bon produit, au bon prix, à la bonne place, avec le bon message</b>.</p>
<p>Le marketing a évolué : économie de subsistance → orientation <b>production</b> (1800) → orientation <b>vente</b> (1900) → orientation <b>marketing</b> (1950) → <b>postindustriel</b> (1985) → <b>social, mobile et individualisé</b> (2015).</p>
<p>Deux grands types : le marketing <b>spécialisé (de grande consommation, B2C)</b>, qui vise le consommateur, et le marketing <b>industriel (B2B)</b>, qui vise les entreprises — moins d'acheteurs, contrats plus gros, décision plus rationnelle et plus longue.</p>

<h3 class="h-cli">2. Satisfaire le client</h3>
<p>L'offre doit être meilleure que celle des concurrents. On y arrive en satisfaisant :</p>
<ul><li>le <b>besoin</b> : un sentiment de manque ou de privation qui pousse à agir (manger, se sentir en sécurité);</li>
<li>le <b>désir</b> : l'envie particulière, indépendante du besoin (vouloir un Big Mac plutôt qu'un sandwich);</li>
<li>l'<b>utilité</b> du bien ou du service, qui existe en 4 formes : <b>forme</b> (transformer la matière), <b>temps</b> (dispo au bon moment), <b>emplacement</b> (dispo au bon endroit), <b>possession</b> (facilité du transfert du droit d'utilisation).</li></ul>
<div class="rap">Rappel ch. 3 : les besoins, c'est la <b>pyramide de Maslow</b> (physiologiques, sécurité, appartenance, estime, accomplissement). Le marketing s'adresse à ces niveaux : une auto de luxe vise l'estime, une assurance vise la sécurité.</div>

<h3 class="h-cli">3. Comprendre le client : la recherche marketing</h3>
<p><b>Recherche marketing</b> = processus qui consiste à <b>recueillir</b> et à <b>analyser</b> systématiquement des renseignements sur les <b>clients potentiels</b> et sur les produits susceptibles de les intéresser, afin de prendre des décisions conformes au marché.</p>
<ul><li><b>Données secondaires</b> : déjà recueillies par d'autres, faciles à consulter (Statistique Canada, nouvelles, taux d'intérêt).</li>
<li><b>Données primaires</b> : n'existent pas encore, on va les chercher soi-même (sondage, observation, expérimentation, entrevue).</li>
<li><b>Recherche qualitative</b> (pourquoi : groupe de discussion, entrevue en profondeur, client-mystère) vs <b>quantitative</b> (combien : sondage, analyse statistique).</li>
<li><b>Instruments de mesure</b> : questionnaire, grille d'observation, schéma d'entrevue, photo, vidéo.</li></ul>

<h3 class="h-cli">4. Pourquoi j'achète</h3>
<p><b>Facteurs liés à l'individu</b> : image de soi, perception, attitudes (→ <b>émotions</b>) et budget (→ <b>raison</b>). <b>Facteurs liés à l'environnement</b> : stimuli marketing (prix, pub, disponibilité), stimuli environnementaux, groupe d'appartenance (classe sociale, famille, culture).</p>
<p>La <b>situation d'achat</b> change tout : <b>achat répétitif</b> (routine, ex. pinte de lait) ou <b>achat réfléchi</b> (on compare, ex. voiture).</p>
<p><b>Processus d'achat</b> : ① reconnaissance du besoin → ② recherche d'information → ③ évaluation des options → ④ décision et achat → ⑤ évaluation après l'achat (satisfaction, fidélité ou regret).</p>

<h3 class="h-str">5. S-C-P : segmentation, ciblage, positionnement ⭐</h3>
<ul><li><b>Segmentation</b> : diviser le marché en groupes d'individus <b>semblables</b>, caractérisés par leur <b>comportement d'achat</b> ou leurs besoins. 4 familles de critères : <b>géographiques</b> (densité, climat), <b>démographiques</b> (âge, revenu, culture), <b>psychologiques</b> (opinions, goûts, style de vie), <b>comportementaux</b> (fréquence d'achat, quantité achetée).</li>
<li><b>Ciblage</b> : choisir les <b>segments</b> auxquels l'entreprise va s'adresser. Le segment choisi = le <b>marché cible</b>.</li>
<li><b>Le segment, c'est une petite part du marché total</b> (fig. 4.5, les shampoings) : le marché complet = l'offre de tous les concurrents; ton segment = une pointe de cette tarte; ta part dans ce segment = une pointe de la pointe.</li>
<li><b>Positionnement</b> : la <b>place particulière</b> qu'occupe le produit par rapport aux concurrents <b>dans l'esprit</b> de la clientèle cible (haut, milieu ou bas de gamme, sportif, écolo…).</li></ul>
<div class="mn">🧠 <b>S → C → P</b> : je <b>découpe</b> le gâteau (segmentation), je <b>choisis ma pointe</b> (ciblage), je décide <b>quel goût elle a dans leur tête</b> (positionnement).</div>

<h3 class="h-str">6. La stratégie et le plan de marketing</h3>
<p>La <b>stratégie de marketing</b> = l'approche générale du marché : les grandes orientations et les activités à réaliser, en adaptant le marketing mix à la clientèle cible. Avant : on examine l'environnement <b>PESTE</b> (concurrence, politique, législation, économie, marché, technologies).</p>
<p><b>Le plan de marketing en 6 étapes (fig. 4.6)</b> : ① <b>Analyse FFOM</b> → ② <b>Segmentation, ciblage, positionnement</b> → ③ <b>Stratégie d'entreprise</b> (différenciation = faire mieux, bas prix, ou meilleur service → <b>avantage concurrentiel / valeur ajoutée</b>) → ④ <b>Stratégie de marketing</b> → ⑤ <b>Choix du marketing mix</b> (les variables que l'entreprise maîtrise) → ⑥ <b>Plan de marketing</b> (mise en application).</p>
<div class="rap">Rappel ch. 2 : <b>FFOM</b> = Forces et Faiblesses (interne) + Opportunités et Menaces (externe). <b>PESTE</b> = Politique, Économique, Social, Technologique, Écologique (macro-environnement externe). Le plan de marketing commence par ces deux analyses — c'est la même démarche qu'au chapitre 2.</div>

<h3 class="h-cli">7. Le commerce électronique</h3>
<p>Avantages : marché mondial, ouvert 24/7, coûts réduits, personnalisation, comparaison facile. Nouveaux comportements : clients <b>mieux renseignés</b>, <b>achat compulsif</b> avec livraison, plateformes <b>GAFA</b>, systèmes de paiement (PayPal), assistants virtuels et objets connectés.</p>

<h3 class="h-str">8. Chapitre 5 : le marketing mix = les 4P ⭐⭐</h3>
<p>Le <b>marketing mix</b> = la combinaison et le dosage des 4 éléments de la politique commerciale : <b>Produit, Prix, Place (distribution), Promotion (communication)</b>. Aujourd'hui on ajoute un <b>5e P : People</b> (le personnel / la relation client), ce qui donne les <b>5 variables</b> : produit, prix, distribution, communication marketing et <b>gestion de la relation client</b>.</p>
<p>Ces variables sont celles que l'entreprise <b>maîtrise</b> (étape 5 du plan de marketing) — contrairement à PESTE, qu'elle subit.</p>

<h4 class="h-p1">P1 — Le produit</h4>
<p>Le produit = la <b>promesse</b> faite par l'entreprise de <b>satisfaire un ou plusieurs besoins</b> (physiologiques ou psychologiques) du client.</p>
<ul><li><b>Caractéristiques du service</b> : <b>intangible</b>, <b>périssable</b> (offert et consommé au même moment, on ne peut pas le stocker), <b>inséparable</b> de la personne qui le rend, <b>variable</b> (les relations humaines font la qualité).</li>
<li><b>Produits de consommation</b> : de <b>grande consommation</b> (peu personnalisés, peu coûteux), de <b>longue durée</b> (achats réfléchis : ordi, voiture), de <b>conviction</b> (on tient à la marque). <b>Produits industriels</b> : destinés à produire d'autres produits, souvent plus <b>chers</b> mais <b>moins nombreux</b> (moins d'acheteurs).</li>
<li><b>Emballage (packaging)</b> : ensemble des opérations assurant la <b>protection</b> du produit et facilitant sa <b>manutention / son transport</b>. <b>Conditionnement</b> : individuel, par lot, en vrac + graphisme, couleur, forme, esthétique.</li>
<li><b>Marque</b> : symbole ou nom retenu pour <b>identifier</b> ses produits et les <b>distinguer</b> de ceux des <b>concurrents</b>. La <b>marque maison (marque du distributeur)</b> appartient au détaillant (Sélection, Le Choix du Président).</li>
<li><b>Processus de développement</b> : naissance des idées → tri des idées → analyse de valeur et de rentabilité → prototypage → test de marché → commercialisation.</li>
<li><b>Cycle de vie</b> : développement → <b>introduction</b> (lancement, profits négatifs) → <b>croissance</b> (ventes montent, <b>zone de turbulence</b> : les concurrents arrivent) → <b>maturité</b> (sommet des ventes) → <b>déclin</b>.</li></ul>
<table><tr><th>Phase</th><th>Ce que fait le marketing mix</th><th>Exemple du livre</th></tr>
<tr><td>Introduction</td><td>Faire connaître : beaucoup de publicité, prix d'écrémage ou de pénétration, distribution limitée</td><td>Montre intelligente</td></tr>
<tr><td>Croissance</td><td>Élargir la distribution, améliorer le produit, prix qui commence à baisser</td><td>Voiture 100 % électrique</td></tr>
<tr><td>Maturité</td><td>Se défendre : promotions, rabais, nouvelles versions, fidélisation</td><td>Téléphone intelligent</td></tr>
<tr><td>Déclin</td><td>Réduire les coûts, retirer le produit ou le relancer</td><td>Téléphonie résidentielle</td></tr></table>
<div class="rap">Rappel ch. 2 : un produit <b>industriel</b> ici = le <b>bien intermédiaire</b> en économie (il sert à produire autre chose); un produit de consommation = le <b>bien final</b>. Même idée, deux vocabulaires.</div>

<h4 class="h-p2">P2 — Le prix</h4>
<p>Éléments qui influencent le prix : avantages vs concurrents, <b>positionnement</b> (haut/milieu/bas de gamme), <b>demande du marché</b>, coûts et capacité de production, <b>phase du cycle de vie</b>, prix des concurrents, marges exigées par les intermédiaires, <b>concurrence</b>, perception du rapport qualité-prix.</p>
<p>Le consommateur a une idée du prix qu'il est prêt à payer : il cherche un prix <b>juste</b> et <b>raisonnable</b>. D'où l'importance de sa <b>perception</b>.</p>
<p><b>3 stratégies de prix</b> : <b>prix d'écrémage</b> (nouveau produit vendu <b>cher</b>, ex. téléviseur numérique), <b>prix de pénétration</b> (vendu <b>bas</b> pour entrer sur le marché et réduire la concurrence, ex. imprimante presque gratuite et cartouches chères), <b>prix dynamique (flexible)</b> (ajusté en temps réel selon l'offre et la demande, ex. billets d'avion, hôtels).</p>
<div class="rap">Rappel économie : le prix d'équilibre vient de l'<b>offre et de la demande</b>. Le prix dynamique, c'est littéralement cette loi appliquée minute par minute.</div>

<h4 class="h-p3">P3 — La distribution (place)</h4>
<p>Ensemble des opérations qui assurent l'<b>acheminement et l'écoulement</b> du produit, de sa fabrication jusqu'à son acquisition : le rendre accessible <b>à l'endroit</b>, <b>à l'heure</b> et <b>dans le délai</b> voulus par le client.</p>
<ul><li><b>Distribution directe</b> : l'entreprise vend elle-même (magasin, hors magasin, catalogue, Internet, distributrices).</li>
<li><b>Distribution indirecte</b> : recours à des <b>intermédiaires</b> — <b>détaillants</b> (vendent aux consommateurs), <b>grossistes</b> (vendent à d'autres intermédiaires), <b>distributeurs</b> (fournisseurs industriels), <b>agents</b> (représentants locaux d'une société), <b>courtiers</b> (intermédiaires entre acheteur et vendeur).</li>
<li><b>2 stratégies</b> : <b>pull (attraction)</b> = Entreprise → publicité → consommateurs → réseau de distribution (le client réclame le produit). <b>Push (pression)</b> = Entreprise → représentants → réseau de distribution → consommateurs (on pousse le produit vers le client).</li></ul>
<div class="mn">🧠 <b>Pull</b> = je <b>tire</b> le client vers le produit avec de la pub. <b>Push</b> = je <b>pousse</b> le produit dans les tablettes avec des vendeurs.</div>

<h4 class="h-p4">P4 — La communication (promotion)</h4>
<p>4 grandes catégories de moyens :</p>
<ul><li><b>La publicité</b> : forme <b>payée</b> et <b>non personnelle</b> de diffusion d'idées, de biens ou de services dans un média, au bénéfice d'un <b>annonceur clairement désigné</b>. Elle fait la prévente et donne la <b>notoriété</b>. Le <b>plan média</b> choisit les médias selon la tâche de communication et la clientèle. Le <b>marketing relationnel (direct)</b> vise à créer ou entretenir des liens <b>personnalisés</b> de confiance (courriel, poste, téléphone) — pas en personne.</li>
<li><b>La vente personnelle</b> : le point de contact <b>humain</b>, la <b>force de vente</b>. Communication à <b>deux sens</b>, qui s'adapte au client.</li>
<li><b>La promotion des ventes</b> : interventions qui stimulent la vente de façon <b>directe</b> en entraînant une <b>action immédiate</b> (coupon, concours, prime, échantillon, dégustation, promotion croisée).</li>
<li><b>Les médias sociaux et les relations publiques</b>. Médias sociaux : médias numériques qui facilitent la <b>création</b> et le <b>partage</b> de contenu généré par les utilisateurs, communication <b>bidirectionnelle</b>. Relations publiques : techniques pour donner au public une <b>image positive</b> et créer un climat favorable à la croissance.</li></ul>

<h4 class="h-p5">P5 — People (le 5e P)</h4>
<p>Développer une <b>approche client</b> (vers la <b>fidélisation</b>), augmenter la <b>satisfaction</b>, offrir un service <b>personnalisé</b>, maintenir les <b>normes de service</b> : l'ensemble des caractéristiques définissant le <b>taux de service</b> à assurer et la <b>qualité de prestation</b> à offrir.</p>

<h3 class="h-str">9. L'exercice type de l'exam : décrire un segment</h3>
<p>Le prof donne un véhicule (ou un produit) et demande le <b>profil du segment cible</b> + le <b>critère de segmentation</b> pour chaque élément. Exemple corrigé avec la Honda Civic type R :</p>
<table><tr><th>Élément du profil</th><th>Critère</th></tr>
<tr><td>Homme de 25 à 30 ans</td><td>Démographique (âge, sexe)</td></tr>
<tr><td>Revenu de 45 000 $, scolarité secondaire</td><td>Démographique (revenu, scolarité)</td></tr>
<tr><td>Mode de vie festif, fréquente les bars</td><td>Psychologique (style de vie)</td></tr>
<tr><td>Accro à l'adrénaline, conduit vite</td><td>Psychologique (goûts, personnalité)</td></tr></table>
<p>Réflexe : <b>qui il est</b> → démographique · <b>où il vit</b> → géographique · <b>ce qu'il aime / pense</b> → psychologique · <b>comment il achète</b> → comportemental.</p>

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ").replace(/\s+/g," ");
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}
function has(a,kk){
 if(a.includes(kk))return true;
 if(kk.includes(" ")||kk.length<5)return false;
 const tol=kk.length>=8?2:1;
 return a.split(/[^a-z0-9-]+/).some(w=>{for(let L=kk.length-1;L<=kk.length+1;L++){if(w.length>=L-1&&lev(w.slice(0,L),kk)<=tol)return true;}return false;});
}
function check(q,a){
 a=norm(a).replace(/\bil+imit/g,"illimit").replace(/\bdecentrali/g,"decentrali");
 const noIll=a.replace(/illimit\w*/g,""), noDec=a.replace(/decentralis\w*/g,"");
 return q[2].every(g=>g.some(k=>{const kk=norm(k);
   if(/^\d+$/.test(kk))return new RegExp("(^|\\D)"+kk+"(\\D|$)").test(a);
   if(kk==="limit")return /limit/.test(noIll);
   if(kk==="centralisation")return has(noDec,kk);
   if(kk==="illimit")return /illimit/.test(a);
   if(["micro","macro","officieuse"].includes(kk))return a.includes(kk.slice(0,5));
   return has(a,kk);}));
}
const TRUC={

const truc=q=>{for(const k in TRUC)if(q[1].startsWith(k))return TRUC[k];return"";};
let order,i,score,wrong,done,round=1;
function start(list){order=list.slice().sort(()=>Math.random()-.5);i=0;score=0;wrong=[];render();}
const app=document.getElementById('app');
function render(){
 if(i>=order.length)return end();
 const q=order[i];done=false;
 app.innerHTML=`<div class="top"><span>Question ${i+1}/${order.length} ${round>1?"(reprise des erreurs)":""}</span><span>Score : ${score}</span></div>
 <div class="bar"><div style="width:${i/order.length*100}%"></div></div>
 <span class="ch ch-${q[0]}">${q[0]}</span><h2>${q[1]}</h2>
 <input id="a" autocomplete="off" placeholder="Écris ta réponse…">
 <div class="hint">Entrée = valider · accents, majuscules et petites fautes d'orthographe acceptés</div>
 <div id="f"></div><div id="b"><button class="p" onclick="sub()">Valider</button><button class="s" onclick="sub(true)">Je sais pas</button></div>`;
 const inp=document.getElementById('a');inp.focus();
 inp.onkeydown=e=>{if(e.key==="Enter"){done?next():sub()}};
}
window.sub=function(skip){if(done)return;done=true;const q=order[i],a=document.getElementById('a').value;
 const ok=!skip&&a.trim()&&check(q,a);if(ok)score++;else wrong.push(q);
 document.getElementById('f').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Bonne réponse!':'❌ Pas tout à fait.'}<br><b>Réponse :</b> ${q[3]}${truc(q)?'<div style="margin-top:6px">'+truc(q)+'</div>':''}</div>`;
 document.getElementById('b').innerHTML=`<button class="p" onclick="next()">Suivante →</button>${ok?'':(a.trim()?'<button class="s" onclick="override()">J\'avais raison</button>':'')}`;
 document.getElementById('a').focus();
};
window.hint=function(){const t=truc(order[i]);document.getElementById('f').innerHTML=`<div class="fb" style="background:#fff8db;border-left:4px solid #d4a017">${t}</div>`;document.getElementById('a').focus();};
window.override=function(){score++;wrong.pop();next();};
window.next=function(){i++;render();};
function end(){const pct=Math.round(score/order.length*100);
 app.innerHTML=`<h2>Terminé! ${score}/${order.length} (${pct} %)</h2>
 <p>${pct>=90?'🔥 T\'es prêt.':pct>=70?'👍 Bon, révise les erreurs ci-dessous.':'📖 Relis la fiche pour les sujets manqués, puis refais les erreurs.'}</p>
 ${wrong.length?`<h3>À revoir :</h3><ul>${wrong.map(q=>`<li><b>${q[1]}</b><br>→ ${q[3]}${truc(q)?'<br><small>'+truc(q)+'</small>':''}</li>`).join('')}</ul>
 <button class="p" onclick="retry()">Refaire seulement mes erreurs (${wrong.length})</button>`:''}
 <button class="s" onclick="round=1;start(Q)">Recommencer tout</button>`;}
window.retry=function(){round++;start(wrong);};
start(Q);

</script></body></html>
