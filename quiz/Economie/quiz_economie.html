const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ").replace(/\s+/g," ");
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}
function has(a,kk){
 if(a.includes(kk))return true;
 if(kk.includes(" ")||kk.length<5)return false;
 const tol=kk.length>=8?2:1;
 return a.split(/[^a-z0-9-]+/).some(w=>{for(let L=kk.length-1;L<=kk.length+1;L++){if(w.length>=L-1&&lev(w.slice(0,L),kk)<=tol)return true;}return false;});
}
function check(q,a){
 a=norm(a).replace(/\bil+imit/g,"illimit").replace(/\bdecentrali/g,"decentrali");
 const noIll=a.replace(/illimit\w*/g,""), noDec=a.replace(/decentralis\w*/g,"");
 return q[2].every(g=>g.some(k=>{const kk=norm(k);
   if(/^\d+$/.test(kk))return new RegExp("(^|\\D)"+kk+"(\\D|$)").test(a);
   if(kk==="limit")return /limit/.test(noIll);
   if(kk==="centralisation")return has(noDec,kk);
   if(kk==="illimit")return /illimit/.test(a);
   if(["micro","macro","officieuse"].includes(kk))return a.includes(kk.slice(0,5));
   return has(a,kk);}));
}

const truc=q=>{for(const k in TRUC)if(q[1].startsWith(k))return TRUC[k];return"";};
let order,i,score,wrong,done,round=1;
function start(list){order=list.slice().sort(()=>Math.random()-.5);i=0;score=0;wrong=[];render();}
const app=document.getElementById('app');
function render(){
 if(i>=order.length)return end();
 const q=order[i];done=false;
 app.innerHTML=`<div class="top"><span>Question ${i+1}/${order.length} ${round>1?"(reprise des erreurs)":""}</span><span>Score : ${score}</span></div>
 <div class="bar"><div style="width:${i/order.length*100}%"></div></div>
 <span class="ch">${q[0]}</span><h2>${q[1]}</h2>
 <input id="a" autocomplete="off" placeholder="Écris ta réponse…">
 <div class="hint">Entrée = valider · accents, majuscules et petites fautes d'orthographe acceptés</div>
 <div id="f"></div><div id="b"><button class="p" onclick="sub()">Valider</button><button class="s" onclick="sub(true)">Je sais pas</button></div>`;
 const inp=document.getElementById('a');inp.focus();
 inp.onkeydown=e=>{if(e.key==="Enter"){done?next():sub()}};
}
window.sub=function(skip){if(done)return;done=true;const q=order[i],a=document.getElementById('a').value;
 const ok=!skip&&a.trim()&&check(q,a);if(ok)score++;else wrong.push(q);
 document.getElementById('f').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Bonne réponse!':'❌ Pas tout à fait.'}<br><b>Réponse :</b> ${q[3]}${truc(q)?'<div style="margin-top:6px">'+truc(q)+'</div>':''}</div>`;
 document.getElementById('b').innerHTML=`<button class="p" onclick="next()">Suivante →</button>${ok?'':(a.trim()?'<button class="s" onclick="override()">J\'avais raison</button>':'')}`;
 document.getElementById('a').focus();
};
window.hint=function(){const t=truc(order[i]);document.getElementById('f').innerHTML=`<div class="fb" style="background:#fff8db;border-left:4px solid #d4a017">${t}</div>`;document.getElementById('a').focus();};
window.override=function(){score++;wrong.pop();next();};
window.next=function(){i++;render();};
function end(){const pct=Math.round(score/order.length*100);
 app.innerHTML=`<h2>Terminé! ${score}/${order.length} (${pct} %)</h2>
 <p>${pct>=90?'🔥 T\'es prêt.':pct>=70?'👍 Bon, révise les erreurs ci-dessous.':'📖 Relis la fiche pour les sujets manqués, puis refais les erreurs.'}</p>
 ${wrong.length?`<h3>À revoir :</h3><ul>${wrong.map(q=>`<li><b>${q[1]}</b><br>→ ${q[3]}${truc(q)?'<br><small>'+truc(q)+'</small>':''}</li>`).join('')}</ul>
 <button class="p" onclick="retry()">Refaire seulement mes erreurs (${wrong.length})</button>`:''}
 <button class="s" onclick="round=1;start(Q)">Recommencer tout</button>`;}
window.retry=function(){round++;start(wrong);};
start(Q);
</script></body></html>
