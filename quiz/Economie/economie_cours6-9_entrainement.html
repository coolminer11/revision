<script>

const $=i=>document.getElementById(i);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/'/g,"\\'");
const ca=k=>`style="--a:${COL[k]}"`;
const TABS=[["plan","① Méthode"],["fiche","② Fiche couleur"],["piege","③ Pièges ⚔️"],["assoc","④ Associer"],["cas","⑤ Cas pratiques"],["calc","⑥ Calculs 🧮"],["quiz","⑦ Quiz écrit"]];
function show(t){TABS.forEach(([k])=>{$("v-"+k).hidden=k!==t;});[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));window.scrollTo(0,0);}
$("nav").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" onclick="show('${k}')">${l}</button>`).join("");
const legend=`<div class="leg">${Object.keys(COL).map(k=>`<span style="background:${COL[k]}">${COLN[k]}</span>`).join("")}</div>`;

/* ① MÉTHODE */
$("v-plan").innerHTML=`<div class="card">
<h2>Comment utiliser cette page</h2>
<p>Chaque cours a <b>sa couleur</b>, partout : fiche, pièges, cas, calculs et quiz. Ton cerveau finit par associer la couleur au thème.</p>
${legend}
<h3>L'ordre qui marche (environ 1 h 30)</h3>
<ol>
<li><b>Fiche couleur (15 min)</b> : lis une fois, puis cache la colonne de droite et récite. Apprends les <b>formules</b> par cœur.</li>
<li><b>Associer (10 min)</b> : termes ↔ définitions, et noms ↔ formules.</li>
<li><b>Pièges ⚔️ (15 min)</b> : IPC ou IIP? Nominal ou réel? Chômeur ou inactif? Inclus ou exclu du PIB? C'est là que l'exam fait perdre des points.</li>
<li><b>Cas pratiques (15 min)</b> : des situations à classer (type de chômage, composante du PIB, cause d'inflation…).</li>
<li><b>Calculs 🧮 (20 min)</b> : fais d'abord les <b>exercices du cours</b>, puis génère des exercices au hasard jusqu'à ce que ça devienne automatique. La solution étape par étape s'affiche après chaque réponse.</li>
<li><b>Quiz écrit</b> : tu écris la réponse toi-même. Refais seulement tes erreurs à la fin.</li>
</ol>
<div class="warn">💡 Au calcul, le piège #1 = <b>le mauvais dénominateur</b>. Taux de chômage ÷ population <b>ACTIVE</b>; taux d'activité et d'emploi ÷ <b>15 ans et plus</b>; taux d'inflation et croissance ÷ la valeur <b>PRÉCÉDENTE</b>.</div>
<button class="p" onclick="show('fiche')">Commencer par la fiche →</button></div>`;

/* ② FICHE */
const T=(rows)=>`<table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>`;
const FM=x=>`<div class="form">${x}</div>`;
const F=[
["vie","Cours 6 — Le coût de la vie",T([["IPC","Indice des prix à la consommation : moyenne <b>pondérée</b> des prix d'un panier (≈ 600 produits, 8 composantes) consommé par un ménage type · enquête mensuelle de StatCan · sert à calculer l'<b>inflation</b>"],["IIP","Indice implicite des prix : prix de <b>tous</b> les B&S produits au pays · sert à « dégonfler » le PIB"],["Moyenne pondérée","tient compte du poids de chaque composante (le logement pèse plus que les vêtements)"],["Inflation","hausse soutenue du niveau moyen des prix → <b>perte</b> de pouvoir d'achat"],["Déflation","baisse du niveau moyen des prix → <b>gain</b> de pouvoir d'achat (mais dangereuse pour l'économie)"],["Réduflation","moins de <b>quantité</b> au même prix"],["Déqualiflation","moins de <b>qualité</b> au même prix"]])+
`<h3>Les 8 composantes du panier</h3><p>Aliments · logement · dépenses du ménage et ameublement · vêtements et chaussures · transports · santé et soins personnels · loisirs, formation et lecture · alcool, tabac et cannabis</p>
<h3>4 causes de l'inflation (D-C-I-M)</h3>${T([["Demande","↑ demande → ↑ prix"],["Coûts","↑ coûts de production → ↓ offre → ↑ prix"],["Importée","inflation à l'étranger → importations plus chères → inflation ici"],["Monnaie","↑ masse monétaire → la monnaie perd de la valeur → ↑ prix"]])}
<h3>Formules</h3>${FM("Variation % = (finale − initiale) ÷ initiale × 100")}${FM("IPC = coût du panier courant ÷ coût du panier de base × 100")}${FM("Taux d'inflation = (IPC courant − IPC précédent) ÷ IPC précédent × 100")}${FM("Salaire réel = salaire nominal ÷ IPC × 100")}${FM("1 + taux réel = (1 + taux nominal) ÷ (1 + taux d'inflation)")}
<p class="mut">Si ton salaire monte moins vite que les prix, tu t'appauvris.</p>`],
["pib","Cours 7 — Le PIB",T([["Définition","valeur, aux prix du marché, de tous les B&S <b>finaux</b> produits <b>à l'intérieur des frontières</b> d'un pays pendant une période donnée"],["Mesure","la production, la croissance, le niveau de vie · PAS le bien-être (→ IDH, Gini)"],["4 éléments clés","valeur marchande · nature (B&S finaux, pas intermédiaires → évite le double comptage) · lieu (frontières, peu importe l'origine du producteur) · moment (période)"],["C","consommation des ménages : durables (auto, meubles), semi-durables (vêtements), non durables (aliments, médicaments), services (coiffeur)"],["I","investissement privé : constructions (même résidentielles), équipements neufs, variation des stocks"],["G","dépenses publiques en B&S (routes, écoles, hôpitaux) · <b>exclut</b> transferts, subventions, intérêts sur la dette"],["X − M","exportations nettes (X = on vend à l'étranger, M = on achète de l'étranger)"],["S","salaires avant impôt"],["EE","excédent d'exploitation brut = revenus des sociétés"],["RM","revenu mixte brut = entreprises individuelles, location"],["IMP − SUB","impôts moins subventions"],["Exclusions","hors marché (domestique) · souterrain (au noir, illégal) · usagé · transactions financières · transferts · biens intermédiaires · externalités"],["Nominal / réel","nominal = dollars courants · réel = dollars constants d'une année de référence (corrige l'inflation)"],["IIP","déflateur du PIB · = 100 à l'année de référence"],["Récession","PIB réel en baisse <b>2 trimestres consécutifs</b>"]])+
`<h3>Formules</h3>${FM("PIB (dépenses) = C + I + G + (X − M)")}${FM("PIB (revenus) = S + EE + RM + (IMP − SUB)")}${FM("PIB moyen = (PIB dépenses + PIB revenus) ÷ 2")}${FM("Divergence statistique = (PIB dépenses − PIB revenus) ÷ 2")}${FM("IIP = PIB nominal ÷ PIB réel × 100   ⇔   PIB réel = PIB nominal ÷ IIP × 100")}${FM("Croissance = (PIB réel t − PIB réel t−1) ÷ PIB réel t−1 × 100")}`],
["idh","Cours 7 (suite) — IDH et inégalités",T([["Limites du PIB","ne distingue pas les types de production · ignore : externalités/environnement · économie souterraine, bénévolat, production domestique · répartition de la richesse, justice, liberté · temps libre et loisirs"],["IDH","indice de développement humain · PNUD, 1990 · entre 0 (exécrable) et 1 (excellent)"],["3 dimensions","santé = espérance de vie · éducation = durée moyenne ET attendue de scolarité · niveau de vie = RNB/habitant en PPA"],["Bornes","0 → 20 ans, aucune école, 100 $ · 1 → 85 ans, 15 ans (moyenne), 18 ans (attendue), 75 000 $"],["Lacunes","pas les inégalités, pas l'environnement, pas la liberté/démocratie/droits · une dimension peut en compenser une autre · pondérations = jugements de valeur"],["Courbe de Lorenz","% cumulés des revenus vs % cumulés de la population"],["Droite d'égalité","revenus parfaitement égaux (théorique)"],["Gini","aire entre la courbe de Lorenz et la droite d'égalité · plus elle est grande, plus c'est inégal"],["Quintiles","répartition du revenu par tranches de 20 % · bon indicateur des inégalités"]])+
`<h3>Calcul des indices de l'IDH</h3>${FM("Santé = (espérance de vie − 20) ÷ (85 − 20)")}${FM("Éducation = (durée moyenne ÷ 15 + durée attendue ÷ 18) ÷ 2")}${FM("Revenu = (ln RNB − ln 100) ÷ (ln 75 000 − ln 100)")}`],
["cho","Cours 8-9 — Le chômage",T([["Chômage","ressources productives (travail) inutilisées · dans le modèle : <b>offre excédentaire</b> = surplus de main-d'œuvre"],["Frictionnel","mobilité normale : nouveau diplômé, réorientation, fin de contrat"],["Structurel","technologique (robots), démographique (arrivée de femmes, d'immigrants), institutionnel (lois, salaire minimum), délocalisation"],["Saisonnier","climat : construction l'hiver, moniteur de ski l'été"],["Cyclique","ralentissement économique, récession"],["Plein emploi","pleine capacité · <b>aucun chômage cyclique</b> · il reste du frictionnel et du structurel · taux naturel ≈ 6 % au Canada"],["Désaisonnalisé","stats corrigées pour enlever le chômage saisonnier"],["EPA","enquête mensuelle de StatCan, 54 000 ménages · exclut militaires, institutions, réserves autochtones, 3 territoires"],["Âge de travailler","15 ans et plus"],["Population active","occupés + chômeurs"],["Inactifs","ne travaillent pas et ne cherchent pas : retraités, bénévoles, étudiants à temps plein, personnes au foyer, <b>chômeurs découragés</b>"],["Personne occupée","a travaillé, OU avait un emploi mais était absente (maladie…)"],["Chômeur","disponible pour travailler, sans emploi rémunéré"],["Coûts","prestations · moins de taxes et impôts · perte de production · perte de capital humain · difficultés psychologiques · criminalité"]])+
`<h3>Formules</h3>${FM("Taux de chômage = chômeurs ÷ population ACTIVE × 100")}${FM("Taux d'activité = population active ÷ 15 ans et + × 100")}${FM("Taux d'emploi = personnes occupées ÷ 15 ans et + × 100")}
<div class="warn">Limite : si des chômeurs découragés deviennent inactifs, le taux de chômage baisse… mais le taux d'emploi ne bouge pas. Ce n'est pas une vraie amélioration.</div>`]
];
$("v-fiche").innerHTML=`<div class="card"><h2>Fiche couleur</h2>${legend}<p class="mut">Lis une section, puis cache la colonne de droite et récite.</p></div>`+F.map(([k,t,h])=>`<div class="card" ${ca(k)}><h2 style="color:${COL[k]}">${t}</h2>${h}</div>`).join("");

/* ③ PIÈGES */
let pgF=new Set(Object.keys(COL)),pgO,pgI,pgS,pgStreak,pgBest=0,pgW,pgDone;
function pgHome(){$("v-piege").innerHTML=`<div class="card"><h2>⚔️ Pièges : choisis le bon jumeau</h2>
<p>Deux concepts qu'on confond facilement. Tu lis la situation et tu choisis le bon. Pas de chrono : vise la <b>série la plus longue sans erreur</b>.</p>
<div class="chips">${Object.keys(COL).map(k=>`<button class="chip ${pgF.has(k)?"on":""}" ${ca(k)} onclick="pgTog('${k}')">${COLN[k]} (${PG.filter(p=>p[4]===k).length})</button>`).join("")}</div>
<button class="p" onclick="pgStart()">Commencer (${PG.filter(p=>pgF.has(p[4])).length} pièges)</button></div>`;}
window.pgTog=k=>{pgF.has(k)?pgF.delete(k):pgF.add(k);pgHome();};
window.pgStart=(list)=>{pgO=shuf(list||PG.filter(p=>pgF.has(p[4])));if(!pgO.length)return;pgI=0;pgS=0;pgStreak=0;pgW=[];pgRender();};
function pgRender(){const v=$("v-piege");if(pgI>=pgO.length){v.innerHTML=`<div class="card"><h2>Score : ${pgS}/${pgO.length}</h2><p>Meilleure série : <b>${pgBest}</b> 🔥</p>${pgW.length?`<h3>Tes pièges à revoir</h3><ul class="err">${pgW.map(p=>`<li ${ca(p[4])}><span class="tag">${COLN[p[4]]}</span> ${p[0]} → <b>${p[1]}</b> (pas ${p[2]})</li>`).join("")}</ul><button class="p" onclick="pgStart(pgW.slice())">Refaire mes erreurs (${pgW.length})</button>`:"<p>🔥 Aucune erreur!</p>"}<button class="s" onclick="pgHome()">Menu</button></div>`;return;}
 const p=pgO[pgI];pgDone=false;const opts=shuf([p[1],p[2]]);
 v.innerHTML=`<div class="card" ${ca(p[4])}><div class="stat"><span>Piège <b>${pgI+1}/${pgO.length}</b></span><span>Score <b>${pgS}</b></span><span>Série <b>${pgStreak}</b> 🔥</span><span>Record <b>${pgBest}</b></span></div><div class="bar"><div style="width:${pgI/pgO.length*100}%"></div></div>
 <span class="tag">${COLN[p[4]]}</span><div class="big">${p[0]}</div>
 <div class="duel">${opts.map(o=>`<button onclick="pgPick(this,'${esc(o)}')">${o}</button>`).join("")}</div><div id="pgf"></div></div>`;}
window.pgPick=(btn,o)=>{if(pgDone)return;pgDone=true;const p=pgO[pgI],ok=o===p[1];
 [...btn.parentNode.children].forEach(b=>{if(b.textContent===p[1])b.classList.add("good");else if(b===btn)b.classList.add("bad");});
 if(ok){pgS++;pgStreak++;pgBest=Math.max(pgBest,pgStreak);}else{pgStreak=0;pgW.push(p);}
 $("pgf").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Oui!":"❌ Piège!"} <b>${p[1]}</b>, pas ${p[2]}.<div class="tip">${p[3]}</div></div><button class="p" id="pgn" onclick="pgI++;pgRender()">Suivant →</button>`;$("pgn").focus();};
pgHome();

/* ④ ASSOCIER */
let asN,asSel,asErr,asLeft;
function asHome(){$("v-assoc").innerHTML=`<div class="card"><h2>🔗 Associer</h2><p>Clique un élément à gauche, puis sa définition à droite.</p>${Object.entries(AS).map(([n,d])=>`<button class="chip" ${ca(d.c)} style="--a:${COL[d.c]};margin:4px" onclick="asStart('${esc(n)}')">${n}</button>`).join("")}</div><div id="asb"></div>`;}
window.asStart=n=>{asN=n;asSel=null;asErr=0;const d=AS[n];asLeft=d.p.length;
 $("asb").innerHTML=`<div class="card" ${ca(d.c)}><h2 style="color:${COL[d.c]}">${n}</h2><div class="stat"><span>Restant <b id="asr">${asLeft}</b></span><span>Erreurs <b id="ase">0</b></span></div>
 <div class="cols"><div>${shuf(d.p.map((x,i)=>[x[0],i])).map(([t,i])=>`<div class="tile" data-i="${i}" data-s="L" onclick="asClick(this)">${t}</div>`).join("")}</div>
 <div>${shuf(d.p.map((x,i)=>[x[1],i])).map(([t,i])=>`<div class="tile" data-i="${i}" data-s="R" onclick="asClick(this)">${t}</div>`).join("")}</div></div><div id="asf"></div></div>`;$("asb").scrollIntoView({behavior:"smooth"});};
window.asClick=el=>{if(el.classList.contains("done"))return;
 if(!asSel||asSel.dataset.s===el.dataset.s){if(asSel)asSel.classList.remove("sel");asSel=el;el.classList.add("sel");return;}
 if(asSel.dataset.i===el.dataset.i){[asSel,el].forEach(t=>{t.classList.remove("sel");t.classList.add("done");});asSel=null;asLeft--;$("asr").textContent=asLeft;
  if(!asLeft)$("asf").innerHTML=`<div class="fb ok">${asErr===0?"🔥 Parfait, zéro erreur!":"✅ Terminé avec "+asErr+" erreur(s). Refais-le pour viser 0."}</div><button class="p" onclick="asStart('${esc(asN)}')">Refaire</button>`;}
 else{asErr++;$("ase").textContent=asErr;const a=asSel;[a,el].forEach(t=>t.classList.add("bad"));setTimeout(()=>{[a,el].forEach(t=>t.classList.remove("bad","sel"));},450);asSel=null;}};
asHome();

/* ⑤ CAS PRATIQUES */
let csN,csO,csI,csS,csW,csDone;
function csHome(){$("v-cas").innerHTML=`<div class="card"><h2>🧩 Cas pratiques</h2><p>Une situation concrète, tu choisis la bonne catégorie. C'est le format des questions d'application.</p>${Object.entries(CAS).map(([n,d])=>`<button class="chip" style="--a:${COL[d.c]};margin:4px" onclick="csStart('${esc(n)}')">${n} (${d.q.length})</button>`).join("")}<br><button class="p" style="margin-top:12px" onclick="csStart('🔀 Tout mélangé')">🔀 Tout mélangé (${Object.values(CAS).reduce((s,d)=>s+d.q.length,0)})</button></div><div id="csb"></div>`;}
window.csStart=(n,list)=>{csN=n;const all=list||(n==="🔀 Tout mélangé"?Object.entries(CAS).flatMap(([k,d])=>d.q.map(q=>[q[0],q[1],k])):CAS[n].q.map(q=>[q[0],q[1],n]));csO=shuf(all);csI=0;csS=0;csW=[];csRender();$("csb").scrollIntoView({behavior:"smooth"});};
function csRender(){const b=$("csb");if(csI>=csO.length){b.innerHTML=`<div class="card"><h2>Score : ${csS}/${csO.length}</h2>${csW.length?`<h3>À revoir</h3><ul class="err">${csW.map(q=>`<li>${q[0]} → <b>${q[1]}</b></li>`).join("")}</ul><button class="p" onclick="csStart(csN,csW.slice())">Refaire mes erreurs (${csW.length})</button>`:"<p>🔥 Parfait!</p>"}<button class="s" onclick="csStart(csN)">Recommencer</button></div>`;return;}
 const q=csO[csI],d=CAS[q[2]];csDone=false;
 b.innerHTML=`<div class="card" ${ca(d.c)}><div class="stat"><span>Cas <b>${csI+1}/${csO.length}</b></span><span>Score <b>${csS}</b></span></div><div class="bar"><div style="width:${csI/csO.length*100}%"></div></div>
 <span class="tag">${q[2]}</span><div class="big">${q[0]}</div><div class="opts">${d.o.map(o=>`<button onclick="csPick(this,'${esc(o)}')">${o}</button>`).join("")}</div><div id="csf"></div></div>`;}
window.csPick=(btn,o)=>{if(csDone)return;csDone=true;const q=csO[csI],ok=o===q[1];
 [...btn.parentNode.children].forEach(x=>{if(x.textContent===q[1])x.classList.add("good");else if(x===btn)x.classList.add("bad");});
 if(ok)csS++;else csW.push(q);
 $("csf").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Bonne réponse!":"❌ C'était : <b>"+q[1]+"</b>"}</div><button class="p" id="csn" onclick="csI++;csRender()">Suivant →</button>`;$("csn").focus();};

/* ⑥ CALCULS */

const fr=(n,d=2)=>Number(n).toLocaleString("fr-CA",{minimumFractionDigits:0,maximumFractionDigits:d});
const pick=a=>a[Math.floor(Math.random()*a.length)];
const GEN={

()=>{const n=rnd(2,9,0.5),i=rnd(1,6,0.5),v=((1+n/100)/(1+i/100)-1)*100;return{q:`Taux d'intérêt nominal = ${fr(n,1)} %; inflation = ${fr(i,1)} %. Taux d'intérêt réel?`,ans:v,u:"%",st:`1 + réel = (1 + ${fr(n/100,3)}) ÷ (1 + ${fr(i/100,3)}) = ${fr(1+v/100,4)}\n→ réel = ${fr(v)} %  (approximation rapide : ${fr(n,1)} − ${fr(i,1)} = ${fr(n-i,1)} %)`};},

],
pib:[

()=>{const S=rnd(1000,1300),EE=rnd(400,600),RM=rnd(100,200),IM=rnd(150,250),SU=rnd(20,60),v=S+EE+RM+IM-SU;return{q:`S = ${S} G$, EE = ${EE} G$, RM = ${RM} G$, impôts = ${IM} G$, subventions = ${SU} G$. PIB (méthode des revenus)?`,ans:v,u:"G$",st:`${S} + ${EE} + ${RM} + (${IM} − ${SU}) = ${fr(v)} G$`};},
()=>{const d=rnd(1800,2600),r=d-rnd(-20,20,2)||d-6,ds=(d-r)/2;return{q:`PIB dépenses = ${d} G$; PIB revenus = ${r} G$. Divergence statistique?`,ans:ds,u:"G$",st:`DS = (${d} − ${r}) ÷ 2 = ${fr(ds)} G$`};},
()=>{const d=rnd(1800,2600),r=d-rnd(-20,20,2)||d-6,m=(d+r)/2;return{q:`PIB dépenses = ${d} G$; PIB revenus = ${r} G$. PIB moyen?`,ans:m,u:"G$",st:`(${d} + ${r}) ÷ 2 = ${fr(m)} G$`};},
()=>{const n=rnd(2000,3200,5),i=rnd(102,140,0.5),v=n/i*100;return{q:`PIB nominal = ${fr(n)} G$; IIP = ${fr(i,1)}. PIB réel?`,ans:v,u:"G$",st:`PIB réel = ${fr(n)} ÷ ${fr(i,1)} × 100 = ${fr(v)} G$`};},
()=>{const r=rnd(1800,2500,5),n=Math.round(r*(1+rnd(0.02,0.4,0.01))),v=n/r*100;return{q:`PIB nominal = ${fr(n)} G$; PIB réel = ${fr(r)} G$. IIP?`,ans:v,u:"",st:`IIP = ${fr(n)} ÷ ${fr(r)} × 100 = ${fr(v,1)}`};},
()=>{const a=rnd(1800,2400,2),b=Math.round(a*(1+rnd(-0.03,0.05,0.001))),v=(b-a)/a*100;return{q:`PIB réel : ${fr(a)} G$ l'an passé, ${fr(b)} G$ cette année. Taux de croissance?`,ans:v,u:"%",st:`(${fr(b)} − ${fr(a)}) ÷ ${fr(a)} × 100 = ${fr(v)} %`};}
],

()=>{const r=rnd(1000,70000,250),v=(Math.log(r)-Math.log(100))/(Math.log(75000)-Math.log(100));return{q:`RNB/habitant = ${fr(r)} $ PPA. Indice de revenu? (2 décimales, calculatrice avec ln)`,ans:v,u:"",tol:0.011,st:`(ln ${fr(r)} − ln 100) ÷ (ln 75 000 − ln 100) = (${fr(Math.log(r),3)} − 4,605) ÷ (11,225 − 4,605) = ${fr(v,3)}`};}
],

let caF=new Set(Object.keys(COL)),caCur,caS=0,caN=0,caMode="gen",caX=0,caDone;
function caHome(){$("v-calc").innerHTML=`<div class="card"><h2>🧮 Calculs</h2><p>Arrondis à 2 décimales (virgule ou point, comme tu veux). Après chaque réponse, tu vois la solution étape par étape.</p>
<button class="p" onclick="caCours()">📘 Exercices du cours (${CX.length})</button>
<h3>Ou génère des exercices au hasard</h3><div class="chips">${Object.keys(COL).map(k=>`<button class="chip ${caF.has(k)?"on":""}" ${ca(k)} onclick="caTog('${k}')">${COLN[k]}</button>`).join("")}</div>
<button class="p" onclick="caGo()">🎲 Générer des exercices</button></div><div id="cab"></div>`;}
window.caTog=k=>{caF.has(k)?caF.delete(k):caF.add(k);caHome();};
window.caCours=()=>{caMode="cours";caX=0;caS=0;caN=0;caNext();};
window.caGo=()=>{if(!caF.size)return;caMode="gen";caS=0;caN=0;caNext();};
function caNext(){if(caMode==="cours"){if(caX>=CX.length){$("cab").innerHTML=`<div class="card"><h2>Exercices du cours : ${caS}/${CX.length}</h2><button class="p" onclick="caCours()">Recommencer</button> <button class="s" onclick="caGo()">🎲 Passer aux exercices au hasard</button></div>`;return;}
  const x=CX[caX];caCur={q:x[0],ans:x[1],u:x[2],st:x[3],c:x[4],tol:x[4]==="idh"?0.006:undefined};caX++;}
 else{const k=pick([...caF]);caCur=pick(GEN[k])();caCur.c=k;}
 caDone=false;const c=caCur;
 $("cab").innerHTML=`<div class="card" ${ca(c.c)}><div class="stat"><span>${caMode==="cours"?"Exercice du cours <b>"+caX+"/"+CX.length+"</b>":"Exercice au hasard"}</span><span>Score <b>${caS}/${caN}</b></span></div>
 <span class="tag">${COLN[c.c]}</span><div class="big">${c.q}</div><input id="cai" inputmode="decimal" autocomplete="off" placeholder="Ta réponse${c.u?" (en "+c.u+")":""}…"><div id="caf"></div><div id="cabt"><button class="p" onclick="caSub()">Valider</button><button class="s" onclick="caSub(true)">Montre-moi</button></div></div>`;
 const i=$("cai");i.focus();i.onkeydown=e=>{if(e.key==="Enter"){caDone?caNext():caSub();}};$("cab").scrollIntoView({behavior:"smooth",block:"nearest"});}
window.caNext=caNext;
window.caSub=skip=>{if(caDone)return;const raw=$("cai").value.replace(/\s/g,"").replace(/[%$]|G\$/gi,"").replace(",",".");const v=parseFloat(raw);if(!skip&&isNaN(v))return;caDone=true;caN++;
 const c=caCur,tol=c.tol!==undefined?c.tol:Math.max(0.06,Math.abs(c.ans)*0.003);const ok=!skip&&Math.abs(v-c.ans)<=tol;if(ok)caS++;
 $("caf").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Exact!":skip?"Voici la solution :":"❌ Pas tout à fait."} <b>Réponse : ${fr(c.ans,c.c==="idh"?3:2)}${c.u?" "+c.u:""}</b><div class="steps">${c.st}</div></div>`;
 $("cabt").innerHTML=`<button class="p" onclick="caNext()">Suivant →</button>`;$("cai").focus();};
caHome();

/* ⑦ QUIZ ÉCRIT */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}
const words=a=>a.split(/[^a-z0-9-]+/).filter(Boolean);
function has(a,kk){if(a.includes(kk))return true;if(kk.includes(" ")||kk.length<5)return false;const tol=kk.length>=8?2:1;
 return words(a).some(w=>{for(let L=kk.length-1;L<=kk.length+1;L++){if(w.length>=L-1&&lev(w.slice(0,L),kk)<=tol)return true;}return false;});}
function match(a,k){const kk=norm(k);
 if(kk==="#incond")return a.includes("inconditionn")||a.includes("inconditon");
 if(kk==="#cond")return /conditionn|conditon/.test(a.replace(/inconditi?on+\w*/g,""));
 if(kk[0]==="="){const t=kk.slice(1);return words(a).concat(words(a.replace(/-/g," "))).some(w=>w===t||(t.length>=6&&lev(w,t)<=1));}
 if(kk[0]==="!"){const t=kk.slice(1);return words(a).concat(words(a.replace(/-/g," "))).some(w=>w.startsWith(t));}
 if(/^\d+$/.test(kk))return new RegExp("(^|\\D)"+kk+"(\\D|$)").test(a);
 return has(a,kk);}
function check(q,a){a=norm(a);const r=q[2];if(!Array.isArray(r))return r.k.filter(g=>g.some(k=>match(a,k))).length>=r.n;return r.every(g=>g.some(k=>match(a,k)));}
let qzF=new Set(Object.keys(COL)),qzO,qzI,qzS,qzW,qzDone,qzRound=1;
function qzHome(){$("v-quiz").innerHTML=`<div class="card"><h2>✍️ Quiz écrit</h2><p>Tu écris la réponse. Accents, majuscules et petites fautes sont acceptés. Après chaque question : la réponse + un truc de la couleur du thème.</p>
<div class="chips">${Object.keys(COL).map(k=>`<button class="chip ${qzF.has(k)?"on":""}" ${ca(k)} onclick="qzTog('${k}')">${COLN[k]} (${Q.filter(q=>q[0]===k).length})</button>`).join("")}</div>
<button class="p" onclick="qzGo()">Commencer (${Q.filter(q=>qzF.has(q[0])).length} questions)</button></div>`;}
window.qzTog=k=>{qzF.has(k)?qzF.delete(k):qzF.add(k);qzHome();};
window.qzGo=()=>{const l=Q.filter(q=>qzF.has(q[0]));if(!l.length)return;qzRound=1;qzStart(l);};
function qzStart(l){qzO=shuf(l);qzI=0;qzS=0;qzW=[];qzRender();}
function qzRender(){const v=$("v-quiz");if(qzI>=qzO.length)return qzEnd();const q=qzO[qzI];qzDone=false;
 v.innerHTML=`<div class="card" ${ca(q[0])}><div class="stat"><span>Question <b>${qzI+1}/${qzO.length}</b> ${qzRound>1?"(reprise des erreurs)":""}</span><span>Score <b>${qzS}</b></span></div><div class="bar"><div style="width:${qzI/qzO.length*100}%"></div></div>
 <span class="tag">${COLN[q[0]]}</span><div class="big">${q[1]}</div><input id="qa" autocomplete="off" placeholder="Écris ta réponse…"><div class="mut" style="margin-top:5px">Entrée = valider</div>
 <div id="qf"></div><div id="qb"><button class="p" onclick="qzSub()">Valider</button><button class="s" onclick="qzSub(true)">Je sais pas</button></div></div>`;
 const i=$("qa");i.focus();i.onkeydown=e=>{if(e.key==="Enter"){qzDone?qzNext():qzSub();}};}
window.qzSub=skip=>{if(qzDone)return;const q=qzO[qzI],a=$("qa").value;if(!skip&&!a.trim())return;qzDone=true;
 const ok=!skip&&check(q,a);if(ok)qzS++;else qzW.push(q);
 $("qf").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ Bonne réponse!":"❌ Pas tout à fait."}<br><b>Réponse :</b> ${q[3]}<div class="tip">${TRUC[q[0]]}</div></div>`;
 $("qb").innerHTML=`<button class="p" onclick="qzNext()">Suivante →</button>${ok||skip?"":`<button class="s" onclick="qzOver()">J'avais raison</button>`}`;$("qa").focus();};
window.qzOver=()=>{qzS++;qzW.pop();qzNext();};
window.qzNext=()=>{qzI++;qzRender();};
function qzEnd(){const pct=Math.round(qzS/qzO.length*100);
 $("v-quiz").innerHTML=`<div class="card"><h2>Terminé! ${qzS}/${qzO.length} (${pct} %)</h2><p>${pct>=90?"🔥 T'es prêt.":pct>=70?"👍 Pas pire! Revois tes erreurs.":"📖 Relis la fiche des couleurs où tu as le plus d'erreurs, puis refais-les."}</p>
 ${qzW.length?`<h3>À revoir</h3><ul class="err">${qzW.map(q=>`<li ${ca(q[0])}><span class="tag">${COLN[q[0]]}</span> <b>${q[1]}</b><br>→ ${q[3]}</li>`).join("")}</ul><button class="p" onclick="qzRound++;qzStart(qzW.slice())">Refaire seulement mes erreurs (${qzW.length})</button>`:""}
 <button class="s" onclick="qzHome()">Menu du quiz</button></div>`;}
qzHome();
show("plan");
