<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Économie — Salle d'entraînement</title>
<style>
:root{--b:#1f6feb;--ok:#2e8b57;--no:#c0392b}
body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#1d1d1f;margin:0;padding:12px}
.wrap{max-width:760px;margin:auto}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:sticky;top:0;background:#f4f6fa;padding:6px 0;z-index:5}
nav button{background:#fff;border:1px solid #ccd;border-radius:20px;padding:7px 12px;cursor:pointer;font-size:.9em}
nav button.on{background:var(--b);color:#fff;border-color:var(--b)}
.card,.box{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0001;margin-bottom:12px}
h2{font-size:1.2em;margin:.3em 0 .8em}h3{margin:.8em 0 .3em;color:#1f3b57}
button{font-size:1em;padding:9px 14px;border:0;border-radius:8px;cursor:pointer;margin:6px 6px 0 0}
.p{background:var(--b);color:#fff}.s{background:#e6ebf2}
input,textarea{width:100%;box-sizing:border-box;font-size:1.05em;padding:10px;border:2px solid #ccd;border-radius:8px;font-family:inherit}
.fb{margin-top:12px;padding:10px;border-radius:8px}.ok{background:#e3f6e8;border-left:4px solid var(--ok)}.no{background:#fdecea;border-left:4px solid var(--no)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:2px solid #ccd;border-radius:8px;padding:9px;cursor:pointer;background:#fff;font-size:.95em;user-select:none}
.tile.sel{border-color:var(--b);background:#eaf1ff}.tile.done{border-color:var(--ok);background:#e3f6e8;cursor:default;opacity:.7}.tile.bad{border-color:var(--no);background:#fdecea}
.opts button{background:#eef2f7;border:1px solid #ccd}
.mn{background:#e8f4ea;border-left:4px solid var(--ok);padding:8px 10px;margin:8px 0;border-radius:4px}
.story{line-height:1.7}.story b{background:#fff3a8;padding:0 2px}
.top{display:flex;justify-content:space-between;color:#555;font-size:.9em;flex-wrap:wrap}
.bar{height:6px;background:#e3e8ef;border-radius:3px;margin:8px 0 16px}.bar div{height:100%;background:var(--b);border-radius:3px;transition:.3s}
.ch{display:inline-block;background:#e6ebf2;border-radius:10px;padding:2px 8px;font-size:.8em}.hint{color:#666;font-size:.85em;margin-top:6px}
table{border-collapse:collapse;margin:8px 0}td,th{border:1px solid #ccd;padding:5px 10px;text-align:center}
.miss{color:var(--no)}.hit{color:var(--ok)}
.timer{font-size:2em;font-weight:700;text-align:center;margin:6px 0}
svg text{font-family:system-ui;font-size:12px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<nav id="nav"></nav>
<div id="v-plan"></div><div id="v-histoire" hidden></div><div id="v-blurt" hidden></div><div id="v-assoc" hidden></div>
<div id="v-graph" hidden></div><div id="v-trier" hidden></div><div id="v-cpp" hidden></div><div id="v-quiz" hidden><div class="box" id="app"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const nrm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ").replace(/\s+/g," ");
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const TABS=[["plan","① Méthode"],["histoire","② L'histoire"],["blurt","③ Vide-cerveau"],["assoc","④ Associer"],["graph","⑤ Graphique O/D"],["trier","⑥ Trier"],["cpp","⑦ Calculs CPP"],["quiz","⑧ Quiz final"]];
function show(t){TABS.forEach(([k])=>{$("v-"+k).hidden=k!==t;});[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));window.scrollTo(0,0);}
$("nav").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" onclick="show('${k}')">${l}</button>`).join("");

/* ① MÉTHODE */
$("v-plan").innerHTML=`<div class="card"><h2>🎯 Comment apprendre VITE (fais les onglets dans l'ordre)</h2>
<p>Relire ses notes donne l'impression de savoir, mais ça rentre mal. Ce qui marche vraiment, c'est <b>forcer ton cerveau à sortir l'info</b> (rappel actif) et <b>faire des liens</b>. Chaque onglet utilise une technique prouvée :</p>
<table style="width:100%;text-align:left"><tr><th>Onglet</th><th>Technique</th><th>Temps</th></tr>
<tr><td>② L'histoire</td><td><b>Chaîne logique</b> : tout est relié en 1 histoire. Un concept rappelle le suivant.</td><td>5 min</td></tr>
<tr><td>③ Vide-cerveau</td><td><b>Blurting</b> : écris tout ce que tu sais sans regarder, puis vois ce qui manque. La technique #1 pour trouver tes trous.</td><td>5 min / thème</td></tr>
<tr><td>④ Associer</td><td><b>Discrimination</b> : distinguer des notions qui se ressemblent (normal/supérieur/inférieur…).</td><td>10 min</td></tr>
<tr><td>⑤ Graphique</td><td><b>Double codage</b> : mot + image. Tu vois la courbe bouger → tu t'en souviens.</td><td>10 min</td></tr>
<tr><td>⑥ Trier</td><td><b>Entrelacement</b> : questions mélangées, comme à l'exam.</td><td>10 min</td></tr>
<tr><td>⑦ Calculs</td><td><b>Pratique répétée</b> : même formule, chiffres différents, jusqu'à l'automatisme.</td><td>5 min</td></tr>
<tr><td>⑧ Quiz</td><td><b>Test final + refaire ses erreurs</b> jusqu'à 0 erreur.</td><td>20 min</td></tr></table>
<h3>5 règles d'or</h3>
<ol><li><b>Ne regarde pas la réponse avant d'avoir essayé.</b> Te tromper puis voir la bonne réponse = ça reste 2× mieux.</li>
<li><b>Dis-le à voix haute</b> comme si tu l'expliquais à un ami de 12 ans (technique Feynman). Si tu bloques, c'est un trou.</li>
<li><b>Refais tes erreurs</b> 10 min plus tard, puis une dernière fois avant l'exam (répétition espacée).</li>
<li><b>Pauses de 5 min</b> toutes les 25 min (Pomodoro). Pas de téléphone pendant la pause.</li>
<li><b>Dors</b> la veille : le cerveau consolide la mémoire pendant le sommeil. Une nuit blanche fait perdre plus que ce qu'elle rapporte.</li></ol>
<button class="p" onclick="show('histoire')">Commencer → L'histoire</button></div>`;

/* ② HISTOIRE */
$("v-histoire").innerHTML=`<div class="card story"><h2>📖 Toute la matière en une histoire</h2>
<p>Lis-la 2 fois, puis ferme les yeux et <b>raconte-la à voix haute</b>. Chaque paragraphe mène au suivant.</p>
<h3>1. Le problème de départ</h3>
<p>L'économie est une <b>science humaine</b> (chômage, inégalités, climat, IA, santé mentale). Le problème de base : les <b>ressources sont limitées</b> (naturelles, humaines, infrastructures) mais les <b>besoins sont illimités</b> → c'est la <b>RARETÉ</b>. Donc on doit faire des <b>CHOIX</b> : l'économie est la <b>science des choix</b>. Tout pays doit répondre à : <b>Quoi produire? Comment? Pour qui?</b></p>
<h3>2. Qui fait ces choix?</h3>
<p>Les <b>4 agents</b> (la MER) : Ménages, Entreprises, État, Reste du monde. Si on étudie UN agent et sa réaction aux <b>incitatifs</b> (carotte/bâton) → <b>MICRO</b>. Si on étudie l'effet de TOUS ensemble (inflation, chômage, production globale) → <b>MACRO</b>.</p>
<h3>3. Chaque choix a un prix caché</h3>
<p>Choisir, c'est renoncer. Ce qu'on sacrifie = <b>coût de renonciation</b> (= coût d'opportunité = coût d'option). On le voit avec la <b>CPP</b> : on produit 2 biens avec toutes nos ressources, à court terme. <b>Coût = ce que je perds ÷ ce que je gagne</b>. Il est souvent <b>croissant</b> (courbe bombée), car on utilise d'abord les ressources les plus productives. La CPP montre 5 idées : <b>rareté</b> (on ne peut pas aller dehors), <b>choix</b> (un point sur la courbe), <b>coût d'option</b> (glisser sur la courbe), <b>sous-emploi</b> (point à l'intérieur), <b>croissance</b> (la courbe se déplace vers l'extérieur grâce au Capital, Travail, Terre, Technologie).</p>
<h3>4. Ce qu'on produit : les biens</h3>
<p>Un bien est <b>intermédiaire</b> (sert à fabriquer autre chose) ou <b>final</b> (consommation ou investissement). Entre eux, ils sont <b>substituts</b> (se remplacent) ou <b>complémentaires</b> (vont ensemble). Selon le revenu : <b>normal</b> (revenu↑ → achat↑), <b>supérieur</b> (achat↑↑, le luxe), <b>inférieur</b> (achat↓).</p>
<h3>5. Où on échange : le marché</h3>
<p>Le <b>marché</b> réunit acheteurs (demandeurs) et producteurs (offreurs). Du plus de vendeurs au moins : <b>concurrence parfaite → monopolistique → oligopole → monopole</b>. Sur le graphique : <b>Prix en vertical, Quantité en horizontal</b>, <i>ceteris paribus</i>.</p>
<h3>6. Les deux forces : demande et offre</h3>
<p><b>Demande</b> ↘ : prix↑ = on achète moins. <b>Offre</b> ↗ : prix↑ = on produit plus. <b>RÈGLE D'OR :</b> si c'est le <b>prix du bien lui-même</b> qui change → on <b>glisse SUR la courbe</b> (quantité demandée/offerte). Si c'est <b>autre chose</b> → la <b>courbe au complet se déplace</b>. Demande bouge avec : revenu, prix des biens apparentés. Offre bouge avec : coûts, nombre de producteurs, technologie, anticipations, climat, biens apparentés. Coûts↑ → offre↓.</p>
<h3>7. Le côté sombre : l'environnement</h3>
<p>L'<b>économie linéaire</b> = Extraire → Transformer → Distribuer → Utiliser → Jeter (gaspillage, pollution, surconsommation). Ça crée des <b>externalités négatives</b> : mon activité nuit au bien-être des autres (pollution, produits chimiques, déforestation, bruit). Solution : l'<b>internalisation</b> (<b>pollueur-payeur</b>), freinée par les consommateurs qui ferment les yeux. Meilleure solution ⭐ : l'<b>économie circulaire</b> : repenser la production (<b>écoconception</b>, recyclable, biodégradable). La ligne devient un cercle.</p>
<div class="mn">🧠 La chaîne en 10 mots : <b>Rareté → Choix → Renonciation → CPP → Biens → Marché → Demande → Offre → Externalités → Circulaire</b>. Récite-la 3 fois.</div>
<button class="p" onclick="show('blurt')">Suivant → Vide-cerveau</button></div>`;

/* ③ BLURTING */
const BL={
"Tout (la chaîne complète)":["rarete","choix","renonciation","cpp","micro","macro","menage","entreprise","etat","reste du monde","quoi","comment","pour qui","intermediaire","final","substitut","complementaire","normal","superieur","inferieur","marche","offre","demande","ceteris paribus","externalite","pollueur","circulaire","lineaire","ecoconception"],
"Introduction (rareté, micro/macro, agents)":["humain","choix","rarete","limit","illimit","micro","macro","incitatif","inflation","chomage","quoi","comment","pour qui","menage","entreprise","etat","reste du monde"],
"Types de biens":["intermediaire","final","consommation","investissement","substitut","complementaire","normal","superieur","inferieur","revenu"],
"CPP et coût de renonciation":["renonciation","opportunite","option","courbe","possibilite","production","court terme","perd","gagn","constant","croissant","productiv","capital","travail","terre","technologie","sous-emploi","croissance","rarete","choix"],
"Marché, demande, offre":["acheteur","producteur","echange","parfaite","monopolistique","oligopole","monopole","prix","quantite","ceteris paribus","revenu","substitut","complementaire","cout","nombre","technologie","anticipation","climat","deplace"],
"Environnement":["extraction","transformation","distribution","utilisation","gaspillage","pollution","surconsommation","externalite","bien-etre","deforestation","bruit","internalisation","pollueur-payeur","consommateur","circulaire","ecoconception","recycl","biodegradable"]};
let bt=null;
$("v-blurt").innerHTML=`<div class="card"><h2>🧠 Vide-cerveau (blurting)</h2>
<p>1) Choisis un thème. 2) Pendant <b>3 minutes</b>, écris <b>TOUT</b> ce dont tu te souviens, sans regarder, en vrac (mots-clés, définitions, exemples). 3) Clique « Vérifier » : tu vois ce qui te manque. 4) Relis juste ce qui manque, puis recommence le même thème. Vise 100 %.</p>
<select id="bth" style="font-size:1em;padding:8px;width:100%;margin-bottom:8px">${Object.keys(BL).map(k=>`<option>${k}</option>`).join("")}</select>
<div class="timer" id="btm">3:00</div>
<textarea id="bta" rows="9" placeholder="Écris tout ce que tu sais ici…"></textarea>
<button class="s" onclick="btStart()">▶ Démarrer le chrono</button><button class="p" onclick="btCheck()">Vérifier</button><button class="s" onclick="$('bta').value='';$('btr').innerHTML=''">Effacer</button>
<div id="btr"></div></div>`;
window.btStart=function(){clearInterval(bt);let s=180;$("bta").focus();bt=setInterval(()=>{s--;$("btm").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=0){clearInterval(bt);$("btm").textContent="⏰ Temps!";btCheck();}},1000);};
window.btCheck=function(){clearInterval(bt);const t=nrm($("bta").value),k=BL[$("bth").value];const hit=k.filter(w=>t.includes(nrm(w))),miss=k.filter(w=>!t.includes(nrm(w)));const pct=Math.round(hit.length/k.length*100);
$("btr").innerHTML=`<div class="fb ${pct>=80?'ok':'no'}"><b>${pct} %</b> des mots-clés (${hit.length}/${k.length})<br><span class="hit">✔ ${hit.join(", ")||"—"}</span><br><span class="miss">✘ Il te manque : <b>${miss.join(", ")||"rien! 🔥"}</b></span><br><small>Va relire ces mots-là dans « L'histoire », puis recommence ce thème.</small></div>`;};

/* ④ ASSOCIER */
const AS={
"Types de biens":[["Bien intermédiaire","Sert à fabriquer un autre bien (farine → pain)"],["Bien final","Utilisé tel quel par le consommateur ou l'entreprise"],["Bien d'investissement","Bien final qu'une entreprise achète pour produire (machine)"],["Biens substituts","Se remplacent l'un l'autre (café / thé)"],["Biens complémentaires","Consommés ensemble (auto / essence)"],["Bien normal","Revenu ↑ → demande ↑"],["Bien supérieur","Revenu ↑ → demande ↑ plus que proportionnellement"],["Bien inférieur","Revenu ↑ → demande ↓"]],
"Structures de marché":[["Concurrence parfaite","Tellement de vendeurs/acheteurs que personne n'influence le prix"],["Concurrence monopolistique","Beaucoup de vendeurs, produits différenciés (restos)"],["Oligopole","Quelques gros vendeurs (Bell, Rogers, Telus)"],["Monopole","Un seul vendeur"],["Marché","Réunit acheteurs et offreurs pour échanger"],["Ceteris paribus","Toutes choses étant égales par ailleurs"]],
"Concepts clés":[["Rareté","Ressources limitées vs besoins illimités"],["Coût de renonciation","Ce à quoi on renonce en prenant une décision"],["Microéconomie","Choix des individus/entreprises face aux incitatifs"],["Macroéconomie","Effets agrégés : inflation, chômage, production globale"],["Externalité négative","Mon activité nuit au bien-être des autres"],["Internalisation","Faire payer le coût de l'externalité (pollueur-payeur)"],["Économie linéaire","Extraire → produire → jeter"],["Économie circulaire","Écoconception : recyclable, biodégradable"]],
"La CPP":[["Point à l'intérieur","Sous-emploi des ressources"],["Point sur la courbe","Utilisation efficace (plein emploi)"],["Point à l'extérieur","Impossible à atteindre (rareté)"],["Courbe qui se déplace vers l'extérieur","Croissance économique"],["Courbe droite","Coût de renonciation constant"],["Courbe bombée","Coût de renonciation croissant"],["Glisser d'un point à l'autre","Coût d'option"],["Formule","Quantité renoncée ÷ unités gagnées"]],
"Demande vs Offre":[["Quantité demandée varie","Le prix du bien lui-même change (glisse sur la courbe)"],["La demande varie","Revenu ou prix d'un bien apparenté change"],["Coûts de production ↑","Offre ↓"],["Nouvelle technologie","Offre ↑"],["Demande","Quantités que les consommateurs VEULENT acheter à différents prix"],["Offre","Quantités que les producteurs VEULENT ET PEUVENT offrir à différents prix"]]};
let asSel=null,asSet,asErr;
function asRender(name){asSet=name;asSel=null;asErr=0;const pairs=AS[name];
 const L=shuf(pairs.map((p,i)=>({t:p[0],i,s:"L"}))),R=shuf(pairs.map((p,i)=>({t:p[1],i,s:"R"})));
 $("asb").innerHTML=`<div class="grid"><div>${L.map(x=>`<div class="tile" data-i="${x.i}" data-s="L" onclick="asClick(this)">${x.t}</div>`).join("<div style='height:8px'></div>")}</div><div>${R.map(x=>`<div class="tile" data-i="${x.i}" data-s="R" onclick="asClick(this)">${x.t}</div>`).join("<div style='height:8px'></div>")}</div></div><div id="asr"></div>`;}
window.asClick=function(el){if(el.classList.contains("done"))return;
 if(!asSel||asSel.dataset.s===el.dataset.s){if(asSel)asSel.classList.remove("sel");asSel=el;el.classList.add("sel");return;}
 const a=asSel;asSel=null;a.classList.remove("sel");
 if(a.dataset.i===el.dataset.i){a.classList.add("done");el.classList.add("done");
   if(document.querySelectorAll("#asb .tile:not(.done)").length===0)$("asr").innerHTML=`<div class="fb ${asErr?'no':'ok'}">Terminé avec <b>${asErr}</b> erreur(s). ${asErr?'Recommence jusqu\'à 0 erreur.':'Parfait 🔥'} <button class="s" onclick="asRender(asSet)">Recommencer</button></div>`;}
 else{asErr++;[a,el].forEach(x=>{x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),600);});}};
$("v-assoc").innerHTML=`<div class="card"><h2>🔗 Associer</h2><p>Clique un terme à gauche, puis sa définition à droite. Refais chaque série jusqu'à <b>0 erreur</b>.</p>
<div>${Object.keys(AS).map(k=>`<button class="s" onclick="asRender('${k}')">${k}</button>`).join("")}</div><div id="asb" style="margin-top:12px"></div></div>`;
asRender("Types de biens");

/* ⑤ GRAPHIQUE O/D */
const OD=[
["Le prix du thé augmente. Effet sur le marché du CAFÉ?","D+","Thé et café sont substituts : les gens passent au café."],
["Le revenu des ménages augmente. Marché des restaurants (bien normal)?","D+","Bien normal : revenu ↑ → demande ↑."],
["Le revenu des ménages augmente. Marché des nouilles instantanées (bien inférieur)?","D-","Bien inférieur : revenu ↑ → demande ↓."],
["Le revenu baisse. Marché des voyages (bien supérieur)?","D-","Revenu ↓ → demande ↓ (encore plus fort pour un bien supérieur)."],
["Le prix des consoles baisse. Marché des JEUX VIDÉO?","D+","Complémentaires : plus de consoles → plus de jeux."],
["Le prix de l'essence explose. Marché des VUS?","D-","Complémentaires : essence chère → moins de VUS."],
["Le prix du beurre d'arachide monte. Marché de la confiture (complémentaire)?","D-","Complémentaires : on achète moins des deux."],
["Le prix du riz augmente. Marché du RIZ, côté acheteurs?","M","Prix du bien lui-même → on glisse SUR la courbe : la quantité demandée baisse. La courbe ne bouge pas!"],
["Une sécheresse détruit les récoltes de blé. Marché du blé?","O-","Désordre climatique → offre ↓."],
["Une nouvelle technologie rend les usines de chocolat 2× plus productives.","O+","Productivité ↑ → offre ↑."],
["Le salaire minimum augmente pour les travailleurs d'usine.","O-","Coûts de production ↑ → offre ↓."],
["Plusieurs nouvelles entreprises entrent sur le marché des vélos.","O+","Nombre de producteurs ↑ → offre ↑."],
["Le prix de l'acier (matière première) baisse. Marché des autos?","O+","Coûts de production ↓ → offre ↑."],
["Le prix du blé augmente. Marché du BLÉ, côté producteurs?","M","Prix du bien lui-même → quantité offerte ↑ (glisse sur la courbe)."],
["Les producteurs de sirop d'érable anticipent un prix beaucoup plus élevé le mois prochain.","O-","Anticipation : ils gardent leur stock pour plus tard → offre ↓ aujourd'hui."],
["Une tempête de verglas détruit des érablières.","O-","Désordre climatique → offre ↓."]];
const LBL={"D+":"Demande ↑ (droite)","D-":"Demande ↓ (gauche)","O+":"Offre ↑ (droite)","O-":"Offre ↓ (gauche)","M":"Aucune courbe ne bouge (on glisse dessus)"};
function svgOD(k,onO){const W=300,H=220,x0=40,y0=190;const L=(x1,y1,x2,y2,c,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="3" ${d?'stroke-dasharray="6 4"':''}/>`;
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:340px;display:block;margin:8px auto">`+L(x0,10,x0,y0,"#333")+L(x0,y0,290,y0,"#333")+`<text x="4" y="18">Prix</text><text x="240" y="208">Quantité</text>`;
 s+=L(70,30,250,170,"#1f6feb")+`<text x="252" y="175" fill="#1f6feb">D</text>`+L(70,170,250,30,"#e67e22")+`<text x="252" y="30" fill="#e67e22">O</text>`;
 const dx=k.endsWith("+")?45:-45;
 if(k[0]==="D")s+=L(70+dx,30,250+dx,170,"#1f6feb",1)+`<text x="${252+dx}" y="165" fill="#1f6feb">D₂</text><text x="150" y="${k.endsWith("+")?90:120}" font-size="22" fill="#1f6feb">${k.endsWith("+")?"→":"←"}</text>`;
 if(k[0]==="O")s+=L(70+dx,170,250+dx,30,"#e67e22",1)+`<text x="${252+dx}" y="45" fill="#e67e22">O₂</text><text x="150" y="${k.endsWith("+")?125:85}" font-size="22" fill="#e67e22">${k.endsWith("+")?"→":"←"}</text>`;
 if(k==="M")s+=onO?`<circle cx="190" cy="77" r="6" fill="#c0392b"/><circle cx="220" cy="53" r="6" fill="#c0392b"/><text x="120" y="45" fill="#c0392b">glisse sur O ↗</text>`:`<circle cx="100" cy="53" r="6" fill="#c0392b"/><circle cx="130" cy="77" r="6" fill="#c0392b"/><text x="120" y="45" fill="#c0392b">glisse sur D ↘</text>`;
 return s+"</svg>";}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ").replace(/\s+/g," ");
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}
function has(a,kk){
 if(a.includes(kk))return true;
 if(kk.includes(" ")||kk.length<5)return false;
 const tol=kk.length>=8?2:1;
 return a.split(/[^a-z0-9-]+/).some(w=>{for(let L=kk.length-1;L<=kk.length+1;L++){if(w.length>=L-1&&lev(w.slice(0,L),kk)<=tol)return true;}return false;});
}
function check(q,a){
 a=norm(a).replace(/\bil+imit/g,"illimit").replace(/\bdecentrali/g,"decentrali");
 const noIll=a.replace(/illimit\w*/g,""), noDec=a.replace(/decentralis\w*/g,"");
 return q[2].every(g=>g.some(k=>{const kk=norm(k);
   if(/^\d+$/.test(kk))return new RegExp("(^|\\D)"+kk+"(\\D|$)").test(a);
   if(kk==="limit")return /limit/.test(noIll);
   if(kk==="centralisation")return has(noDec,kk);
   if(kk==="illimit")return /illimit/.test(a);
   if(["micro","macro","officieuse"].includes(kk))return a.includes(kk.slice(0,5));
   return has(a,kk);}));
}

let order,i,score,wrong,done,round=1;

const app=document.getElementById('app');
function render(){
 if(i>=order.length)return end();

 app.innerHTML=`<div class="top"><span>Question ${i+1}/${order.length} ${round>1?"(reprise des erreurs)":""}</span><span>Score : ${score}</span></div>

 <div id="f"></div><div id="b"><button class="p" onclick="sub()">Valider</button><button class="s" onclick="sub(true)">Je sais pas</button></div>`;
 const inp=document.getElementById('a');inp.focus();
 inp.onkeydown=e=>{if(e.key==="Enter"){done?next():sub()}};
}
window.sub=function(skip){if(done)return;done=true;const q=order[i],a=document.getElementById('a').value;
 const ok=!skip&&a.trim()&&check(q,a);if(ok)score++;else wrong.push(q);
 document.getElementById('f').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Bonne réponse!':'❌ Pas tout à fait.'}<br><b>Réponse :</b> ${q[3]}${truc(q)?'<div style="margin-top:6px">'+truc(q)+'</div>':''}</div>`;
 document.getElementById('b').innerHTML=`<button class="p" onclick="next()">Suivante →</button>${ok?'':(a.trim()?'<button class="s" onclick="override()">J\'avais raison</button>':'')}`;
 document.getElementById('a').focus();
};
window.hint=function(){const t=truc(order[i]);document.getElementById('f').innerHTML=`<div class="fb" style="background:#fff8db;border-left:4px solid #d4a017">${t}</div>`;document.getElementById('a').focus();};
window.override=function(){score++;wrong.pop();next();};
window.next=function(){i++;render();};
function end(){const pct=Math.round(score/order.length*100);
 app.innerHTML=`<h2>Terminé! ${score}/${order.length} (${pct} %)</h2>
 <p>${pct>=90?'🔥 T\'es prêt.':pct>=70?'👍 Bon, révise les erreurs ci-dessous.':'📖 Relis la fiche pour les sujets manqués, puis refais les erreurs.'}</p>
 ${wrong.length?`<h3>À revoir :</h3><ul>${wrong.map(q=>`<li><b>${q[1]}</b><br>→ ${q[3]}${truc(q)?'<br><small>'+truc(q)+'</small>':''}</li>`).join('')}</ul>
 <button class="p" onclick="retry()">Refaire seulement mes erreurs (${wrong.length})</button>`:''}
 <button class="s" onclick="round=1;start(Q)">Recommencer tout</button>`;}
window.retry=function(){round++;start(wrong);};
start(Q);
