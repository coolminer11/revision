<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Révisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--bg2:#eceffa;--pan:#fff;--tx:#10131a;--mut:#6b7280;--line:#e4e8f0;--sh:0 1px 2px #0b0d1208,0 8px 24px #0b0d120a}
@media(prefers-color-scheme:dark){:root{--bg:#0a0c11;--bg2:#10141d;--pan:#141922;--tx:#eef1f7;--mut:#94a0b4;--line:#222a37;--sh:0 1px 2px #0006,0 10px 30px #0006}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;
 background-image:radial-gradient(60vw 40vh at 15% -10%,#6366f126,transparent 60%),radial-gradient(50vw 35vh at 95% 0%,#22d3ee1f,transparent 60%)}
.w{max-width:1000px;margin:auto;padding:38px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(2.6rem,7vw,4rem);line-height:1;margin:0 0 10px;letter-spacing:-.01em}
h1 em{font-style:italic;background:linear-gradient(100deg,#6366f1,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mut);font-size:1.02rem;max-width:44ch}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{font-size:.78rem;color:var(--mut);border:1px solid var(--line);background:var(--pan);border-radius:99px;padding:5px 11px}
.icbtn{border:1px solid var(--line);background:var(--pan);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;font-size:.88rem;box-shadow:var(--sh);white-space:nowrap}
.icbtn:hover{border-color:#6366f1}
.search{position:relative;margin:4px 0 30px}
.search input{width:100%;font:inherit;font-size:1rem;padding:14px 16px 14px 44px;border-radius:14px;border:1px solid var(--line);background:var(--pan);color:var(--tx);box-shadow:var(--sh)}
.search input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 4px #6366f11f}
.search span{position:absolute;left:16px;top:13px;opacity:.5}
.sec{margin-bottom:34px}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--a)}
.sh h2{font-size:1.05rem;font-weight:600;margin:0;letter-spacing:.01em}
.sh .c{font-size:.75rem;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.line{flex:1;height:1px;background:var(--line)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:block;text-decoration:none;color:inherit;background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);transition:transform .18s cubic-bezier(.2,.8,.3,1),border-color .18s,box-shadow .18s;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a),transparent);opacity:0;transition:.18s}
.card:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 14px 34px #0b0d1214}
.card:hover:before{opacity:1}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--a) 14%,transparent);border:1px solid color-mix(in srgb,var(--a) 28%,transparent)}
.ti{font-weight:600;margin:12px 0 6px;font-size:1.02rem;line-height:1.3}
.me{font-size:.78rem;color:var(--mut);display:flex;gap:8px;align-items:center}
.kind{border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.ph{border-style:dashed;background:transparent;cursor:pointer;display:grid;place-items:center;min-height:132px;text-align:center;color:var(--mut)}
.ph:hover{color:var(--tx)}
.ph .ic{margin:auto;border-style:dashed}
.del{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--pan);color:#e5484d;border-radius:9px;width:28px;height:28px;cursor:pointer;font-size:.9rem;line-height:1;opacity:0;transition:.15s}
.card:hover .del{opacity:1}.del:hover{background:#e5484d;color:#fff;border-color:#e5484d}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh);margin-bottom:28px}
.panel b{font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1;min-width:170px}
.panel input,.panel select{font:inherit;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);width:100%}
.panel input:focus,.panel select:focus{outline:none;border-color:#6366f1}
.go{flex:0 0 auto!important;background:linear-gradient(100deg,#6366f1,#4f46e5);color:#fff;border:0;border-radius:11px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.drop{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s}
.drop.on,.drop:hover{border-color:#6366f1;color:var(--tx);background:#6366f10a}
.log{font-size:.85rem;color:var(--mut);margin-top:10px;min-height:1.2em}
.msg{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--mut);box-shadow:var(--sh)}
footer{margin-top:40px;color:var(--mut);font-size:.8rem;text-align:center}
@media(max-width:560px){.w{padding:26px 16px 50px}header{flex-direction:column}}
</style></head><body><div class="w">
<header><div><h1>Mes <em>révisions</em></h1><div class="tag">Quiz, fiches et exercices. Tout roule dans ton navigateur, rien à installer.</div>
<div class="stats" id="stats"></div></div><button class="icbtn" onclick="toggleAdmin()">⚙️ Gérer</button></header>
<div class="panel" id="adm" hidden></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Chercher une matière, un quiz…" oninput="draw()"></div>
<div id="out"><div class="msg">Chargement…</div></div>
<footer>Ajoute un quiz avec ⚙️ Gérer</footer></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AC=["#6366f1","#10b981","#f59e0b","#ec4899","#06b6d4","#8b5cf6"];
const accent=s=>AC[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%AC.length];
let items=[],phs=[];
function repo(){const h=location.hostname,p=location.pathname.split("/").filter(Boolean);if(!h.endsWith(".github.io"))return null;
 return{user:h.split(".")[0],name:(p[0]&&!p[0].endsWith(".html"))?p[0]:h};}
function kind(f){f=f.toLowerCase();return f.includes("fiche")?["📘","Fiche"]:f.includes("entrain")?["🏋️","Entraînement"]:f.includes("flash")?["🃏","Flashcards"]:["🎯","Quiz"];}
const pretty=f=>f.replace(/\.html?$/i,"").replace(/[_-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
let TOKEN=null;try{TOKEN=localStorage.getItem("gh_token");}catch(e){}
if(location.hash.startsWith("#t=")){TOKEN=decodeURIComponent(location.hash.slice(3));try{localStorage.setItem("gh_token",TOKEN);}catch(e){}history.replaceState(null,"",location.pathname);}
const admin=()=>!!TOKEN;
async function gh(m,u,b){const r=repo();const res=await fetch(`https://api.github.com/repos/${r.user}/${r.name}${u}`,{method:m,headers:{Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
 if(!res.ok)throw new Error((await res.json().catch(()=>({}))).message||res.status);return res.status===204?null:res.json();}
function toggleAdmin(){$("adm").hidden=!$("adm").hidden;renderAdmin();if(!$("adm").hidden)$("adm").scrollIntoView({behavior:"smooth",block:"nearest"});}
function renderAdmin(sub){const a=$("adm");if(a.hidden&&sub===undefined)return;
 if(!admin()){a.innerHTML=`<b>Connexion propriétaire</b><div class="log">Colle ta clé GitHub. Elle reste seulement dans ce navigateur — les visiteurs ne voient rien de tout ça.</div>
  <div class="row"><input id="tok" type="password" placeholder="ghp_…"><button class="go" onclick="login()">Connexion</button></div><div class="log" id="lg"></div>`;return;}
 const subs=[...new Set([...items.map(i=>i.subject),...phs.map(p=>p.subject)])].sort();
 a.innerHTML=`<div class="row" style="margin:0;justify-content:space-between;align-items:center"><b>✅ Mode gestion</b><button class="icbtn" style="flex:0" onclick="logout()">Déconnexion</button></div>
  <div class="row"><select id="sub">${subs.map(s=>`<option${s===sub?" selected":""}>${esc(s)}</option>`).join("")}<option value="__new">➕ Nouvelle matière…</option></select><input id="newsub" placeholder="Nom de la nouvelle matière" hidden></div>
  <div class="drop" id="drop">📥 Glisse tes fichiers .html ici — ou clique pour choisir</div><input type="file" id="fi" accept=".html,.htm" multiple hidden>
  <div class="log" id="lg">Pour supprimer : survole un quiz et clique le ✕.</div>`;
 const sel=$("sub"),ns=$("newsub");sel.onchange=()=>{ns.hidden=sel.value!=="__new";if(!ns.hidden)ns.focus();};if(!subs.length){sel.value="__new";ns.hidden=false;}
 const d=$("drop"),fi=$("fi");d.onclick=()=>fi.click();fi.onchange=()=>upload([...fi.files]);
 d.ondragover=e=>{e.preventDefault();d.classList.add("on")};d.ondragleave=()=>d.classList.remove("on");d.ondrop=e=>{e.preventDefault();d.classList.remove("on");upload([...e.dataTransfer.files]);};}
async function login(){TOKEN=$("tok").value.trim();$("lg").textContent="Vérification…";
 try{const i=await gh("GET","");if(!i.permissions||!i.permissions.push)throw new Error("cette clé ne peut pas modifier ce dépôt");try{localStorage.setItem("gh_token",TOKEN);}catch(e){}renderAdmin();draw();}
 catch(e){TOKEN=null;$("lg").textContent="❌ "+e.message;}}
function logout(){TOKEN=null;try{localStorage.removeItem("gh_token");}catch(e){}renderAdmin();draw();}
window.fillSlot=function(sub){$("adm").hidden=false;renderAdmin(sub);$("adm").scrollIntoView({behavior:"smooth",block:"center"});};
const b64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=ko;r.readAsDataURL(f);});
async function upload(files){const sel=$("sub").value,lg=$("lg");
 const subject=(sel==="__new"?$("newsub").value:sel).trim().replace(/[\\/]+/g,"-");
 if(!subject){lg.textContent="❌ Donne un nom à la matière.";return;}
 for(const f of files){if(!/\.html?$/i.test(f.name)){lg.textContent=`⏭️ ${f.name} ignoré (pas un .html)`;continue;}
  const p=`quiz/${subject}/${f.name.replace(/\s+/g,"_")}`;lg.textContent=`⏳ ${f.name}…`;
  try{const old=items.find(i=>i.path===p);const body={message:"Ajout "+p,content:await b64(f)};if(old&&old.sha)body.sha=old.sha;
   const r=await gh("PUT","/contents/"+encodeURI(p),body);const it={path:p,sha:r.content.sha,file:p.split("/").pop(),subject,title:pretty(p.split("/").pop())};
   const t=(await f.text()).match(/<title>([^<]*)<\/title>/i);if(t&&t[1].trim())it.title=t[1].trim();
   items=items.filter(i=>i.path!==p).concat(it);draw();lg.textContent=`✅ ${f.name} ajouté`;}
  catch(e){lg.textContent=`❌ ${f.name} : ${e.message}`;}}
 renderAdmin();$("lg").textContent="✅ Terminé — en ligne dans environ 1 minute.";}
window.del=async function(path,ev){ev.preventDefault();ev.stopPropagation();const it=items.find(i=>i.path===path);
 if(!confirm(`Supprimer « ${it.title} » ?`))return;
 try{await gh("DELETE","/contents/"+encodeURI(path),{message:"Suppression "+path,sha:it.sha});items=items.filter(i=>i.path!==path);draw();renderAdmin();}
 catch(e){alert("Erreur : "+e.message);}}
async function load(){const r=repo();
 if(!r){$("out").innerHTML='<div class="msg">Cette page liste les quiz automatiquement une fois en ligne sur GitHub Pages.</div>';return;}
 let tree=null;
 for(const br of["main","master"]){try{const res=await fetch(`https://api.github.com/repos/${r.user}/${r.name}/git/trees/${br}?recursive=1`);if(res.ok){tree=await res.json();break;}}catch(e){}}
 if(!tree){$("out").innerHTML='<div class="msg">Impossible de lire la liste des quiz. Réessaie dans une minute.</div>';return;}
 items=tree.tree.filter(x=>x.type==="blob"&&/^quiz\/.+\.html?$/i.test(x.path)).map(x=>{const p=x.path.split("/"),file=p.pop();
  return{path:x.path,sha:x.sha,file,subject:p.length>1?p.slice(1).join(" / "):"Divers",title:pretty(file)}});
 try{const p=await fetch("emplacements.json?"+Date.now());if(p.ok)phs=await p.json();}catch(e){}
 draw();
 await Promise.all(items.map(async it=>{try{const t=await(await fetch(it.path)).text();const m=t.match(/<title>([^<]*)<\/title>/i);if(m&&m[1].trim())it.title=m[1].trim();}catch(e){}}));
 draw();}
function draw(){const q=($("q").value||"").toLowerCase();
 $("stats").innerHTML=`<span class="pill">${items.length} document${items.length>1?"s":""}</span><span class="pill">${new Set(items.map(i=>i.subject)).size} matières</span><span class="pill">100 % gratuit</span>`;
 const list=items.filter(i=>(i.title+i.file+i.subject).toLowerCase().includes(q));
 const g={};list.forEach(i=>(g[i.subject]=g[i.subject]||[]).push(i));
 phs.filter(p=>(p.subject+p.title).toLowerCase().includes(q)).forEach(p=>g[p.subject]=g[p.subject]||[]);
 const keys=Object.keys(g).sort();
 if(!keys.length){$("out").innerHTML='<div class="msg">Aucun résultat. Essaie un autre mot.</div>';return;}
 $("out").innerHTML=keys.map(s=>{const a=accent(s);
  const cards=g[s].sort((x,y)=>x.title.localeCompare(y.title)).map(i=>{const k=kind(i.file+i.title);
   return `<a class="card" style="--a:${a}" href="${encodeURI(i.path)}">${admin()?`<button class="del" title="Supprimer" onclick="del('${i.path.replace(/'/g,"\\'")}',event)">✕</button>`:""}
    <div class="ic">${k[0]}</div><div class="ti">${esc(i.title)}</div><div class="me"><span class="kind">${k[1]}</span><span>${esc(i.file)}</span></div></a>`;}).join("")
   +phs.filter(p=>p.subject===s).map(p=>`<div class="card ph" style="--a:${a}" onclick="fillSlot('${esc(p.subject)}')"><div><div class="ic">＋</div><div class="ti">${esc(p.title)}</div><div class="me" style="justify-content:center">Emplacement réservé — dépose-le ici</div></div></div>`).join("");
  return `<section class="sec"><div class="sh"><span class="dot" style="--a:${a}"></span><h2>${esc(s)}</h2><span class="c">${g[s].length+phs.filter(p=>p.subject===s).length}</span><span class="line"></span></div><div class="g">${cards}</div></section>`;}).join("");}
load();
</script></body></html>
