<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahier de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3efe6;--sheet:#fbf9f4;--ink:#1c1b19;--soft:#6e6a62;--rule:#d9d3c5;--red:#c23a22;--hl:#f6e27a}
@media(prefers-color-scheme:dark){:root{--paper:#161513;--sheet:#1e1d1a;--ink:#ece8de;--soft:#9b968b;--rule:#34312b;--red:#e2614a;--hl:#6b5b14}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:980px;margin:0 auto;padding:40px 22px 80px}
/* entête */
.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:18px}
.top h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1;margin:0;letter-spacing:-.015em}
.top p{margin:8px 0 0;color:var(--soft)}
.meta{font-size:12px;color:var(--soft);text-align:right;line-height:1.7}
.btn{border:1px solid var(--ink);background:transparent;padding:7px 12px;border-radius:2px;font-size:13px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.red{border-color:var(--red);color:var(--red)}.btn.red:hover{background:var(--red);color:#fff}
.btn.fill{background:var(--ink);color:var(--paper)}.btn.fill:hover{background:var(--red);border-color:var(--red)}
/* examens */
.exams{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin:0 -2px}
.ex{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:14px 22px 14px 2px;border-right:1px dashed var(--rule);margin-right:20px;align-items:center}
.ex:last-child{border-right:0}
.ex .d{grid-row:span 2;font-family:Newsreader,serif;font-size:2.1rem;line-height:1;text-align:center;min-width:44px}
.ex .d small{display:block;font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--soft)}
.ex .t{font-weight:600;font-size:14px}.ex .s{font-size:12px;color:var(--soft)}
.ex .s b{color:var(--red);font-weight:600}
/* outils */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 8px}
.search{flex:1 1 240px;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 2px;font:inherit;color:var(--ink);outline:none}
.search::placeholder{color:var(--soft)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1px solid var(--rule);background:transparent;padding:3px 10px;border-radius:2px;font:500 12px "IBM Plex Mono",monospace;color:var(--soft)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* matières */
.subj{margin-top:42px}
.sh{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px}
.sh .n{font:500 13px "IBM Plex Mono",monospace;color:var(--red)}
.sh h2{font-family:Newsreader,serif;font-weight:400;font-size:1.75rem;margin:0;line-height:1.1}
.sh .c{font-size:12px;color:var(--soft)}
.sh .c b{color:var(--red);font-weight:600}
.row{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--rule)}
.row:hover{background:var(--sheet)}
.tag{white-space:nowrap;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.04em;border:1px solid currentColor;padding:2px 6px;text-align:center;border-radius:2px;color:var(--soft)}
.tag.quiz{color:var(--red)}.tag.fiche,.tag.note{color:var(--ink)}
.ti{min-width:0}
.ti a,.ti button.lk{font-weight:500;text-decoration:none;background:none;border:0;padding:0;text-align:left;font-size:15px}
.ti a:hover,.ti button.lk:hover{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.ti .f{display:block;font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;gap:6px;align-items:center}
.ib{border:0;background:none;padding:4px 6px;font-size:12px;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.ib:hover{color:var(--ink)}.ib.x:hover{color:var(--red)}
.slot .ti{color:var(--soft);font-style:italic}
.gal{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule)}
.gal figure{margin:0;width:118px;position:relative}
.gal img{width:118px;height:88px;object-fit:cover;border:1px solid var(--rule);display:block;cursor:zoom-in;background:var(--sheet)}
.gal figcaption{font-size:11px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal .ib{position:absolute;top:2px;right:2px;background:var(--sheet);text-decoration:none}
.empty{padding:40px 0;color:var(--soft);font-style:italic;text-align:center}
footer{margin-top:60px;font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* tiroir de gestion */
.veil{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--sheet);border-left:2px solid var(--ink);transform:translateX(100%);transition:.25s ease;z-index:21;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--rule)}
.dh h3{font-family:Newsreader,serif;font-weight:400;font-size:1.5rem;margin:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:0 14px}
.tab{border:0;background:none;padding:10px 8px;font:500 12px "IBM Plex Mono",monospace;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--red)}
.db{padding:18px 20px;overflow-y:auto;flex:1}
label.l{display:block;font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin:14px 0 4px}
.in{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;font:inherit;border-radius:2px}
.in:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea.in{min-height:220px;font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.55}
.drop{margin-top:14px;border:1.5px dashed var(--soft);padding:28px 14px;text-align:center;color:var(--soft);cursor:pointer}
.drop.on,.drop:hover{border-color:var(--red);color:var(--ink);background:var(--paper)}
.drop b{color:var(--ink)}
.log{font-size:13px;color:var(--soft);margin-top:12px;white-space:pre-line}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.li span small{color:var(--soft)}
.hint{font-size:13px;color:var(--soft);margin:6px 0 0}
/* visionneuse */
.view{position:fixed;inset:0;z-index:30;background:#000c;display:none;align-items:center;justify-content:center;padding:20px}
.view.on{display:flex}
.view img{max-width:100%;max-height:88vh;border:1px solid #fff3}
.paperv{background:var(--sheet);color:var(--ink);max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:30px 34px;border:1px solid var(--rule)}
.paperv h1,.paperv h2,.paperv h3{font-family:Newsreader,serif;font-weight:600;line-height:1.2}
.paperv code{background:var(--paper);padding:1px 4px}
.vx{position:fixed;top:14px;right:18px;color:#fff;background:none;border:1px solid #fff8;padding:5px 11px;font-size:13px;z-index:31}
.views{display:flex;gap:22px;margin:18px 0 0;border-bottom:1px solid var(--rule)}
.vw{border:0;background:none;padding:6px 0 9px;font:500 13px "IBM Plex Mono",monospace;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.06em}
.vw.on{color:var(--ink);border-color:var(--red)}
.gterm{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;gap:16px;padding:11px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
.gterm dt{font-family:Newsreader,serif;font-size:1.12rem;font-weight:600;line-height:1.25}
.gterm dt small{display:block;font:400 11px "IBM Plex Mono",monospace;color:var(--soft);margin-top:2px}
.gterm dd{margin:0}
.gterm.hide dd .def{background:var(--rule);color:transparent;border-radius:2px;cursor:pointer;user-select:none}
.gterm.hide dd .def:hover{background:var(--soft)}
.gterm mark{background:var(--hl);color:inherit;padding:0 1px}
.letter{font-family:Newsreader,serif;font-size:1.6rem;color:var(--red);margin:26px 0 2px;border-bottom:1px solid var(--ink)}
.az{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0}
.az a{font:500 12px "IBM Plex Mono",monospace;color:var(--soft);text-decoration:none;padding:2px 6px;border:1px solid transparent}
.az a:hover{border-color:var(--ink);color:var(--ink)}
.gcount{font-size:12px;color:var(--soft);margin:10px 0 0}
@media(max-width:620px){.gterm{grid-template-columns:1fr;gap:4px}
.wrap{padding:26px 16px 70px}.top{grid-template-columns:1fr}.meta{text-align:left}
 .row{grid-template-columns:66px 1fr;gap:10px}.tag{font-size:10px;padding:2px 4px}.act{grid-column:2;justify-content:flex-start;margin-top:-6px}.gterm .act{grid-column:auto;margin-top:0}}
@media print{.tools,.chips,footer,.act,.btn{display:none!important}}
</style></head><body>

 <header class="top"><div><h1 id="ttl">Cahier de révision</h1><p id="stl">Quiz, notes et fiches pour réussir la session.</p></div>

 <div class="exams" id="exams"></div>

 <div class="chips" id="typeChips"></div>
 <main id="out"><div class="empty">Chargement du cahier…</div></main>

</div>
<div class="veil" id="veil" onclick="closeD()"></div>

<div class="view" id="view" onclick="if(event.target===this)closeV()"><button class="vx" onclick="closeV()">Fermer ✕</button><div id="vbody" style="display:contents"></div></div>

/* dépôt GitHub */
function repo(){const qs=new URLSearchParams(location.search).get("repo");if(qs&&qs.includes("/")){const[a,b]=qs.split("/");return{user:a,name:b};}
 const h=location.hostname,p=location.pathname.split("/").filter(Boolean);if(!h.endsWith(".github.io"))return null;
 return{user:h.split(".")[0],name:(p[0]&&!/\.html?$/.test(p[0]))?p[0]:h};}
let TOKEN=null;try{TOKEN=localStorage.getItem("gh_token");}catch(e){}

const admin=()=>!!TOKEN;
async function gh(method,path,body){const r=repo();const h={Accept:"application/vnd.github+json"};if(TOKEN)h.Authorization="Bearer "+TOKEN;if(body)h["Content-Type"]="application/json";
 const res=await fetch(`https://api.github.com/repos/${r.user}/${r.name}${path}`,{method,headers:h,body:body?JSON.stringify(body):undefined});
 if(!res.ok){const j=await res.json().catch(()=>({}));const e=new Error(j.message||("Erreur "+res.status));e.status=res.status;throw e;}
 return res.status===204?null:res.json();}

tratégique","Recherche, traitement et diffusion de l'information utile aux gestionnaires.","Ch. 3 — Management"],["Mégadonnées","Masse d'informations qui circulent et dont l'entreprise doit tenir compte (big data).","Ch. 3 — Management"],["PODC","Cycle administratif : Planifier, Organiser, Diriger, Contrôler. Le contrôle ramène à la planification.","Ch. 3 — Management"],["Planifier","Penser avant d'agir : déterminer la mission, les objectifs et les moyens de les atteindre. C'est une activité continue.","Ch. 3 — Management"],["Mission","Raison d'être de l'entreprise. Elle guide et rallie le personnel.","Ch. 3 — Management"],["Stratégie","Plan à long terme : politiques, programmes, procédures.","Ch. 3 — Management"],["Tactique","Plan à court terme : calendriers, horaires et budgets.","Ch. 3 — Management"],["Organiser","Définir et coordonner les relations entre les personnes, le matériel, les pouvoirs, les tâches et les responsabilités (organigramme, départementalisation).","Ch. 3 — Management"],["Centralisation","Les décisions importantes relèvent du sommet de l'organisation (la décentralisation, c'est la délégation de l'autorité).","Ch. 3 — Management"],["Départementalisation","Regroupement des activités par fonctions, par produits ou par régions.","Ch. 3 — Management"],["Relation hiérarchique","Relation d'autorité entre un patron et un subordonné (la relation de conseil n'a pas d'autorité; la relation fonctionnelle est limitée à une spécialité).","Ch. 3 — Management"],["Diriger","Coordonner le travail, indiquer quoi faire et comment, et motiver les employés. Implique pouvoir, motivation et leadership.","Ch. 3 — Management"],["Pyramide de Maslow","Hiérarchie des besoins, du bas vers le haut : physiologiques, sécurité, appartenance, estime, accomplissement.","Ch. 3 — Management"],["Contrôler","Vérifier la conformité des résultats aux normes préétablies, suivie d'un jugement. Étapes : lire, comparer, interpréter, corriger.","Ch. 3 — Management"],["Tableau de bord","Ensemble d'indicateurs qui montre l'état et l'évolution de l'entreprise ou d'un service.","Ch. 3 — Management"],["Marketing","Ensemble des activités qui consistent à cerner un marché cible, à concevoir des produits adaptés et à établir les politiques de prix, de distribution et de communication.","Ch. 4-5 — Marketing"],["Marché cible","Groupe de consommateurs auquel un produit s'adresse.","Ch. 4-5 — Marketing"],["Besoin","Sentiment de manque ou de privation qui pousse à agir (le désir est l'envie particulière d'un moyen de le combler).","Ch. 4-5 — Marketing"],["Marketing industriel (B2B)","Marketing qui vise les entreprises plutôt que les consommateurs.","Ch. 4-5 — Marketing"],["Utilités","Valeur ajoutée par le marketing : de forme, de temps, d'emplacement et de possession.","Ch. 4-5 — Marketing"],["Recherche marketing","Collecte et analyse systématique de renseignements sur les clients potentiels et les produits qui pourraient les intéresser.","Ch. 4-5 — Marketing"],["Données secondaires","Données déjà recueillies par d'autres (ex. : Statistique Canada), faciles à consulter. Les données primaires, on les recueille soi-même.","Ch. 4-5 — Marketing"],["Segmentation","Division d'un marché en groupes de consommateurs aux caractéristiques semblables.","Ch. 4-5 — Marketing"],["Positionnement","Image qu'on veut donner au produit dans l'esprit des consommateurs, par rapport aux concurrents.","Ch. 4-5 — Marketing"],["Marketing mix (4P)","Les variables que l'entreprise contrôle : Produit, Prix, Place (distribution) et Promotion (communication).","Ch. 4-5 — Marketing"],["Cycle de vie du produit","Étapes que traverse un produit : lancement, croissance, maturité, déclin.","Ch. 4-5 — Marketing"]],"Économie":[["Science économique","Étude de la façon dont les individus et les sociétés utilisent des ressources limitées pour satisfaire leurs besoins.","Bases"],["Rareté","Problème économique de base : les ressources sont limitées alors que les besoins sont illimités, ce qui oblige à faire des choix.","Bases"],["Coût de renonciation","Valeur de la meilleure option à laquelle on renonce quand on prend une décision (aussi appelé coût d'option).","Bases"],["Microéconomie","Branche de l'économie qui étudie les choix des individus et des entreprises.","Bases"],["Macroéconomie","Branche de l'économie qui étudie l'économie dans son ensemble : production globale, inflation, chômage.","Bases"],["Externalité négative","Effet négatif de l'activité d'un agent (production ou consommation) sur le bien-être d'autres personnes, sans compensation. Ex. : la pollution.","Bases"],["Internalisation","Fait de faire payer le coût d'une externalité à celui qui la cause (principe du pollueur-payeur).","Bases"],["Économie linéaire","Modèle « extraire, produire, jeter ».","Bases"],["Économie circulaire","Modèle qui réduit le gaspillage en concevant des produits réutilisables, réparables, recyclables ou biodégradables.","Bases"],["Courbe des possibilités de production (CPP)","Courbe qui montre toutes les combinaisons maximales de deux biens qu'une économie peut produire avec ses ressources. Un point à l'intérieur = ressources sous-utilisées; à l'extérieur = impossible.","Bases"],["Croissance (sur la CPP)","Déplacement de la courbe des possibilités de production vers l'extérieur.","Bases"],["Marché","Lieu, réel ou virtuel, qui réunit des acheteurs (demandeurs) et des vendeurs (offreurs) pour échanger.","Marché"],["Demande","Quantités d'un bien que les consommateurs veulent acheter à différents prix.","Marché"],["Quantité demandée","Quantité précise associée à un prix précis. Elle varie quand le prix du bien lui-même change (on glisse sur la courbe).","Marché"],["Offre","Quantités d'un bien que les producteurs veulent et peuvent vendre à différents prix.","Marché"],["Ceteris paribus","« Toutes choses étant égales par ailleurs » : on change un seul facteur à la fois pour en mesurer l'effet.","Marché"],["Prix d'équilibre","Prix auquel la quantité offerte est égale à la quantité demandée.","Marché"],["Biens substituts","Biens qui peuvent se remplacer l'un l'autre (café et thé).","Marché"],["Biens complémentaires","Biens consommés ensemble (auto et essence).","Marché"],["Bien normal","Bien dont la demande augmente quand le revenu augmente.","Marché"],["Bien inférieur","Bien dont la demande diminue quand le revenu augmente.","Marché"],["Concurrence parfaite","Marché avec tellement d'acheteurs et de vendeurs qu'aucun ne peut influencer le prix.","Marché"],["Concurrence monopolistique","Marché avec beaucoup de vendeurs qui offrent des produits différenciés (ex. : restaurants).","Marché"],["Oligopole","Marché dominé par quelques grandes entreprises (ex. : télécommunications).","Marché"],["Monopole","Marché avec un seul vendeur.","Marché"],["Indice des prix à la consommation (IPC)","Moyenne pondérée des prix d'un panier d'environ 600 biens et services consommés par un ménage type. Sert à calculer l'inflation.","Coût de la vie"],["Indice implicite des prix (IIP)","Indice des prix de tous les biens et services finaux produits au pays. Sert à « dégonfler » le PIB (déflateur du PIB).","Coût de la vie"],["Moyenne pondérée","Moyenne qui tient compte du poids de chaque élément (le logement pèse plus que les vêtements dans le panier de l'IPC).","Coût de la vie"],["Année de référence","Année de base d'un indice, où l'indice vaut 100.","Coût de la vie"],["Inflation","Hausse soutenue du niveau moyen des prix, qui fait perdre du pouvoir d'achat.","Coût de la vie"],["Déflation","Baisse du niveau moyen des prix, qui fait gagner du pouvoir d'achat.","Coût de la vie"],["Réduflation","Inflation cachée : la quantité du produit diminue, mais le prix reste le même.","Coût de la vie"],["Déqualiflation","Inflation cachée : la qualité du produit diminue, mais le prix reste le même.","Coût de la vie"],["Pouvoir d'achat","Quantité de biens et services qu'on peut acheter avec un montant d'argent donné.","Coût de la vie"],["Taux d'inflation","Variation en % de l'IPC : (IPC courant − IPC précédent) ÷ IPC précédent × 100.","Coût de la vie"],["Salaire nominal","Salaire en dollars courants, tel qu'écrit sur la paie.","Coût de la vie"],["Salaire réel","Salaire corrigé de l'inflation : salaire nominal ÷ IPC × 100.","Coût de la vie"],["Taux d'intérêt réel","Rendement corrigé de l'inflation : 1 + taux réel = (1 + taux nominal) ÷ (1 + taux d'inflation).","Coût de la vie"],["Inflation par la demande","Inflation causée par une hausse de la demande, qui fait monter les prix.","Coût de la vie"],["Inflation par les coûts","Inflation causée par la hausse des coûts de production, qui réduit l'offre et fait monter les prix.","Coût de la vie"],["Inflation importée","Inflation causée par la hausse des prix à l'étranger, qui rend les produits importés plus chers.","Coût de la vie"],["Masse monétaire","Quantité de monnaie en circulation. Si elle augmente trop, la monnaie perd de la valeur et les prix montent.","Coût de la vie"],["Produit intérieur brut (PIB)","Valeur, aux prix du marché, de tous les biens et services finaux produits à l'intérieur des frontières d'un pays pendant une période donnée.","PIB"],["Bien final","Bien acheté par l'utilisateur final; il est compté dans le PIB.","PIB"],["Bien intermédiaire","Bien qui sert à fabriquer un autre bien (la farine pour le pain). Il est exclu du PIB pour éviter le double comptage.","PIB"],["Méthode des dépenses","Calcul du PIB par les dépenses : PIB = C + I + G + (X − M).","PIB"],["Consommation (C)","Dépenses des ménages en biens durables, semi-durables, non durables et en services.","PIB"],["Investissement (I)","Dépenses des entreprises en constructions, équipements neufs et variation des stocks (incluant les maisons neuves).","PIB"],["Dépenses publiques (G)","Dépenses des administrations publiques en biens et services. Excluent les paiements de transfert, les subventions et les intérêts sur la dette.","PIB"],["Exportations nettes (X − M)","Valeur des exportations moins celle des importations.","PIB"],["Méthode des revenus","Calcul du PIB par les revenus : PIB = S + EE + RM + (IMP − SUB).","PIB"],["Excédent d'exploitation brut (EE)","Revenus des sociétés, incluant les impôts et la dépréciation du capital.","PIB"],["Revenu mixte brut (RM)","Revenus des entreprises individuelles, revenus de location et rémunération des propriétaires d'entreprise.","PIB"],["Divergence statistique","Moitié de la différence entre le PIB des dépenses et le PIB des revenus : (dépenses − revenus) ÷ 2.","PIB"],["Paiement de transfert","Argent versé par l'État sans production en échange (aide sociale, assurance-emploi, pensions). Exclu du PIB.","PIB"],["Économie souterraine","Activités non déclarées (travail au noir, activités illégales), non comptées dans le PIB.","PIB"],["PIB nominal","Valeur de la production en dollars courants.","PIB"],["PIB réel","Valeur de la production en dollars constants d'une année de référence; il corrige l'effet de l'inflation.","PIB"],["Croissance économique","Évolution de la production globale, mesurée par la variation en % du PIB réel.","PIB"],["Récession","Baisse du PIB réel pendant deux trimestres consécutifs.","PIB"],["Indice de développement humain (IDH)","Indice du PNUD (1990), entre 0 et 1, qui combine l'espérance de vie, l'éducation (durée moyenne et attendue de scolarité) et le revenu (RNB par habitant en PPA).","IDH et inégalités"],["Courbe de Lorenz","Courbe qui met en relation les pourcentages cumulés des revenus et de la population.","IDH et inégalités"],["Droite d'égalité parfaite","Situation théorique où les revenus sont répartis de façon parfaitement égale.","IDH et inégalités"],["Coefficient de Gini","Mesure de l'inégalité des revenus : l'aire entre la courbe de Lorenz et la droite d'égalité parfaite. Plus il est élevé, plus c'est inégal.","IDH et inégalités"],["Quintile","Tranche de 20 % de la population, utilisée pour mesurer la répartition du revenu.","IDH et inégalités"],["Chômage","Situation où des ressources productives (le travail) demeurent inutilisées. Dans le modèle, c'est une offre excédentaire de travail.","Chômage"],["Chômage frictionnel","Chômage qui résulte de la mobilité normale de la main-d'œuvre (nouveau diplômé, changement d'emploi, fin de contrat).","Chômage"],["Chômage structurel","Chômage qui résulte de changements technologiques, de la concurrence internationale, de facteurs démographiques ou de lois, qui modifient les compétences demandées.","Chômage"],["Chômage saisonnier","Chômage causé par les facteurs climatiques (construction l'hiver, moniteur de ski l'été).","Chômage"],["Chômage cyclique","Chômage qui découle du ralentissement de l'activité économique (aussi appelé conjoncturel).","Chômage"],["Plein emploi","Situation où l'économie produit à pleine capacité. Il n'y a aucun chômage cyclique, mais il reste du chômage frictionnel et structurel.","Chômage"],["Taux de chômage naturel","Taux de chômage observé au plein emploi (environ 6 % au Canada).","Chômage"],["Enquête sur la population active (EPA)","Enquête mensuelle de Statistique Canada auprès d'environ 54 000 ménages sur le marché du travail.","Chômage"],["Population active","Personnes de 15 ans et plus qui ont un emploi ou qui sont en chômage.","Chômage"],["Population inactive","Personnes de 15 ans et plus qui ne travaillent pas et ne cherchent pas d'emploi (retraités, étudiants à temps plein, chômeurs découragés).","Chômage"],["Personne occupée","Personne qui, la semaine de l'enquête, a travaillé contre rémunération ou avait un emploi mais était absente (maladie, etc.).","Chômage"],["Chômeur","Personne disponible pour travailler, mais sans emploi rémunéré la semaine de l'enquête.","Chômage"],["Taux de chômage","Chômeurs ÷ population active × 100.","Chômage"],["Taux d'activité","Population active ÷ population de 15 ans et plus × 100.","Chômage"],["Taux d'emploi","Personnes occupées ÷ population de 15 ans et plus × 100.","Chômage"]],"Psychologie":[["Psychologie","Étude scientifique du comportement et des processus mentaux.","Introduction"],["Comportement","Ensemble des actions et réactions observables, directement ou avec un appareil.","Introduction"],["Processus mentaux","Activités internes, intellectuelles ou affectives : penser, se souvenir, ressentir, percevoir, décider.","Introduction"],["Recherche fondamentale","Recherche qui vise à élargir les connaissances scientifiques.","Introduction"],["Recherche appliquée","Recherche qui vise à résoudre des problèmes concrets.","Introduction"],["Psychologie populaire","Mauvaises interprétations de la recherche en psychologie, répandues dans les livres, les articles et les blogues (ex. : « on utilise 10 % de notre cerveau »).","Introduction"],["Méthode scientifique (objectifs)","Décrire, expliquer, prédire et modifier les comportements et processus mentaux.","Introduction"],["Méthode expérimentale","Méthode qui compare des groupes pour établir un lien de cause à effet entre une variable indépendante et une variable dépendante.","Introduction"],["Variable indépendante (VI)","Variable manipulée par le chercheur : la cause.","Introduction"],["Variable dépendante (VD)","Variable mesurée, qui subit l'effet de la VI.","Introduction"],["Variable contrôlée","Facteur qui pourrait fausser les résultats et qu'on neutralise.","Introduction"],["Groupe expérimental","Groupe exposé à la variable indépendante (le groupe contrôle ne l'est pas).","Introduction"],["Étude de cas","Méthode qui recueille le plus d'information possible sur un cas rare ou représentatif.","Introduction"],["Enquête","Méthode qui sert à connaître les comportements, opinions ou attitudes typiques d'un groupe (sondage).","Introduction"],["Plasticité cérébrale","Capacité du système nerveux à modifier ses connexions et son fonctionnement selon l'expérience, l'apprentissage ou les lésions.","Introduction"],["Psychanalyse","Approche fondée par Freud, centrée sur l'inconscient, les conflits psychiques et les expériences de l'enfance.","Approches"],["Behaviorisme","Approche fondée par Watson, qui étudie seulement les comportements observables et mesurables (stimulus, réponse, conditionnement).","Approches"],["Gestaltisme","Approche fondée par Wertheimer : on perçoit des ensembles organisés, car « le tout est différent de la somme de ses parties ».","Approches"],["Humanisme","Approche de Rogers et Maslow, centrée sur la personne, sa liberté, son expérience et son épanouissement.","Approches"],["Cognitivisme","Approche associée à Piaget, qui étudie le traitement de l'information : attention, perception, mémoire, langage, pensée.","Approches"],["Approche écosystémique","Approche de Bronfenbrenner qui étudie le développement à travers les interactions entre la personne et ses milieux de vie.","Approches"],["Approche psychobiologique","Approche qui étudie les liens entre le comportement et le corps : neurones, hormones, gènes.","Approches"],["Psychologie positive","Approche de Seligman qui étudie scientifiquement les forces, le bien-être et l'épanouissement.","Approches"],["Approche éclectique","Utilisation réfléchie de plusieurs approches selon les besoins de la personne.","Approches"],["Congruence","Selon Rogers, accord entre l'expérience vécue, la conscience de soi et l'expression de soi.","Approches"],["Regard positif inconditionnel","Selon Rogers, accepter la personne sans condition ni jugement.","Approches"],["Schème","Selon Piaget, structure mentale organisée qui permet d'agir et de comprendre.","Approches"],["Assimilation","Intégrer une nouvelle situation à un schème existant (appeler un chat « chien »).","Approches"],["Accommodation (Piaget)","Modifier un schème pour tenir compte d'une nouvelle situation.","Approches"],["Microsystème","Milieux avec lesquels la personne interagit directement : famille, classe, amis.","Approches"],["Mésosystème","Relations entre les microsystèmes (ex. : collaboration parents-profs).","Approches"],["Exosystème","Milieux qui influencent la personne sans qu'elle y participe (ex. : le travail d'un parent).","Approches"],["Macrosystème","Cadre socioculturel : valeurs, normes, lois, culture.","Approches"],["Chronosystème","Dimension du temps et des transitions (ex. : passage au cégep, pandémie).","Approches"],["Conscient","Pensées et perceptions accessibles en ce moment.","Freud"],["Préconscient","Informations qui ne sont pas présentes à l'esprit, mais faciles à récupérer.","Freud"],["Inconscient","Désirs, souvenirs et conflits inaccessibles à la conscience qui, selon Freud, influencent la conduite.","Freud"],["Ça","Instance pulsionnelle qui cherche la satisfaction immédiate (principe de plaisir).","Freud"],["Moi","Instance qui fait la médiation entre le ça, le surmoi et la réalité (principe de réalité).","Freud"],["Surmoi","Instance morale : règles et interdits intériorisés (principe de moralité).","Freud"],["Mécanisme de défense","Stratégie inconsciente qui réduit l'anxiété ou un conflit psychique (décrits par Anna Freud).","Freud"],["Déni","Refuser de reconnaître une réalité pénible.","Freud"],["Déplacement","Rediriger une émotion vers une cible moins menaçante.","Freud"],["Projection","Attribuer à autrui ses propres émotions ou désirs inacceptables.","Freud"],["Rationalisation","Donner une explication raisonnable pour cacher ses vrais motifs.","Freud"],["Refoulement","Rendre inconsciemment un souvenir pénible inaccessible à la conscience.","Freud"],["Régression","Revenir à un comportement d'une étape moins mature.","Freud"],["Sublimation","Orienter une impulsion inacceptable vers une activité socialement valorisée.","Freud"],["Formation réactionnelle","Afficher l'attitude opposée à ce qu'on ressent vraiment.","Freud"],["État altéré de conscience","État mental qui diffère de la vigilance habituelle (sommeil, rêve, hypnose, méditation, effets de psychotropes).","Conscience et sommeil"],["Rythme circadien","Rythme biologique d'environ 24 heures, comme l'alternance veille-sommeil.","Conscience et sommeil"],["Sommeil paradoxal","Stade de sommeil où le cerveau est actif comme à l'éveil, les muscles sont paralysés et les yeux bougent rapidement (MOR). C'est le principal stade du rêve.","Conscience et sommeil"],["Sommeil profond","Stades 3 et 4 du sommeil, surtout au début de la nuit.","Conscience et sommeil"],["Contenu manifeste","Selon la psychanalyse, ce dont on se souvient du rêve.","Conscience et sommeil"],["Contenu latent","Selon la psychanalyse, la signification cachée et inconsciente du rêve.","Conscience et sommeil"],["Insomnie","Difficulté à s'endormir ou à rester endormi.","Conscience et sommeil"],["Narcolepsie","Endormissements soudains et involontaires pendant la journée.","Conscience et sommeil"],["Apnée du sommeil","Arrêts répétés de la respiration pendant le sommeil.","Conscience et sommeil"],["Psychotrope","Substance qui agit sur le système nerveux et modifie la conscience, l'humeur, les perceptions ou le comportement.","Psychotropes"],["Tolérance","Besoin d'une dose de plus en plus forte pour obtenir le même effet.","Psychotropes"],["Dépendance","Besoin physique ou psychologique de consommer une substance, de façon répétée et incontrôlée.","Psychotropes"],["Dépresseur","Psychotrope qui ralentit le système nerveux central (alcool, opioïdes, GHB).","Psychotropes"],["Stimulant","Psychotrope qui accélère le système nerveux (caféine, nicotine, cocaïne).","Psychotropes"],["Perturbateur","Psychotrope qui altère les perceptions (cannabis, LSD, champignons magiques).","Psychotropes"],["Polyconsommation","Consommation de plusieurs substances en même temps; les effets peuvent se multiplier.","Psychotropes"],["Sensation","Détection d'un stimulus par un organe sensoriel et transmission de l'information au système nerveux.","Sensation et perception"],["Perception","Processus par lequel le cerveau sélectionne, organise et interprète les informations sensorielles.","Sensation et perception"],["Transduction","Transformation de l'énergie d'un stimulus en signal nerveux par les récepteurs.","Sensation et perception"],["Seuil absolu","Intensité minimale d'un stimulus détectée environ 50 % du temps.","Sensation et perception"],["Seuil différentiel","Plus petite différence entre deux stimuli perçue environ 50 % du temps.","Sensation et perception"],["Loi de Weber","La différence juste perceptible est une proportion constante de l'intensité de départ (ΔI ÷ I = k).","Sensation et perception"],["Adaptation sensorielle","Diminution de la sensibilité à un stimulus continu et stable.","Sensation et perception"],["Attention sélective","Capacité de se concentrer sur un stimulus en filtrant les autres.","Sensation et perception"],["Proprioception","Perception de la position et du mouvement de ses membres.","Sensation et perception"],["Bâtonnets","Photorécepteurs de la rétine très sensibles à la faible lumière (vision de nuit, peu de couleur).","Sensation et perception"],["Cônes","Photorécepteurs de la rétine responsables de la vision des couleurs et des détails.","Sensation et perception"],["Fovéa","Zone centrale de la rétine, riche en cônes, essentielle à la vision détaillée.","Sensation et perception"],["Synthèse additive","Mélange de lumières (rouge, vert, bleu) qui tend vers le blanc, comme sur un écran.","Sensation et perception"],["Synthèse soustractive","Mélange de pigments (cyan, magenta, jaune) qui tend vers le foncé, comme en impression.","Sensation et perception"],["Théorie trichromatique","La perception des couleurs repose sur trois types de cônes.","Sensation et perception"],["Théorie des processus antagonistes","La couleur est traitée par des oppositions : rouge-vert, bleu-jaune, clair-sombre (explique l'image rémanente).","Sensation et perception"],["Timbre","Qualité qui permet de distinguer deux sons de même hauteur et de même intensité.","Sensation et perception"],["Proximité (Gestalt)","Loi selon laquelle on regroupe les éléments rapprochés.","Sensation et perception"],["Similarité (Gestalt)","Loi selon laquelle on regroupe les éléments semblables.","Sensation et perception"],["Clôture (Gestalt)","Loi selon laquelle on complète mentalement une forme incomplète.","Sensation et perception"],["Figure-fond","Loi selon laquelle on distingue un objet principal de son arrière-plan (vase de Rubin).","Sensation et perception"],["Constance perceptive","Percevoir un objet comme stable (forme, taille, couleur, clarté) même si son image sur la rétine change.","Sensation et perception"],["Disparité rétinienne","Indice binoculaire de profondeur : chaque œil voit une image légèrement différente.","Sensation et perception"],["Convergence","Indice binoculaire de profondeur : les yeux tournent vers l'intérieur pour fixer un objet proche.","Sensation et perception"],["Illusion perceptive","Interprétation trompeuse d'un stimulus réel (une hallucination, elle, se produit sans stimulus).","Sensation et perception"],["Neurone","Cellule spécialisée qui reçoit, intègre et transmet des signaux.","Système nerveux"],["Cellule gliale","Cellule de soutien du système nerveux; certaines produisent la myéline.","Système nerveux"],["Dendrites","Prolongements du neurone qui reçoivent les signaux.","Système nerveux"],["Axone","Prolongement du neurone qui conduit le potentiel d'action vers les terminaisons.","Système nerveux"],["Myéline","Gaine isolante qui accélère la conduction de l'influx nerveux (conduction saltatoire).","Système nerveux"],["Synapse","Zone de communication entre deux cellules nerveuses, où passent les neurotransmetteurs.","Système nerveux"],["Neurotransmetteur","Messager chimique libéré dans la synapse (ex. : dopamine, sérotonine, GABA, glutamate, acétylcholine).","Système nerveux"],["Système nerveux central (SNC)","Encéphale et moelle épinière.","Système nerveux"],["Système nerveux périphérique (SNP)","Nerfs situés hors du SNC; il comprend le système somatique et le système autonome.","Système nerveux"],["Système sympathique","Partie du système autonome qui mobilise le corps (fuite ou combat).","Système nerveux"],["Système parasympathique","Partie du système autonome qui favorise le entation de la réaction à un stimulus après une expérience marquante.","Apprentissage"],["Conditionnement classique","Apprentissage d'une association entre deux stimuli (Pavlov).","Apprentissage"],["Stimulus inconditionnel (SI)","Stimulus qui provoque naturellement une réponse (la nourriture, chez Pavlov).","Apprentissage"],["Stimulus conditionnel (SC)","Stimulus d'abord neutre qui, après association, déclenche la réponse apprise (la cloche).","Apprentissage"],["Réponse conditionnelle (RC)","Réponse apprise au stimulus conditionnel (saliver à la cloche).","Apprentissage"],["Extinction","Diminution de la réponse conditionnelle quand le SC est présenté sans le SI.","Apprentissage"],["Généralisation","Réagir aussi à des stimuli semblables au stimulus conditionnel.","Apprentissage"],["Conditionnement opérant","Apprentissage où la fréquence d'un comportement change selon ses conséquences (Skinner).","Apprentissage"],["Renforcement positif","Ajouter une conséquence agréable pour augmenter un comportement.","Apprentissage"],["Renforcement négatif","Retirer une conséquence désagréable pour augmenter un comportement (ce n'est pas une punition).","Apprentissage"],["Punition positive","Ajouter une conséquence désagréable pour diminuer un comportement.","Apprentissage"],["Punition négative","Retirer quelque chose d'agréable pour diminuer un comportement.","Apprentissage"],["Façonnement","Renforcer de petites étapes successives vers un comportement cible.","Apprentissage"],["Apprentissage latent","Apprentissage qui n'apparaît pas tout de suite et se manifeste quand il devient utile (Tolman).","Apprentissage"],["Apprentissage par intuition","Solution soudaine d'un problème après réflexion, l'effet « eurêka » (Köhler).","Apprentissage"],["Apprentissage par observation","Apprendre en observant un modèle et les conséquences de ses actes (Bandura).","Apprentissage"]],"MTI":[["Métier d'étudiant","L'idée qu'étudier est un vrai travail, qui demande de l'autonomie, du sens des responsabi e, sociologie, économie, administration, histoire, géographie, anthropologie, science politique, sciences des religions.","Recherche"],["Recherche documentaire","Démarche pour trouver de l'information fiable : préparer la recherche, trouver l'information, évaluer les sources, puis citer les sources.","Sources"],["Mots-clés","Termes essentiels qui représentent les idées principales d'un sujet. On y ajoute des synonymes, des termes connexes et des termes en anglais pour diversifier les sources.","Sources"],["Koha","Catalogue de la bibliothèque du cégep, qui sert à trouver des livres et leur cote.","Sources"],["Cote","« Adresse » d'un livre sur les rayons de la bibliothèque.","Sources"],["Érudit","Base de données d'articles scientifiques, surtout québécois et francophones.","Sources"],["Cairn","Base de données d'articles scientifiques et de revues francophones.","Sources"],["Critères d'une bonne source","Une bonne source est pertinente (liée à la question), fiable (crédible), variée (types différents) et accessible (on peut la consulter).","Sources"],["Les 6 questions d'évaluation","Qui (auteur, compétences)? Quoi (contenu, pertinence)? Où (lieu, territoire)? Quand (date, actualité)? Comment (méthode, données)? Pourquoi (intention : informer, convaincre, vendre)?","Sources"],["Monographie","Livre qui traite d'un sujet précis, écrit par un ou quelques auteurs.","Sources"],["Ouvrage collectif","Livre dont les chapitres sont écrits par plusieurs auteurs, sous la direction d'une ou de plusieurs personnes.","Sources"],["Ouvrage de référence","Ouvrage qu'on consulte pour des définitions ou une vue d'ensemble : dictionnaire, encyclopédie, atlas.","Sources"],["Article scientifique","Texte publié dans une revue savante, écrit par des chercheurs et révisé par des pairs, avec une méthode et des références.","Sources"],["Publication gouvernementale","Document publié par un gouvernement ou un organisme public, comme Statistique Canada ou un ministère.","Sources"],["Rapport de recherche","Document qui présente la démarche et les résultats d'une étude, souvent produit par une chaire ou un institut de recherche.","Sources"],["Fiche synthèse","Fiche qui résume une source : titre, auteur, année, type, comment on l'a trouvée, comment y accéder et son utilité justifiée par les 6 questions.","Sources"],["Fait","Énoncé objectif et vérifiable.","Sources"],["Opinion","Énoncé subjectif qui exprime un jugement personnel (« je pense », « devrait », « meilleur »).","Sources"],["Méthode APA","Méthode de référencement auteur-date : on indique (Nom, année, p. X) directement dans le texte.","Citer"],["Méthode traditionnelle","Méthode de référencement où un appel de note dans le texte renvoie à une référence complète en note de bas de page.","Citer"],["Ibid.","Abréviation utilisée en note de bas de page pour dire « même source que la note juste avant ».","Citer"],["Op. cit.","Abréviation utilisée en note de bas de page pour une source déjà citée plus haut, mais pas dans la note juste avant.","Citer"],["Citation courte","Citation de moins de trois lignes, intégrée au texte entre guillemets français « », avec sa référence.","Citer"],["Citation longue","Citation de trois lignes et plus, présentée en bloc, en retrait, à interligne simple, sans guillemets, avec sa référence.","Citer"],["Paraphrase","Reformulation dans ses propres mots de l'idée d'un auteur, sans guillemets mais toujours avec la référence.","Citer"],["Crochets [ ]","Signes qui indiquent une modification dans une citation : un mot ajouté ou changé, un passage coupé […], ou [sic] pour une erreur présente dans l'original.","Citer"],["Bibliographie","Liste des documents écrits (livres, articles) utilisés pour un travail.","Citer"],["Médiagraphie","Liste de tous les documents utilisés, peu importe le support (livres, articles, sites web, vidéos, balados). Classée par sections et par ordre alphabétique, avec un alinéa à partir de la 2e ligne.","Citer"],["Lecture de survol","Lecture rapide pour avoir une vue d'ensemble d'un texte : titres, introduction, conclusion (aussi appelée écrémage).","Rédaction et lecture"],["Lecture de repérage","Lecture qui sert à trouver une information précise dans un texte, comme un chiffre ou une date.","Rédaction et lecture"],["Lecture approfondie","Lecture lente et active pour comprendre un texte en détail, en l'annotant.","Rédaction et lecture"],["Lecture critique","Lecture qui évalue la qualité des arguments et la crédibilité d'un texte.","Rédaction et lecture"],["Résumé","Texte qui condense les idées principales d'un autre texte, sans donner d'opinion.","Rédaction et lecture"],["Compte rendu","Texte en six sections : introduction, résumé (150-200 mots), analyse (150-200 mots), critique (150-200 mots), conclusion et médiagraphie.","Rédaction et lecture"],["Analyse (compte rendu)","Section qui examine la conférence : clarté et logique du discours, structure, solidité, pertinence, forces et limites, apport.","Rédaction et lecture"],["Critique (compte rendu)","Section où l'on prend position de façon claire, honnête, nuancée et appuyée par des arguments.","Rédaction et lecture"]]};
let GL=JSON.parse(JSON.stringify(DEFAULT_GL)),glSha=null,view=location.hash.startsWith("#glossaire")?"gl":"docs",glMode="theme",glCourse=decodeURIComponent((location.hash.split("/")[1]||"all")),glHide=false;
let loaded=false,loadErr="";
let items=[],cfg={title:"",subtitle:"",exams:[],links:[],slots:[],titles:{}},cfgSha=null,fSub="all",fType="all";
const SUBS=()=>[...new Set([...items.map(i=>i.subject),...cfg.links.map(l=>l.subject),...cfg.slots.map(s=>s.subject),...cfg.exams.map(e=>e.subject)])].filter(Boolean).sort((a,b)=>a.localeCompare(b,"fr"));
const titleOf=it=>cfg.titles[it.path]||it.title;

async function loadCfg(){
 if(admin()){try{const j=await gh("GET","/contents/site.json");cfgSha=j.sha;Object.assign(cfg,JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))))));return;}catch(e){if(e.status!==404)console.warn(e);}}
 try{const r=await fetch("site.json?"+Date.now());if(r.ok){Object.assign(cfg,await r.json());return;}}catch(e){}
 try{const r=await fetch("emplacements.json?"+Date.now());if(r.ok)cfg.slots=(await r.json()).map(s=>({subject:s.subject,title:s.title}));}catch(e){}}
async function saveCfg(msg){if(cfgSha===null){try{cfgSha=(await gh("GET","/contents/site.json")).sha;}catch(e){cfgSha=undefined;}}
 const body={message:msg,content:b64txt(JSON.stringify(cfg,null,2))};if(cfgSha)body.sha=cfgSha;
 const r=await gh("PUT","/contents/site.json",body);cfgSha=r.content.sha;}

async function loadGl(){
 if(admin()){try{const j=await gh("GET","/contents/glossaire.json");glSha=j.sha;GL=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));return;}catch(e){if(e.status!==404)console.warn(e);}}
 try{const r=await fetch("glossaire.json?"+Date.now());if(r.ok)GL=await r.json();}catch(e){}}
async function saveGl(msg){if(glSha===null){try{glSha=(await gh("GET","/contents/glossaire.json")).sha;}catch(e){glSha=undefined;}}
 const body={message:msg,content:b64txt(JSON.stringify(GL,null,1))};if(glSha)body.sha=glSha;const r=await gh("PUT","/contents/glossaire.json",body);glSha=r.content.sha;}
async function load(){const r=repo();
 if(!r){draw();return;}
 await Promise.all([loadCfg(),loadGl()]);
 let tree=null;
 for(const br of["main","master"]){try{tree=await gh("GET",`/git/trees/${br}?recursive=1`);break;}catch(e){}}
 if(!tree){loadErr="Impossible de lire la liste des documents pour l'instant (limite de GitHub). Réessaie dans quelques minutes. Le glossaire, lui, fonctionne.";loaded=true;draw();return;}
 items=tree.tree.filter(x=>x.type==="blob"&&/^quiz\/[^/]+\/.+/.test(x.path)).map(x=>{const p=x.path.split("/");const file=p.pop();return{path:x.path,sha:x.sha,size:x.size,file,subject:p.slice(1).join(" / "),title:pretty(file)};});
 loaded=true;draw();
 await Promise.all(items.filter(i=>/\.(html?|md|txt)$/i.test(i.file)).map(async it=>{try{const t=await(await fetch(urlOf(it.path))).text();
   const m=/\.html?$/i.test(it.file)?t.match(/<title>([^<]*)<\/title>/i):t.match(/^#\s+(.+)$/m);if(m&&m[1].trim())it.title=m[1].trim();}catch(e){}}));
 draw();}

function drawHead(){$("ttl").textContent=cfg.title||"Cahier de révision";$("stl").textContent=cfg.subtitle||"Quiz, notes et fiches pour réussir la session.";document.title=cfg.title||"Cahier de révision";
 $("admBtn").textContent=admin()?"Gérer ✓":"Gérer";
 $("cnt").textContent=`${items.length} documents · ${SUBS().length} matières`;
 const now=new Date();now.setHours(0,0,0,0);
 const ex=cfg.exams.map(e=>({...e,dt:new Date(e.date+"T00:00")})).filter(e=>e.dt>=now).sort((a,b)=>a.dt-b.dt);
 $("exams").innerHTML=ex.map(e=>{const d=Math.round((e.dt-now)/864e5);return `<div class="ex"><div class="d">${e.dt.getDate()}<small>${MOIS[e.dt.getMonth()]}</small></div><div class="t">${esc(e.subject)}</div><div class="s">${esc(e.title||"Examen")} · <b>${d===0?"aujourd'hui":d===1?"demain":"dans "+d+" jours"}</b></div></div>`;}).join("");
 $("exams").style.display=ex.length?"flex":"none";
 $("foot").textContent=repo()?`${repo().user}/${repo().name}`:"";}
function nextExam(s){const now=new Date();now.setHours(0,0,0,0);const e=cfg.exams.filter(x=>x.subject===s).map(x=>({...x,dt:new Date(x.date+"T00:00")})).filter(x=>x.dt>=now).sort((a,b)=>a.dt-b.dt)[0];
 if(!e)return"";const d=Math.round((e.dt-now)/864e5);return ` · examen <b>${d===0?"aujourd'hui":d===1?"demain":"dans "+d+" j"}</b>`;}
window.setView=v=>{view=v;history.replaceState(null,"",location.pathname+location.search+(v==="gl"?"#glossaire"+(glCourse!=="all"?"/"+encodeURIComponent(glCourse):""):""));window.scrollTo(0,0);draw();};
function draw(){$("vDocs").classList.toggle("on",view==="docs");$("vGl").classList.toggle("on",view==="gl");$("q").placeholder=view==="gl"?"Chercher un terme ou une définition…":"Rechercher…";

 drawDocs();}
function drawDocs(){drawHead();if(!loaded||loadErr){$("subChips").innerHTML="";$("typeChips").innerHTML="";$("out").innerHTML=`<div class="empty">${loadErr?esc(loadErr):"Chargement du cahier…"}</div>`;return;}const q=($("q").value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const nq=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const subs=SUBS();
 $("subChips").innerHTML=[["all","Toutes"],...subs.map(s=>[s,s])].map(([k,l])=>`<button class="chip${fSub===k?" on":""}" data-s="${esc(k)}">${esc(l)}</button>`).join("");
 $("subChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{fSub=b.dataset.s;draw();});
 $("typeChips").innerHTML=[["all","Tout"],["Entraînement","Quiz"],["Notes","Notes & fiches"],["Images","Photos"],["Liens","Liens"]].map(([k,l])=>`<button class="chip${fType===k?" on":""}" data-t="${k}">${l}</button>`).join("");
 $("typeChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{fType=b.dataset.t;draw();});
 const shown=subs.filter(s=>fSub==="all"||s===fSub);let html="",n=0;
 shown.forEach(s=>{
  let its=items.filter(i=>i.subject===s&&(!q||nq(titleOf(i)+" "+i.file).includes(q)));
  if(fType!=="all")its=its.filter(i=>typeOf(i)[2]===fType);
  const imgs=its.filter(i=>typeOf(i)[1]==="img"),docs=its.filter(i=>typeOf(i)[1]!=="img").sort((a,b)=>titleOf(a).localeCompare(titleOf(b),"fr"));
  const links=(fType==="all"||fType==="Liens")?cfg.links.filter(l=>l.subject===s&&(!q||nq(l.title+" "+l.url).includes(q))):[];
  const slots=(fType==="all"&&!q)?cfg.slots.filter(x=>x.subject===s):[];
  if(!docs.length&&!imgs.length&&!links.length&&!slots.length)return;n++;
  html+=`<section class="subj"><div class="sh"><span class="n">${String(n).padStart(2,"0")}</span><h2>${esc(s)}</h2><span class="c">${docs.length+imgs.length+links.length} élément${docs.length+imgs.length+links.length>1?"s":""}${nextExam(s)}</span></div>`;
  html+=docs.map(rowDoc).join("");
  html+=links.map(l=>`<div class="row"><span class="tag">LIEN</span><div class="ti"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a><span class="f">${esc(l.url.replace(/^https?:\/\//,""))}</span></div><div class="act">${admin()?`<button class="ib x" onclick="delLink(${cfg.links.indexOf(l)})">supprimer</button>`:""}</div></div>`).join("");
  html+=slots.map(x=>`<div class="row slot"><span class="tag">À VENIR</span><div class="ti">${esc(x.title)}</div><div class="act">${admin()?`<button class="ib" onclick="openD('fichiers','${esc(s).replace(/&#39;/g,"\\'")}')">déposer</button><button class="ib x" onclick="delSlot(${cfg.slots.indexOf(x)})">retirer</button>`:""}</div></div>`).join("");
  if(imgs.length)html+=`<div class="gal">${imgs.map(i=>`<figure><img loading="lazy" src="${urlOf(i.path)}" alt="${esc(titleOf(i))}" onclick="showImg('${esc(i.path)}')"><figcaption>${esc(titleOf(i))}</figcaption>${admin()?`<button class="ib x" title="Supprimer" onclick="delFile('${esc(i.path)}')">✕</button>`:""}</figure>`).join("")}</div>`;
  html+=`</section>`;});
 $("out").innerHTML=html||`<div class="empty">${items.length||cfg.links.length?"Rien ne correspond à ta recherche.":"Le cahier est vide. Clique sur « Gérer » pour ajouter tes premiers documents."}</div>`;}
function rowDoc(i){const[tag,cls]=typeOf(i),e=ext(i.file),u=urlOf(i.path),abs=new URL(u,location.href).href,p=esc(i.path);
 let main=`<a href="${u}"${e==="html"||e==="htm"?"":' target="_blank" rel="noopener"'}>${esc(titleOf(i))}</a>`;
 if(e==="md"||e==="txt")main=`<button class="lk" onclick="showNote('${p}')">${esc(titleOf(i))}</button>`;
 const acts=[];if(OFFICE.includes(e))acts.push(`<a class="ib" target="_blank" rel="noopener" href="https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(abs)}">aperçu</a>`);
 if(e!=="html"&&e!=="htm")acts.push(`<a class="ib" href="${u}" download>télécharger</a>`);
 if(admin()){acts.push(`<button class="ib" onclick="renameIt('${p}')">renommer</button>`);acts.push(`<button class="ib x" onclick="delFile('${p}')">supprimer</button>`);}
 return `<div class="row"><span class="tag ${cls}">${tag}</span><div class="ti">${main}<span class="f">${esc(i.file)}${i.size?" · "+size(i.size):""}</span></div><div class="act">${acts.join("")}</div></div>`;}

/* glossaire */
const nrm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hl(text,q){const t=esc(text);if(!q)return t;const n=nrm(text);let out="",i=0,k;while((k=n.indexOf(q,i))>=0){out+=esc(text.slice(i,k))+"<mark>"+esc(text.slice(k,k+q.length))+"</mark>";i=k+q.length;}return i?out+esc(text.slice(i)):t;}
function drawGl(){drawHead();const q=nrm($("q").value||"").trim();const courses=Object.keys(GL).sort((a,b)=>a.localeCompare(b,"fr"));
 if(glCourse!=="all"&&!GL[glCourse])glCourse="all";
 $("subChips").innerHTML=[["all","Tous les cours"],...courses.map(c=>[c,c+" ("+GL[c].length+")"])].map(([k,l])=>`<button class="chip${glCourse===k?" on":""}" data-c="${esc(k)}">${esc(l)}</button>`).join("");
 $("subChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{glCourse=b.dataset.c;setView("gl");});
 $("typeChips").innerHTML=[["theme","Par thème"],["az","A à Z"]].map(([k,l])=>`<button class="chip${glMode===k?" on":""}" data-m="${k}">${l}</button>`).join("")+`<button class="chip${glHide?" on":""}" id="ghide">Mode révision : ${glHide?"on":"off"}</button>`;
 $("typeChips").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{glMode=b.dataset.m;drawGl();});$("ghide").onclick=()=>{glHide=!glHide;drawGl();};
 let list=[];(glCourse==="all"?courses:[glCourse]).forEach(c=>GL[c].forEach((e,i)=>list.push({c,i,t:e[0],d:e[1],th:e[2]||"Général"})));
 if(q)list=list.filter(e=>nrm(e.t+" "+e.d).includes(q));
 const showC=glCourse==="all";
 const item=e=>`<div class="gterm${glHide?" hide":""}"><dt>${hl(e.t,q)}<small>${showC?esc(e.c)+" · ":""}${esc(e.th)}</small></dt><dd><span class="def" onclick="this.closest('.gterm').classList.remove('hide')">${hl(e.d,q)}</span></dd><div class="act">${admin()?`<button class="ib" onclick="editTerm('${esc(e.c).replace(/&#39;/g,"\\'")}',${e.i})">modifier</button><button class="ib x" onclick="delTerm('${esc(e.c).replace(/&#39;/g,"\\'")}',${e.i})">supprimer</button>`:""}</div></div>`;
 let h=`<p class="gcount">${list.length} terme${list.length>1?"s":""}${glHide?" · clique sur une case grise pour voir la définition":""}</p>`;
 if(!list.length)h+=`<div class="empty">Aucun terme trouvé.${admin()?" Ajoute-le avec Gérer → Glossaire.":""}</div>`;
 else if(glMode==="az"){list.sort((a,b)=>a.t.localeCompare(b.t,"fr"));const L=[...new Set(list.map(e=>nrm(e.t)[0].toUpperCase()))];
  h+=`<div class="az">${L.map(l=>`<a href="#" onclick="document.getElementById('L-${l}').scrollIntoView({behavior:'smooth'});return false">${l}</a>`).join("")}</div>`;
  L.forEach(l=>{h+=`<div class="letter" id="L-${l}">${l}</div><dl style="margin:0">${list.filter(e=>nrm(e.t)[0].toUpperCase()===l).map(item).join("")}</dl>`;});}
 else{const groups=[];list.forEach(e=>{const k=(showC?e.c+" — ":"")+e.th;let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,e:[]});g.e.push(e);});
  groups.forEach((g,n)=>{h+=`<section class="subj" style="margin-top:30px"><div class="sh"><span class="n">${String(n+1).padStart(2,"0")}</span><h2 style="font-size:1.4rem">${esc(g.k)}</h2><span class="c">${g.e.length}</span></div><dl style="margin:0">${g.e.map(item).join("")}</dl></section>`;});}
 $("out").innerHTML=h;}
window.editTerm=(c,i)=>{const e=GL[c][i];openD("glossaire",c);setTimeout(()=>{$("gtT").value=e[0];$("gtD").value=e[1];$("gtH").value=e[2]||"";$("gtT").dataset.edit=c+"|"+i;log("Modification de « "+e[0]+" »");},30);};
window.delTerm=(c,i)=>{if(!confirm(`Supprimer « ${GL[c][i][0]} » du glossaire?`))return;GL[c].splice(i,1);if(!GL[c].length)delete GL[c];saveGl("Glossaire : suppression").then(draw).catch(e=>alert("Erreur : "+e.message));draw();};
window.saveTerm=async()=>{const sel=$("gtC").value,c=(sel==="__new"?$("gtCN").value:sel).trim(),t=$("gtT").value.trim(),d=$("gtD").value.trim(),th=$("gtH").value.trim()||"Général";
 if(!c||!t||!d){log("Il faut un cours, un terme et une définition.");return;}
 const ed=$("gtT").dataset.edit;GL[c]=GL[c]||[];
 if(ed){const[oc,oi]=ed.split("|");if(oc===c)GL[c][+oi]=[t,d,th];else{GL[oc].splice(+oi,1);if(!GL[oc].length)delete GL[oc];GL[c].push([t,d,th]);}}
 else{const k=GL[c].findIndex(x=>nrm(x[0])===nrm(t));if(k>=0)GL[c][k]=[t,d,th];else GL[c].push([t,d,th]);}
 log("Enregistrement…");try{await saveGl("Glossaire : "+t);dSub=c;glCourse=c;log("✓ « "+t+" » enregistré.");$("gtT").value="";$("gtD").value="";delete $("gtT").dataset.edit;draw();}catch(e){log("Erreur : "+e.message);}};
/* visionneuse */
function closeV(){$("view").classList.remove("on");$("vbody").innerHTML="";}
window.showImg=p=>{$("vbody").innerHTML=`<img src="${urlOf(p)}" alt="">`;$("view").classList.add("on");};
function md(t){const L=esc(t).split("\n");let o="",list=null;const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 const close=()=>{if(list){o+=`</${list}>`;list=null;}};
 for(const l of L){let m;if(m=l.match(/^(#{1,3})\s+(.*)/)){close();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;}
  else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=="ul"){close();o+="<ul>";list="ul";}o+=`<li>${inl(m[1])}</li>`;}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();o+="<ol>";list="ol";}o+=`<li>${inl(m[1])}</li>`;}
  else if(!l.trim())close();else{close();o+=`<p>${inl(l)}</p>`;}}
 close();return o;}
window.showNote=async p=>{$("vbody").innerHTML=`<div class="paperv">Chargement…</div>`;$("view").classList.add("on");
 try{const t=await(await fetch(urlOf(p)+"?"+Date.now())).text();$("vbody").innerHTML=`<div class="paperv">${/\.md$/i.test(p)?md(t):`<pre style="white-space:pre-wrap;font-family:inherit">${esc(t)}</pre>`}</div>`;}
 catch(e){$("vbody").innerHTML=`<div class="paperv">Impossible d'ouvrir la note.</div>`;}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeV();closeD();}});

/* gestion */
let dTab="fichiers",dSub="";
window.openD=(tab,sub)=>{if(tab)dTab=tab;if(sub!==undefined)dSub=sub;$("drawer").classList.add("on");$("veil").classList.add("on");renderD();};
window.closeD=()=>{$("drawer").classList.remove("on");$("veil").classList.remove("on");};
function subSelect(id){const s=SUBS();return `<select class="in" id="${id}">${s.map(x=>`<option${x===dSub?" selected":""}>${esc(x)}</option>`).join("")}<option value="__new"${!s.length?" selected":""}>+ Nouvelle matière…</option></select><input class="in" id="${id}N" placeholder="Nom de la nouvelle matière" style="margin-top:6px;${s.length?"display:none":""}">`;}
function bindSub(id){const s=$(id),n=$(id+"N");s.onchange=()=>{n.style.display=s.value==="__new"?"block":"none";dSub=s.value;if(s.value==="__new")n.focus();};}
function getSub(id){const v=$(id).value;return(v==="__new"?$(id+"N").value:v).trim().replace(/[\\/]+/g,"-");}
function renderD(){const b=$("dbody");
 if(!admin()){b.innerHTML=`<div class="db"><p>Connecte-toi avec ta clé GitHub pour ajouter, renommer ou supprimer des documents.</p><label class="l">Clé GitHub</label><input class="in" id="tok" type="password" placeholder="ghp_…" autocomplete="off"><p class="hint">La clé reste seulement dans ce navigateur. Les visiteurs ne voient jamais ce panneau.</p><div style="margin-top:14px"><button class="btn fill" onclick="login()">Connexion</button></div><div class="log" id="lg"></div></div>`;return;}
 const T=[["fichiers","Fichiers"],["note","Note"],["lien","Lien"],["glossaire","Glossaire"],["examens","Examens"],["slots","Réservés"],["reglages","Réglages"]];
 let h=`<div class="tabs">${T.map(([k,l])=>`<button class="tab${dTab===k?" on":""}" onclick="dTab='${k}';renderD()">${l}</button>`).join("")}</div><div class="db">`;
 if(dTab==="fichiers")h+=`<label class="l">Matière</label>${subSelect("fs")}<div class="drop" id="drop"><b>Glisse tes fichiers ici</b><br>ou clique pour les choisir<br><span class="hint">Quiz (.html), PDF, photos de notes, Word, PowerPoint, Excel, .md, .txt</span></div><input type="file" id="fi" multiple hidden><div class="log" id="lg"></div>`;
 if(dTab==="note")h+=`<label class="l">Matière</label>${subSelect("ns")}<label class="l">Titre</label><input class="in" id="nt" placeholder="Ex. Résumé chapitre 3"><label class="l">Contenu</label><textarea class="in" id="nc" placeholder="# Titre&#10;- point important&#10;**gras**, *italique*"></textarea><p class="hint">Mise en forme simple : # titre, - liste, **gras**, *italique*, [lien](https://…)</p><div style="margin-top:12px"><button class="btn fill" onclick="saveNote()">Publier la note</button></div><div class="log" id="lg"></div>`;
 if(dTab==="lien")h+=`<label class="l">Matière</label>${subSelect("ls")}<label class="l">Titre</label><input class="in" id="lt" placeholder="Ex. Vidéo sur le PIB"><label class="l">Adresse (URL)</label><input class="in" id="lu" placeholder="https://…"><div style="margin-top:12px"><button class="btn fill" onclick="addLink()">Ajouter le lien</button></div><div class="log" id="lg"></div>`;
 if(dTab==="glossaire"){const cs=Object.keys(GL).sort((a,b)=>a.localeCompare(b,"fr"));const cur=(view==="gl"&&GL[glCourse])?glCourse:(GL[dSub]?dSub:(cs[0]||""));
  h+=`<label class="l">Cours</label><select class="in" id="gtC">${cs.map(c=>`<option${c===cur?" selected":""}>${esc(c)}</option>`).join("")}<option value="__new">+ Nouveau cours…</option></select><input class="in" id="gtCN" placeholder="Nom du cours" style="margin-top:6px;display:none">
  <label class="l">Terme</label><input class="in" id="gtT" placeholder="Ex. Paraphrase"><label class="l">Définition</label><textarea class="in" id="gtD" style="min-height:110px;font-family:inherit;font-size:14px" placeholder="Définition claire, en une ou deux phrases"></textarea>
  <label class="l">Thème</label><input class="in" id="gtH" list="gtHL" placeholder="Ex. Citer"><datalist id="gtHL">${[...new Set((GL[cur]||[]).map(e=>e[2]))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
  <div style="margin-top:12px"><button class="btn fill" onclick="saveTerm()">Enregistrer le terme</button></div><div class="log" id="lg"></div>
  <p class="hint" style="margin-top:18px">Pour modifier ou supprimer un terme existant, va dans l'onglet Glossaire du site : les boutons apparaissent à côté de chaque terme.</p>`;}
 if(dTab==="examens"){h+=`<label class="l">Matière</label>${subSelect("es")}<label class="l">Quoi</label><input class="in" id="et" placeholder="Ex. Examen final"><label class="l">Date</label><input class="in" id="ed" type="date"><div style="margin-top:12px"><button class="btn fill" onclick="addExam()">Ajouter</button></div><div class="log" id="lg"></div><label class="l" style="margin-top:22px">Examens enregistrés</label>`+
  (cfg.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="li"><span>${esc(e.subject)} — ${esc(e.title)} <small>${esc(e.date)}</small></span><button class="ib x" onclick="delExam(${cfg.exams.indexOf(e)})">supprimer</button></div>`).join("")||'<p class="hint">Aucun.</p>');}
 if(dTab==="slots"){h+=`<p class="hint">Un emplacement réservé montre aux visiteurs qu'un document s'en vient.</p><label class="l">Matière</label>${subSelect("ss")}<label class="l">Titre</label><input class="in" id="st" placeholder="Ex. Quiz chapitres 4-5"><div style="margin-top:12px"><button class="btn fill" onclick="addSlot()">Réserver</button></div><div class="log" id="lg"></div><label class="l" style="margin-top:22px">Emplacements</label>`+
  (cfg.slots.map((x,i)=>`<div class="li"><span>${esc(x.subject)} — ${esc(x.title)}</span><button class="ib x" onclick="delSlot(${i})">retirer</button></div>`).join("")||'<p class="hint">Aucun.</p>');}
 if(dTab==="reglages")h+=`<label class="l">Titre du site</label><input class="in" id="gt" value="${esc(cfg.title||"Cahier de révision")}"><label class="l">Sous-titre</label><input class="in" id="gs" value="${esc(cfg.subtitle||"Quiz, notes et fiches pour réussir la session.")}"><div style="margin-top:12px"><button class="btn fill" onclick="saveSettings()">Enregistrer</button></div><div class="log" id="lg"></div><label class="l" style="margin-top:26px">Compte</label><button class="btn red" onclick="logout()">Déconnexion</button>`;
 b.innerHTML=h+`</div>`;
 ["fs","ns","ls","es","ss"].forEach(id=>{if($(id))bindSub(id);});
 if($("gtC")){$("gtC").onchange=()=>{$("gtCN").style.display=$("gtC").value==="__new"?"block":"none";if($("gtC").value!=="__new"){dSub=$("gtC").value;}};}
 if($("drop")){const d=$("drop"),fi=$("fi");d.onclick=()=>fi.click();fi.onchange=()=>upload([...fi.files]);d.ondragover=e=>{e.preventDefault();d.classList.add("on");};d.ondragleave=()=>d.classList.remove("on");d.ondrop=e=>{e.preventDefault();d.classList.remove("on");upload([...e.dataTransfer.files]);};}}
const log=t=>{if($("lg"))$("lg").textContent=t;};
window.login=async()=>{TOKEN=$("tok").value.trim();log("Vérification…");
 try{const i=await gh("GET","");if(!i.permissions||!i.permissions.push)throw new Error("cette clé ne peut pas modifier ce dépôt");try{localStorage.setItem("gh_token",TOKEN);}catch(e){}await Promise.all([loadCfg(),loadGl()]);renderD();draw();}
 catch(e){TOKEN=null;log("Erreur : "+e.message);}};
window.logout=()=>{TOKEN=null;try{localStorage.removeItem("gh_token");}catch(e){}renderD();draw();};
async function putFile(path,content,msg){const old=items.find(i=>i.path===path);const body={message:msg,content};if(old)body.sha=old.sha;
 const r=await gh("PUT","/contents/"+apiPath(path),body);return r.content;}
async function upload(files){const subject=getSub("fs");if(!subject){log("Choisis ou nomme une matière.");return;}dSub=subject;const out=[];
 for(const f of files){if(f.size>25*1048576){out.push(`✕ ${f.name} : trop gros (max 25 Mo)`);log(out.join("\n"));continue;}
  const name=slug(f.name)||"fichier";const path=`quiz/${subject}/${name}`;out.push(`… ${f.name}`);log(out.join("\n"));
  try{const c=await putFile(path,await b64file(f),"Ajout "+path);const it={path,sha:c.sha,size:f.size,file:name,subject,title:pretty(name)};
   if(/\.html?$/i.test(name)){const m=(await f.text()).match(/<title>([^<]*)<\/title>/i);if(m&&m[1].trim())it.title=m[1].trim();}
   items=items.filter(i=>i.path!==path).concat(it);out[out.length-1]=`✓ ${f.name}`;}
  catch(e){out[out.length-1]=`✕ ${f.name} : ${e.message}`;}
  log(out.join("\n"));draw();}
 const slotI=cfg.slots.findIndex(x=>x.subject===subject);
 log(out.join("\n")+"\n\nEn ligne dans environ 1 minute."+(slotI>=0?"\nTu peux retirer l'emplacement réservé dans l'onglet « Réservés ».":""));}
window.saveNote=async()=>{const subject=getSub("ns"),t=$("nt").value.trim(),c=$("nc").value;if(!subject||!t||!c.trim()){log("Il faut une matière, un titre et du contenu.");return;}
 const name=slug(t)+".md",path=`quiz/${subject}/${name}`,txt=c.trim().startsWith("#")?c:`# ${t}\n\n${c}`;log("Publication…");
 try{const r=await putFile(path,b64txt(txt),"Note "+path);items=items.filter(i=>i.path!==path).concat({path,sha:r.sha,size:new Blob([txt]).size,file:name,subject,title:t});dSub=subject;draw();log("✓ Note publiée.");$("nc").value="";$("nt").value="";}
 catch(e){log("Erreur : "+e.message);}};
async function cfgDo(fn,msg){try{fn();await saveCfg(msg);draw();renderD();log("✓ Enregistré.");}catch(e){log("Erreur : "+e.message);}}
window.addLink=()=>{const subject=getSub("ls"),title=$("lt").value.trim();let url=$("lu").value.trim();if(!subject||!title||!url){log("Il faut une matière, un titre et une adresse.");return;}if(!/^https?:\/\//i.test(url))url="https://"+url;dSub=subject;cfgDo(()=>cfg.links.push({subject,title,url}),"Lien ajouté");};
window.delLink=i=>{if(confirm("Supprimer ce lien?"))cfgDo(()=>cfg.links.splice(i,1),"Lien supprimé");};
window.addExam=()=>{const subject=getSub("es"),title=$("et").value.trim()||"Examen",date=$("ed").value;if(!subject||!date){log("Il faut une matière et une date.");return;}dSub=subject;cfgDo(()=>cfg.exams.push({subject,title,date}),"Examen ajouté");};
window.delExam=i=>cfgDo(()=>cfg.exams.splice(i,1),"Examen supprimé");
window.addSlot=()=>{const subject=getSub("ss"),title=$("st").value.trim();if(!subject||!title){log("Il faut une matière et un titre.");return;}dSub=subject;cfgDo(()=>cfg.slots.push({subject,title}),"Emplacement réservé");};
window.delSlot=i=>cfgDo(()=>cfg.slots.splice(i,1),"Emplacement retiré");
window.saveSettings=()=>cfgDo(()=>{cfg.title=$("gt").value.trim();cfg.subtitle=$("gs").value.trim();},"Réglages");
window.renameIt=p=>{const it=items.find(i=>i.path===p);const t=prompt("Nouveau titre affiché :",titleOf(it));if(t===null)return;cfgDo(()=>{if(t.trim())cfg.titles[p]=t.trim();else delete cfg.titles[p];},"Titre modifié");};
window.delFile=async p=>{const it=items.find(i=>i.path===p);if(!it||!confirm(`Supprimer « ${titleOf(it)} » ? C'est définitif.`))return;
 try{await gh("DELETE","/contents/"+apiPath(p),{message:"Suppression "+p,sha:it.sha});items=items.filter(i=>i.path!==p);if(cfg.titles[p]){delete cfg.titles[p];saveCfg("Nettoyage").catch(()=>{});}draw();}
 catch(e){alert("Erreur : "+e.message);}};
window.addEventListener("hashchange",()=>{const g=location.hash.startsWith("#glossaire");if(g!==(view==="gl")){view=g?"gl":"docs";draw();}});
draw();load();
</script></body></html>
