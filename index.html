<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahier de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3efe6;--sheet:#fbf9f4;--ink:#1c1b19;--soft:#6e6a62;--rule:#d9d3c5;--red:#c23a22;--hl:#f6e27a}
@media(prefers-color-scheme:dark){:root{--paper:#161513;--sheet:#1e1d1a;--ink:#ece8de;--soft:#9b968b;--rule:#34312b;--red:#e2614a;--hl:#6b5b14}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:980px;margin:0 auto;padding:40px 22px 80px}
/* entête */
.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:18px}
.top h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1;margin:0;letter-spacing:-.015em}
.top p{margin:8px 0 0;color:var(--soft)}
.meta{font-size:12px;color:var(--soft);text-align:right;line-height:1.7}
.btn{border:1px solid var(--ink);background:transparent;padding:7px 12px;border-radius:2px;font-size:13px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.red{border-color:var(--red);color:var(--red)}.btn.red:hover{background:var(--red);color:#fff}
.btn.fill{background:var(--ink);color:var(--paper)}.btn.fill:hover{background:var(--red);border-color:var(--red)}
/* examens */
.exams{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin:0 -2px}
.ex{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:14px 22px 14px 2px;border-right:1px dashed var(--rule);margin-right:20px;align-items:center}
.ex:last-child{border-right:0}
.ex .d{grid-row:span 2;font-family:Newsreader,serif;font-size:2.1rem;line-height:1;text-align:center;min-width:44px}
.ex .d small{display:block;font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--soft)}
.ex .t{font-weight:600;font-size:14px}.ex .s{font-size:12px;color:var(--soft)}
.ex .s b{color:var(--red);font-weight:600}
/* outils */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 8px}
.search{flex:1 1 240px;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 2px;font:inherit;color:var(--ink);outline:none}
.search::placeholder{color:var(--soft)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1px solid var(--rule);background:transparent;padding:3px 10px;border-radius:2px;font:500 12px "IBM Plex Mono",monospace;color:var(--soft)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* matières */
.subj{margin-top:42px}
.sh{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px}
.sh .n{font:500 13px "IBM Plex Mono",monospace;color:var(--red)}
.sh h2{font-family:Newsreader,serif;font-weight:400;font-size:1.75rem;margin:0;line-height:1.1}
.sh .c{font-size:12px;color:var(--soft)}
.sh .c b{color:var(--red);font-weight:600}
.row{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--rule)}
.row:hover{background:var(--sheet)}
.tag{white-space:nowrap;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.04em;border:1px solid currentColor;padding:2px 6px;text-align:center;border-radius:2px;color:var(--soft)}
.tag.quiz{color:var(--red)}.tag.fiche,.tag.note{color:var(--ink)}
.ti{min-width:0}
.ti a,.ti button.lk{font-weight:500;text-decoration:none;background:none;border:0;padding:0;text-align:left;font-size:15px}
.ti a:hover,.ti button.lk:hover{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.ti .f{display:block;font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;gap:6px;align-items:center}
.ib{border:0;background:none;padding:4px 6px;font-size:12px;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.ib:hover{color:var(--ink)}.ib.x:hover{color:var(--red)}
.slot .ti{color:var(--soft);font-style:italic}
.gal{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule)}
.gal figure{margin:0;width:118px;position:relative}
.gal img{width:118px;height:88px;object-fit:cover;border:1px solid var(--rule);display:block;cursor:zoom-in;background:var(--sheet)}
.gal figcaption{font-size:11px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal .ib{position:absolute;top:2px;right:2px;background:var(--sheet);text-decoration:none}
.empty{padding:40px 0;color:var(--soft);font-style:italic;text-align:center}
footer{margin-top:60px;font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* tiroir de gestion */
.veil{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--sheet);border-left:2px solid var(--ink);transform:translateX(100%);transition:.25s ease;z-index:21;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--rule)}
.dh h3{font-family:Newsreader,serif;font-weight:400;font-size:1.5rem;margin:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:0 14px}
.tab{border:0;background:none;padding:10px 8px;font:500 12px "IBM Plex Mono",monospace;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--red)}
.db{padding:18px 20px;overflow-y:auto;flex:1}
label.l{display:block;font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin:14px 0 4px}
.in{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;font:inherit;border-radius:2px}
.in:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea.in{min-height:220px;font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.55}
.drop{margin-top:14px;border:1.5px dashed var(--soft);padding:28px 14px;text-align:center;color:var(--soft);cursor:pointer}
.drop.on,.drop:hover{border-color:var(--red);color:var(--ink);background:var(--paper)}
.drop b{color:var(--ink)}
.log{font-size:13px;color:var(--soft);margin-top:12px;white-space:pre-line}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.li span small{color:var(--soft)}
.hint{font-size:13px;color:var(--soft);margin:6px 0 0}
/* visionneuse */
.view{position:fixed;inset:0;z-index:30;background:#000c;display:none;align-items:center;justify-content:center;padding:20px}
.view.on{display:flex}
.view img{max-width:100%;max-height:88vh;border:1px solid #fff3}
.paperv{background:var(--sheet);color:var(--ink);max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:30px 34px;border:1px solid var(--rule)}
.paperv h1,.paperv h2,.paperv h3{font-family:Newsreader,serif;font-weight:600;line-height:1.2}
.paperv code{background:var(--paper);padding:1px 4px}
.vx{position:fixed;top:14px;right:18px;color:#fff;background:none;border:1px solid #fff8;padding:5px 11px;font-size:13px;z-index:31}
.views{display:flex;gap:22px;margin:18px 0 0;border-bottom:1px solid var(--rule)}
.vw{border:0;background:none;padding:6px 0 9px;font:500 13px "IBM Plex Mono",monospace;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.06em}
.vw.on{color:var(--ink);border-color:var(--red)}
.gterm{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;gap:16px;padding:11px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
.gterm dt{font-family:Newsreader,serif;font-size:1.12rem;font-weight:600;line-height:1.25}
.gterm dt small{display:block;font:400 11px "IBM Plex Mono",monospace;color:var(--soft);margin-top:2px}
.gterm dd{margin:0}
.gterm.hide dd .def{background:var(--rule);color:transparent;border-radius:2px;cursor:pointer;user-select:none}
.gterm.hide dd .def:hover{background:var(--soft)}
.gterm mark{background:var(--hl);color:inherit;padding:0 1px}
.letter{font-family:Newsreader,serif;font-size:1.6rem;color:var(--red);margin:26px 0 2px;border-bottom:1px solid var(--ink)}
.az{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0}
.az a{font:500 12px "IBM Plex Mono",monospace;color:var(--soft);text-decoration:none;padding:2px 6px;border:1px solid transparent}
.az a:hover{border-color:var(--ink);color:var(--ink)}
.gcount{font-size:12px;color:var(--soft);margin:10px 0 0}
@media(max-width:620px){.gterm{grid-template-columns:1fr;gap:4px}
.wrap{padding:26px 16px 70px}.top{grid-template-columns:1fr}.meta{text-align:left}
 .row{grid-template-columns:66px 1fr;gap:10px}.tag{font-size:10px;padding:2px 4px}.act{grid-column:2;justify-content:flex-start;margin-top:-6px}.gterm .act{grid-column:auto;margin-top:0}}
.cdset{background:var(--sheet);border:1px solid var(--rule);padding:18px 20px;margin-top:14px}
.cdset h2{font:600 1.35rem Newsreader,serif;margin:0 0 4px}
.cdset p{margin:4px 0 12px;color:var(--soft);font-size:14px}
.cdrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.cdrow b{font-family:Newsreader,serif;font-size:1.08rem;font-weight:600}.cdrow small{display:block;font:400 11.5px "IBM Plex Mono",monospace;color:var(--soft)}
.cdrow .n{font:500 12px "IBM Plex Mono",monospace;color:var(--soft)}
.cdrev{font:500 11px "IBM Plex Mono",monospace;color:var(--red)}
.fcw{max-width:640px;margin:18px auto 0}
.fcbar{display:flex;justify-content:space-between;font:500 12px "IBM Plex Mono",monospace;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.fcprog{height:3px;background:var(--rule);margin:8px 0 16px}.fcprog div{height:100%;background:var(--red);transition:width .3s}
.fc{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc-in{display:grid;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);min-height:280px;padding:26px 26px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.face.back{transform:rotateY(180deg);border-top-color:var(--red)}
.face .k{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:auto;text-align:left}
.face .w{font:600 clamp(1.5rem,4.5vw,2.1rem)/1.2 Newsreader,serif;margin:18px 0}
.face .d{font-size:1.08rem;line-height:1.55;margin:18px 0;text-align:left}
.face .h{font:400 12px "IBM Plex Mono",monospace;color:var(--soft);margin-top:auto}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fcbtns .btn{padding:13px;font-size:15px;text-align:center;justify-content:center}
.fcbtns .no{border-color:var(--red);color:var(--red)}.fcbtns .no:hover{background:var(--red);color:#fff}
.fcbtns .one{grid-column:1/-1}
.fckeys{text-align:center;font:400 11.5px "IBM Plex Mono",monospace;color:var(--soft);margin-top:10px}
.fcend{text-align:center;background:var(--sheet);border:1px solid var(--rule);padding:28px 20px}
.fcend .big{font:600 2.6rem Newsreader,serif;margin:4px 0}
.fcend ul{text-align:left;max-width:520px;margin:14px auto;padding-left:18px;font-size:14px}
@media(max-width:620px){.cdrow{grid-template-columns:1fr auto}.cdrow .n{display:none}.face{min-height:240px;padding:20px 18px}}
@media(prefers-reduced-motion:reduce){.fc-in{transition:none}}
.news{border:1px solid var(--rule);border-left:3px solid var(--red);background:var(--sheet);margin:16px 0 0;padding:12px 16px}
.news .nh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.news .nk{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.news .ns{font-size:13px;color:var(--soft);flex:1;min-width:150px}
.news .nb{display:flex;gap:6px;flex-wrap:wrap}
.news .nb .btn{padding:5px 10px;font-size:12.5px}
.news ul{list-style:none;margin:10px 0 2px;padding:0}
.news li{display:grid;grid-template-columns:62px 78px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px;align-items:baseline}
.news li .dt{font:500 12px "IBM Plex Mono",monospace;color:var(--soft)}
.news li .ty{font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);padding:1px 6px;text-align:center;color:var(--soft)}
.news li .ty.quiz{color:var(--red);border-color:var(--red)}.news li .ty.fonction{color:var(--ink);border-color:var(--ink)}
.news li .nw{font:600 10px "IBM Plex Mono",monospace;background:var(--red);color:#fff;padding:1px 5px;margin-left:6px;letter-spacing:.06em;vertical-align:1px}
@media(max-width:620px){.news li{grid-template-columns:auto 1fr;gap:4px 10px}.news li .ty{justify-self:start}.news li .tx{grid-column:1/-1}}
@media print{.tools,.chips,footer,.act,.btn{display:none!important}}
</style></head><body>
<div class="wrap">
 <header class="top"><div><h1 id="ttl">Cahier de révision</h1><p id="stl">Quiz, notes et fiches pour réussir la session.</p></div>
  <div class="meta"><div id="cnt" class="mono"></div><button class="btn" id="admBtn" onclick="openD()">Gérer</button></div></header>
 <div class="news" id="news" style="display:none"></div>
 <nav class="views"><button class="vw" id="vDocs" onclick="setView('docs')">Documents</button><button class="vw" id="vGl" onclick="setView('gl')">Glossaire</button><button class="vw" id="vCd" onclick="setView('cards')">Cartes mémoire</button></nav>
 <div class="exams" id="exams"></div>
 <div class="tools"><input class="search" id="q" placeholder="Rechercher…" oninput="draw()"></div>
 <div class="chips" id="subChips"></div>
 <div class="chips" id="typeChips"></div>
 <main id="out"><div class="empty">Chargement du cahier…</div></main>
 <footer><span>Ouvre un quiz : tout roule dans ton navigateur.</span><span class="mono" id="foot"></span></footer>
</div>
<div class="veil" id="veil" onclick="closeD()"></div>
<aside class="drawer" id="drawer"><div class="dh"><h3>Gérer le cahier</h3><button class="btn" onclick="closeD()">Fermer</button></div><div id="dbody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></aside>
<div class="view" id="view" onclick="if(event.target===this)closeV()"><button class="vx" onclick="closeV()">Fermer ✕</button><div id="vbody" style="display:contents"></div></div>
<script>
"use strict";
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const TYPES={html:["QUIZ","quiz","Entraînement"],pdf:["PDF","doc","Notes"],png:["IMAGE","img","Images"],jpg:["IMAGE","img","Images"],jpeg:["IMAGE","img","Images"],webp:["IMAGE","img","Images"],gif:["IMAGE","img","Images"],heic:["IMAGE","img","Images"],
 doc:["WORD","doc","Notes"],docx:["WORD","doc","Notes"],ppt:["PPT","doc","Notes"],pptx:["PPT","doc","Notes"],xls:["EXCEL","doc","Notes"],xlsx:["EXCEL","doc","Notes"],md:["NOTE","note","Notes"],txt:["NOTE","note","Notes"]};
const OFFICE=["doc","docx","ppt","pptx","xls","xlsx"];
const ext=f=>(f.split(".").pop()||"").toLowerCase();
function typeOf(it){const e=ext(it.file);let t=TYPES[e]||["FICHIER","doc","Notes"];if(e==="html"&&/fiche|feuille|resume|résumé/i.test(it.file+it.title))t=["FICHE","fiche","Notes"];if(e==="htm")t=TYPES.html;return t;}
const pretty=f=>f.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim().replace(/^./,c=>c.toUpperCase());
const size=b=>b==null?"":b<1024?b+" o":b<1048576?(b/1024).toFixed(0)+" Ko":(b/1048576).toFixed(1).replace(".",",")+" Mo";
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
const b64txt=s=>btoa(unescape(encodeURIComponent(s)));
const b64file=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(f);});
const apiPath=p=>p.split("/").map(encodeURIComponent).join("/");
const urlOf=p=>p.split("/").map(encodeURIComponent).join("/");

/* dépôt GitHub */
function repo(){const qs=new URLSearchParams(location.search).get("repo");if(qs&&qs.includes("/")){const[a,b]=qs.split("/");return{user:a,name:b};}
 const h=location.hostname,p=location.pathname.split("/").filter(Boolean);if(!h.endsWith(".github.io"))return null;
 return{user:h.split(".")[0],name:(p[0]&&!/\.html?$/.test(p[0]))?p[0]:h};}
let TOKEN=null;try{TOKEN=localStorage.getItem("gh_token");}catch(e){}
if(location.hash.startsWith("#t=")){TOKEN=decodeURIComponent(location.hash.slice(3));try{localStorage.setItem("gh_token",TOKEN);}catch(e){}try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
const admin=()=>!!TOKEN;
async function gh(method,path,body){const r=repo();const h={Accept:"application/vnd.github+json"};if(TOKEN)h.Authorization="Bearer "+TOKEN;if(body)h["Content-Type"]="application/json";
 const res=await fetch(`https://api.github.com/repos/${r.user}/${r.name}${path}`,{method,headers:h,body:body?JSON.stringify(body):undefined});
 if(!res.ok){const j=await res.json().catch(()=>({}));const e=new Error(j.message||("Erreur "+res.status));e.status=res.status;throw e;}
 return res.status===204?null:res.json();}

es.","Ch. 7 — Ressources humaines"],["Service des ressources humaines","Unité administrative qui n'existe que dans les entreprises de grande taille.","Ch. 7 — Ressources humaines"],["Gestion autoritaire","Façon de gérer les employés entre 1900 et 1940 : on fait ce qu'on nous dit, sinon on perd sa job.","Ch. 7 — Ressources humaines"],["Gestion intégrée","Façon de gérer les ressources humaines entre 1940 et 1980.","Ch. 7 — Ressources humaines"],["4 tendances en GRH","1) Main-d'œuvre flexible et spécialisée · 2) emplois qui coûtent vs emplois qui rapportent · 3) gestion à court terme et sous-traitance · 4) déclin de la population active.","Ch. 7 — Ressources humaines"],["Emplois qui rapportent","Petit nombre de postes clés (règle 80/20) vus comme un investissement : sélection poussée et avantages.","Ch. 7 — Ressources humaines"],["Emplois qui coûtent","La majorité des postes, soumis aux lois de la concurrence.","Ch. 7 — Ressources humaines"],["Emploi atypique","Emploi qui n'est pas à temps plein (temps partiel, contrat…).","Ch. 7 — Ressources humaines"],["Dotation","Tâche des RH qui consiste à combler les postes en 6 étapes : besoins, recrutement, sélection, choix final, accueil, évaluation du processus.","Ch. 7 — Ressources humaines"],["Description de poste","Document qui précise les tâches (savoir-faire), les exigences de formation et d'expérience (savoir) et les compétences et aptitudes (savoir-être) d'un poste.","Ch. 7 — Ressources humaines"],["Recrutement","Étape 2 de la dotation : attirer des candidats (employés actuels, candidatures non sollicitées ou recommandées, agences, écoles, associations).","Ch. 7 — Ressources humaines"],["Sélection","Étape 3 de la dotation : choisir les meilleurs candidats selon des critères objectifs et subjectifs (CV, entrevues, tests, antécédents, période d'essai).","Ch. 7 — Ressources humaines"],["Curriculum vitæ (CV)","Document de présentation d'un candidat qui indique sa formation, ses expériences professionnelles et autres réalisations pertinentes.","Ch. 7 — Ressources humaines"],["Grille de sélection","Outil essentiel de l'entrevue qui permet d'éviter l'effet halo.","Ch. 7 — Ressources humaines"],["Effet halo","Jugement erroné, favorable ou défavorable, porté sur un candidat, souvent à partir d'un élément frappant.","Ch. 7 — Ressources humaines"],["Entrevue de sélection","Entretien qui évalue dans quelle mesure les caractéristiques du candidat satisfont aux exigences d'un poste donné.","Ch. 7 — Ressources humaines"],["Accueil du nouvel employé","Étape 5 de la dotation, déterminante pour la réussite de l'employé : programme d'accueil, documentation, parrainage.","Ch. 7 — Ressources humaines"],["Formation","Processus permettant à une personne d'acquérir les habiletés et les compétences nécessaires à une tâche.","Ch. 7 — Ressources humaines"],["6 modes de formation","Dans l'entreprise, générale, non structurée, continue, stages, sur mesure.","Ch. 7 — Ressources humaines"],["Évaluation du rendement","Faite 1 fois par année par le supérieur immédiat; porte sur le rendement (pas la personnalité) et est orientée vers l'avenir.","Ch. 7 — Ressources humaines"],["Discipline préventive","Informer les employés des comportements inacceptables, des normes et des sanctions pour qu'ils s'autodisciplinent.","Ch. 7 — Ressources humaines"],["Discipline punitive","Appliquer une sanction (ex. suspension sans salaire) pour pousser l'employé à changer ou à partir.","Ch. 7 — Ressources humaines"],["Discipline non punitive (responsable)","Aider l'employé à trouver des solutions à ses problèmes et à se responsabiliser.","Ch. 7 — Ressources humaines"],["Rémunération","Montant d'argent (salaire) et avantages divers accordés à un employé en contrepartie d'un travail ou de la prestation d'un service.","Ch. 7 — Ressources humaines"],["Intéressement","Rémunération incitative : participation des employés aux bénéfices.","Ch. 7 — Ressources humaines"],["Avantages sociaux","Éléments de la rémunération dont bénéficie le salar ées · marché des valeurs mobilières · programmes gouvernementaux (subventions).","Ch. 9 — Gestion financière"],["Crédit fournisseur","Le fournisseur laisse l'entreprise payer plus tard : il lui fait crédit.","Ch. 9 — Gestion financière"],["Action","Titre qui donne la propriété d'une partie du capital, avec le droit d'intervenir dans la gestion et de recevoir un dividende.","Ch. 9 — Gestion financière"],["Dividende","Partie du bénéfice distribuée aux actionnaires en proportion de leurs actions.","Ch. 9 — Gestion financière"],["Courtier","Personne qui a un permis pour acheter des actions; intermédiaire sur le marché primaire.","Ch. 9 — Gestion financière"]],"Économie":[["Science économique","Étude de la façon dont les individus et les sociétés utilisent des ressources limitées pour satisfaire leurs besoins.","Bases"],["Rareté","Problème économique de base : les ressources sont limitées alors que les besoins sont illimités, ce qui oblige à faire des choix.","Bases"],["Coût de renonciation","Valeur de la meilleure option à laquelle on renonce quand on prend une décision (aussi appelé coût d'option).","Bases"],["Microéconomie","Branche de l'économie qui étudie les choix des individus et des entreprises.","Bases"],["Macroéconomie","Branche de l'économie qui étudie l'économie dans son ensemble : production globale, inflation, chômage.","Bases"],["Externalité négative","Effet négatif de l'activité d'un agent (production ou consommation) sur le bien-être d'autres personnes, sans compensation. Ex. : la pollution.","Bases"],["Internalisation","Fait de faire payer le coût d'une externalité à celui qui la cause (principe du pollueur-payeur).","Bases"],["Économie linéaire","Modèle « extraire, produire, jeter ».","Bases"],["Économie circulaire","Modèle qui réduit le gaspillage en concevant des produits réutilisables, réparables, recyclables ou biodégradables.","Bases"],["Courbe des possibilités de production (CPP)","Courbe qui montre toutes les combinaisons maximales de deux biens qu'une économie peut produire avec ses ressources. Un point à l'intérieur = ressources sous-utilisées; à l'extérieur = impossible.","Bases"],["Croissance (sur la CPP)","Déplacement de la courbe des possibilités de production vers l'extérieur.","Bases"],["Marché","Lieu, réel ou virtuel, qui réunit des acheteurs (demandeurs) et des vendeurs (offreurs) pour échanger.","Marché"],["Demande","Quantités d'un bien que les consommateurs veulent acheter à différents prix.","Marché"],["Quantité demandée","Quantité précise associée à un prix précis. Elle varie quand le prix du bien lui-même change (on glisse sur la courbe).","Marché"],["Offre","Quantités d'un bien que les producteurs veulent et peuvent vendre à différents prix.","Marché"],["Ceteris paribus","« Toutes choses étant égales par ailleurs » : on change un seul facteur à la fois pour en mesurer l'effet.","Marché"],["Prix d'équilibre","Prix auquel la quantité offerte est égale à la quantité demandée.","Marché"],["Biens substituts","Biens qui peuvent se remplacer l'un l'autre (café et thé).","Marché"],["Biens complémentaires","Biens consommés ensemble (auto et essence).","Marché"],["Bien normal","Bien dont la demande augmente quand le revenu augmente.","Marché"],["Bien inférieur","Bien dont la demande diminue quand le revenu augmente.","Marché"],["Concurrence parfaite","Marché avec tellement d'acheteurs et de vendeurs qu'aucun ne peut influencer le prix.","Marché"],["Concurrence monopolistique","Marché avec beaucoup de vendeurs qui offrent des produits différenciés (ex. : restaurants).","Marché"],["Oligopole","Marché dominé par quelques grandes entreprises (ex. : télécommunications).","Marché"],["Monopole","Marché avec un seul vendeur.","Marché"],["Indice des prix à la consommation (IPC)","Moyenne pondérée des prix d'un panier d'environ 600 biens et services consommés par un ménage type. Sert à calculer l'inflation.","Coût de la vie"],["Indice implicite des prix (IIP)","Indice des prix de tous les biens et services finaux produits au pays. Sert à « dégonfler » le PIB (déflateur du PIB).","Coût de la vie"],["Moyenne pondérée","Moyenne qui tient compte du poids de chaque élément (le logement pèse plus que les vêtements dans le panier de l'IPC).","Coût de la vie"],["Année de référence","Année de base d'un indice, où l'indice vaut 100.","Coût de la vie"],["Inflation","Hausse soutenue du niveau moyen des prix, qui fait perdre du pouvoir d'achat.","Coût de la vie"],["Déflation","Baisse du niveau moyen des prix, qui fait gagner du pouvoir d'achat.","Coût de la vie"],["Réduflation","Inflation cachée : la quantité du produit diminue, mais le prix reste le même.","Coût de la vie"],["Déqualiflation","Inflation cachée : la qualité du produit diminue, mais le prix reste le même.","Coût de la vie"],["Pouvoir d'achat","Quantité de biens et services qu'on peut acheter avec un montant d'argent donné.","Coût de la vie"],["Taux d'inflation","Variation en % de l'IPC : (IPC courant − IPC précédent) ÷ IPC précédent × 100.","Coût de la vie"],["Salaire nominal","Salaire en dollars courants, tel qu'écrit sur la paie.","Coût de la vie"],["Salaire réel","Salaire corrigé de l'inflation : salaire nominal ÷ IPC × 100.","Coût de la vie"],["Taux d'intérêt réel","Rendement corrigé de l'inflation : 1 + taux réel = (1 + taux nominal) ÷ (1 + taux d'inflation).","Coût de la vie"],["Inflation par la demande","Inflation causée par une hausse de la demande, qui fait monter les prix.","Coût de la vie"],["Inflation par les coûts","Inflation causée par la hausse des coûts de production, qui réduit l'offre et fait monter les prix.","Coût de la vie"],["Inflation importée","Inflation causée par la hausse des prix à l'étranger, qui rend les produits importés plus chers.","Coût de la vie"],["Masse monétaire","Quantité de monnaie en circulation. Si elle augmente trop, la monnaie perd de la valeur et les prix montent.","Coût de la vie"],["Produit intérieur brut (PIB)","Valeur, aux prix du marché, de tous les biens et services finaux produits à l'intérieur des frontières d'un pays pendant une période donnée.","PIB"],["Bien final","Bien acheté par l'utilisateur final; il est compté dans le PIB.","PIB"],["Bien intermédiaire","Bien qui sert à fabriquer un autre bien (la farine pour le pain). Il est exclu du PIB pour éviter le double comptage.","PIB"],["Méthode des dépenses","Calcul du PIB par les dépenses : PIB = C + I + G + (X − M).","PIB"],["Consommation (C)","Dépenses des ménages en biens durables, semi-durables, non durables et en services.","PIB"],["Investissement (I)","Dépenses des entreprises en constructions, équipements neufs et variation des stocks (incluant les maisons neuves).","PIB"],["Dépenses publiques (G)","Dépenses des administrations publiques en biens et services. Excluent les paiements de transfert, les subventions et les intérêts sur la dette.","PIB"],["Exportations nettes (X − M)","Valeur des exportations moins celle des importations.","PIB"],["Méthode des revenus","Calcul du PIB par les revenus : PIB = S + EE + RM + (IMP − SUB).","PIB"],["Excédent d'exploitation brut (EE)","Revenus des sociétés, incluant les impôts et la dépréciation du capital.","PIB"],["Revenu mixte brut (RM)","Revenus des entreprises individuelles, revenus de location et rémunération des propriétaires d'entreprise.","PIB"],["Divergence statistique","Moitié de la différence entre le PIB des dépenses et le PIB des revenus : (dépenses − revenus) ÷ 2.","PIB"],["Paiement de transfert","Argent versé par l'État sans production en échange (aide sociale, assurance-emploi, pensions). Exclu du PIB.","PIB"],["Économie souterraine","Activités non déclarées (travail au noir, activités illégales), non comptées dans le PIB.","PIB"],["PIB nominal","Valeur de la production en dollars courants.","PIB"],["PIB réel","Valeur de la production en dollars constants d'une année de référence; il corrige l'effet de l'inflation.","PIB"],["Croissance économique","Évolution de la production globale, mesurée par la variation en % du PIB réel.","PIB"],["Récession","Baisse du PIB réel pendant deux trimestres consécutifs.","PIB"],["Indice de développement humain (IDH)","Indice du PNUD (1990), entre 0 et 1, qui combine l'espérance de vie, l'éducation (durée moyenne et attendue de scolarité) et le revenu (RNB par habitant en PPA).","IDH et inégalités"],["Courbe de Lorenz","Courbe qui met en relation les pourcentages cumulés des revenus et de la population.","IDH et inégalités"],["Droite d'égalité parfaite","Situation théorique où les revenus sont répartis de façon parfaitement égale.","IDH et inégalités"],["Coefficient de Gini","Mesure de l'inégalité des revenus : l'aire entre la courbe de Lorenz et la droite d'égalité parfaite. Plus il est élevé, plus c'est inégal.","IDH et inégalités"],["Quintile","Tranche de 20 % de la population, utilisée pour mesurer la répartition du revenu.","IDH et inégalités"],["Chômage","Situation où des ressources productives (le travail) demeurent inutilisées. Dans le modèle, c'est une offre excédentaire de travail.","Chômage"],["Chômage frictionnel","Chômage qui résulte de la mobilité normale de la main-d'œuvre (nouveau diplômé, changement d'emploi, fin de contrat).","Chômage"],["Chômage structurel","Chômage qui résulte de changements technologiques, de la concurrence internationale, de facteurs démographiques ou de lois, qui modifient les compétences demandées.","Chômage"],["Chômage saisonnier","Chômage causé par les facteurs climatiques (construction l'hiver, moniteur de ski l'été).","Chômage"],["Chômage cyclique","Chômage qui découle du ralentissement de l'activité économique (aussi appelé conjoncturel).","Chômage"],["Plein emploi","Situation où l'économie produit à pleine capacité. Il n'y a aucun chômage cyclique, mais il reste du chômage frictionnel et structurel.","Chômage"],["Taux de chômage naturel","Taux de chômage observé au plein emploi (environ 6 % au Canada).","Chômage"],["Enquête sur la population active (EPA)","Enquête mensuelle de Statistique Canada auprès d'environ 54 000 ménages sur le marché du travail.","Chômage"],["Population active","Personnes de 15 ans et plus qui ont un emploi ou qui sont en chômage.","Chômage"],["Population inactive","Personnes de 15 ans et plus qui ne travaillent pas et ne cherchent pas d'emploi (retraités, étudiants à temps plein, chômeurs découragés).","Chômage"],["Personne occupée","Personne qui, la semaine de l'enquête, a travaillé contre rémunération ou avait un emploi mais était absente (maladie, etc.).","Chômage"],["Chômeur","Personne disponible pour travailler, mais sans emploi rémunéré la semaine de l'enquête.","Chômage"],["Taux de chômage","Chômeurs ÷ population active × 100.","Chômage"],["Taux d'activité","Population active ÷ population de 15 ans et plus × 100.","Chômage"],["Taux d'emploi","Personnes occupées ÷ population de 15 ans et plus × 100.","Chômage"],["Conjoncture économique","Étude de la situation momentanée d'une économie et de son évolution à court terme : un portrait à un moment donné.","DA et OA"],["Cycles économiques","Fluctuations périodiques, mais irrégulières, de l'activité économique (du PIB réel) dans le temps.","DA et OA"],["Expansion","Phase du cycle durant laquelle le PIB et l'emploi augmentent.","DA et OA"],["Reprise","Partie de l'expansion qui part du creux et dure jusqu'au retour au niveau du sommet précédent.","DA et OA"],["Sommet","Point qui sépare la fin d'une expansion et le début d'une récession.","DA et OA"],["Récession (phase)","Phase du cycle durant laquelle le PIB et l'emploi diminuent.","DA et OA"],["Creux","Point qui sépare la fin d'une récession et le début d'une expansion.","DA et OA"],["Demande agrégée (DA)","Relation entre la quantité demandée de PIB réel et le niveau des prix, ceteris paribus : DA = Cp + Ip + Gp + XNp.","DA et OA"],["Facteurs de la consommation","Revenu, richesse (épargne, dettes), attentes, taux d'intérêt, impôts.","DA et OA"],["Facteurs de l'investissement","Taux d'intérêt, profits anticipés, impôt sur les profits des entreprises.","DA et OA"],["Facteurs des exportations nettes","Revenu intérieur réel des autres pays et taux de change.","DA et OA"],["Offre agrégée (OA)","Somme des B&S que les entreprises ont l'intention de produire à chaque niveau de prix.","DA et OA"],["Facteurs de l'offre agrégée","Coûts de production (salaires, matériaux, énergie), productivité (travail, capital), réglementation (taxes, tarifs, subventions), climat et climat politique.","DA et OA"],["Déplacement sur la courbe","Mouvement causé par une variation du niveau des prix.","DA et OA"],["Déplacement de la courbe","Mouvement de toute la courbe causé par un facteur autre que le niveau des prix.","DA et OA"],["Modèle DA-OA","Modèle qui détermine l'équilibre entre le PIB réel et le niveau des prix (IIP), là où la DA croise l'OA.","DA et OA"],["PIB potentiel","Production qu'une économie peut soutenir au plein-emploi sans poussée inflationniste; aussi appelé offre agrégée à long terme (OALT).","DA et OA"],["Équilibre de plein-emploi","PIB réel = PIB potentiel; chômage observé = chômage naturel; aucune pression sur les prix.","DA et OA"],["Équilibre de suremploi","PIB réel > PIB potentiel; chômage observé < naturel; écart inflationniste.","DA et OA"],["Équilibre de sous-emploi","PIB réel < PIB potentiel; chômage observé > naturel; écart déflationniste.","DA et OA"],["École classique","Smith, Ricardo, Mill : l'économie s'autorégule, les salaires s'ajustent instantanément, laisser-faire.","DA et OA"],["École keynésienne","Keynes : salaires rigides, l'État doit soutenir la demande agrégée (politique budgétaire et monétaire).","DA et OA"],["École monétariste","Friedman : l'économie s'autorégule si la monnaie croît à un taux constant; rôle minimal de l'État.","DA et OA"]],"Psychologie":[["Psychologie","Étude scientifique du comportement et des processus mentaux.","Introduction"],["Comportement","Ensemble des actions et réactions observables, directement ou avec un appareil.","Introduction"],["Processus mentaux","Activités internes, intellectuelles ou affectives : penser, se souvenir, ressentir, percevoir, décider.","Introduction"],["Recherche fondamentale","Recherche qui vise à élargir les connaissances scientifiques.","Introduction"],["Recherche appliquée","Recherche qui vise à résoudre des problèmes concrets.","Introduction"],["Psychologie populaire","Mauvaises interprétations de la recherche en psychologie, répandues dans les livres, les articles et les blogues (ex. : « on utilise 10 % de notre cerveau »).","Introduction"],["Méthode scientifique (objectifs)","Décrire, expliquer, prédire et modifier les comportements et processus mentaux.","Introduction"],["Méthode expérimentale","Méthode qui compare des groupes pour établir un lien de cause à effet entre une variable indépendante et une variable dépendante.","Introduction"],["Variable indépendante (VI)","Variable manipulée par le chercheur : la cause.","Introduction"],["Variable dépendante (VD)","Variable mesurée, qui subit l'effet de la VI.","Introduction"],["Variable contrôlée","Facteur qui pourrait fausser les résultats et qu'on neutralise.","Introduction"],["Groupe expérimental","Groupe exposé à la variable indépendante (le groupe contrôle ne l'est pas).","Introduction"],["Étude de cas","Méthode qui recueille le plus d'information possible sur un cas rare ou représentatif.","Introduction"],["Enquête","Méthode qui sert à connaître les comportements, opinions ou attitudes typiques d'un groupe (sondage).","Introduction"],["Plasticité cérébrale","Capacité du système nerveux à modifier ses connexions et son fonctionnement selon l'expérience, l'apprentissage ou les lésions.","Introduction"],["Psychanalyse","Approche fondée par Freud, centrée sur l'inconscient, les conflits psychiques et les expériences de l'enfance.","Approches"],["Behaviorisme","Approche fondée par Watson, qui étudie seulement les comportements observables et mesurables (stimulus, réponse, conditionnement).","Approches"],["Gestaltisme","Approche fondée par Wertheimer : on perçoit des ensembles organisés, car « le tout est différent de la somme de ses parties ».","Approches"],["Humanisme","Approche de Rogers et Maslow, centrée sur la personne, sa liberté, son expérience et son épanouissement.","Approches"],["Cognitivisme","Approche associée à Piaget, qui étudie le traitement de l'information : attention, perception, mémoire, langage, pensée.","Approches"],["Approche écosystémique","Approche de Bronfenbrenner qui étudie le développement à travers les interactions entre la personne et ses milieux de vie.","Approches"],["Approche psychobiologique","Approche qui étudie les liens entre le comportement et le corps : neurones, hormones, gènes.","Approches"],["Psychologie positive","Approche de Seligman qui étudie scientifiquement les forces, le bien-être et l'épanouissement.","Approches"],["Approche éclectique","Utilisation réfléchie de plusieurs approches selon les besoins de la personne.","Approches"],["Congruence","Selon Rogers, accord entre l'expérience vécue, la conscience de soi et l'expression de soi.","Approches"],["Regard positif inconditionnel","Selon Rogers, accepter la personne sans condition ni jugement.","Approches"],["Schème","Selon Piaget, structure mentale organisée qui permet d'agir et de comprendre.","Approches"],["Assimilation","Intégrer une nouvelle situation à un schème existant (appeler un chat « chien »).","Approches"],["Accommodation (Piaget)","Modifier un schème pour tenir compte d'une nouvelle situation.","Approches"],["Microsystème","Milieux avec lesquels la personne interagit directement : famille, classe, amis.","Approches"],["Mésosystème","Relations entre les microsystèmes (ex. : collaboration parents-profs).","Approches"],["Exosystème","Milieux qui influencent la personne sans qu'elle y participe (ex. : le travail d'un parent).","Approches"],["Macrosystème","Cadre socioculturel : valeurs, normes, lois, culture.","Approches"],["Chronosystème","Dimension du temps et des transitions (ex. : passage au cégep, pandémie).","Approches"],["Conscient","Pensées et perceptions accessibles en ce moment.","Freud"],["Préconscient","Informations qui ne sont pas présentes à l'esprit, mais faciles à récupérer.","Freud"],["Inconscient","Désirs, souvenirs et conflits inaccessibles à la conscience qui, selon Freud, influencent la conduite.","Freud"],["Ça","Instance pulsionnelle qui cherche la satisfaction immédiate (principe de plaisir).","Freud"],["Moi","Instance qui fait la médiation entre le ça, le surmoi et la réalité (principe de réalité).","Freud"],["Surmoi","Instance morale : règles et interdits intériorisés (principe de moralité).","Freud"],["Mécanisme de défense","Stratégie inconsciente qui réduit l'anxiété ou un conflit psychique (décrits par Anna Freud).","Freud"],["Déni","Refuser de reconnaître une réalité pénible.","Freud"],["Déplacement","Rediriger une émotion vers une cible moins menaçante.","Freud"],["Projection","Attribuer à autrui ses propres émotions ou désirs inacceptables.","Freud"],["Rationalisation","Donner une explication raisonnable pour cacher ses vrais motifs.","Freud"],["Refoulement","Rendre inconsciemment un souvenir pénible inaccessible à la conscience.","Freud"],["Régression","Revenir à un comportement d'une étape moins mature.","Freud"],["Sublimation","Orienter une impulsion inacceptable vers une activité socialement valorisée.","Freud"],["Formation réactionnelle","Afficher l'attitude opposée à ce qu'on ressent vraiment.","Freud"],["État altéré de conscience","État mental qui diffère de la vigilance habituelle (sommeil, rêve, hypnose, méditation, effets de psychotropes).","Conscience et sommeil"],["Rythme circadien","Rythme biologique d'environ 24 heures, comme l'alternance veille-sommeil.","Conscience et sommeil"],["Sommeil paradoxal","Stade de sommeil où le cerveau est actif comme à l'éveil, les muscles sont paralysés et les yeux bougent rapidement (MOR). C'est le principal stade du rêve.","Conscience et sommeil"],["Sommeil profond","Stades 3 et 4 du sommeil, surtout au début de la nuit.","Conscience et sommeil"],["Contenu manifeste","Selon la psychanalyse, ce dont on se souvient du rêve.","Conscience et sommeil"],["Contenu latent","Selon la psychanalyse, la signification cachée et inconsciente du rêve.","Conscience et sommeil"],["Insomnie","Difficulté à s'endormir ou à rester endormi.","Conscience et sommeil"],["Narcolepsie","Endormissements soudains et involontaires pendant la journée.","Conscience et sommeil"],["Apnée du sommeil","Arrêts répétés de la respiration pendant le sommeil.","Conscience et sommeil"],["Psychotrope","Substance qui agit sur le système nerveux et modifie la conscience, l'humeur, les perceptions ou le comportement.","Psychotropes"],["Tolérance","Besoin d'une dose de plus en plus forte pour obtenir le même effet.","Psychotropes"],["Dépendance","Besoin physique ou psychologique de consommer une substance, de façon répétée et incontrôlée.","Psychotropes"],["Dépresseur","Psychotrope qui ralentit le système nerveux central (alcool, opioïdes, GHB).","Psychotropes"],["Stimulant","Psychotrope qui accélère le système nerveux (caféine, nicotine, cocaïne).","Psychotropes"],["Perturbateur","Psychotrope qui altère les perceptions (cannabis, LSD, champignons magiques).","Psychotropes"],["Polyconsommation","Consommation de plusieurs substances en même temps; les effets peuvent se multiplier.","Psychotropes"],["Sensation","Détection d'un stimulus par un organe sensoriel et transmission de l'information au système nerveux.","Sensation et perception"],["Perception","Processus par lequel le cerveau sélectionne, organise et interprète les informations sensorielles.","Sensation et perception"],["Transduction","Transformation de l'énergie d'un stimulus en signal nerveux par les récepteurs.","Sensation et perception"],["Seuil absolu","Intensité minimale d'un stimulus détectée environ 50 % du temps.","Sensation et perception"],["Seuil différentiel","Plus petite différence entre deux stimuli perçue environ 50 % du temps.","Sensation et perception"],["Loi de Weber","La différence juste perceptible est une proportion constante de l'intensité de départ (ΔI ÷ I = k).","Sensation et perception"],["Adaptation sensorielle","Diminution de la sensibilité à un stimulus continu et stable.","Sensation et perception"],["Attention sélective","Capacité de se concentrer sur un stimulus en filtrant les autres.","Sensation et perception"],["Proprioception","Perception de la position et du mouvement de ses membres.","Sensation et perception"],["Bâtonnets","Photorécepteurs de la rétine très sensibles à la faible lumière (vision de nuit, peu de couleur).","Sensation et perception"],["Cônes","Photorécepteurs de la rétine responsables de la vision des couleurs et des détails.","Sensation et perception"],["Fovéa","Zone centrale de la rétine, riche en cônes, essentielle à la vision détaillée.","Sensation et perception"],["Synthèse additive","Mélange de lumières (rouge, vert, bleu) qui tend vers le blanc, comme sur un écran.","Sensation et perception"],["Synthèse soustractive","Mélange de pigments (cyan, magenta, jaune) qui tend vers le foncé, comme en impression.","Sensation et perception"],["Théorie trichromatique","La perception des couleurs repose sur trois types de cônes.","Sensation et perception"],["Théorie des processus antagonistes","La couleur est traitée par des oppositions : rouge-vert, bleu-jaune, clair-sombre (explique l'image rémanente).","Sensation et perception"],["Timbre","Qualité qui permet de distinguer deux sons de même hauteur et de même intensité.","Sensation et perception"],["Proximité (Gestalt)","Loi selon laquelle on regroupe les éléments rapprochés.","Sensation et perception"],["Similarité (Gestalt)","Loi selon laquelle on regroupe les éléments semblables.","Sensation et perception"],["Clôture (Gestalt)","Loi selon laquelle on complète mentalement une forme incomplète.","Sensation et perception"],["Figure-fond","Loi selon laquelle on distingue un objet principal de son arrière-plan (vase de Rubin).","Sensation et perception"],["Constance perceptive","Percevoir un objet comme stable (forme, taille, couleur, clarté) même si son image sur la rétine change.","Sensation et perception"],["Disparité rétinienne","Indice binoculaire de profondeur : chaque œil voit une image légèrement différente.","Sensation et perception"],["Convergence","Indice binoculaire de profondeur : les yeux tournent vers l'intérieur pour fixer un objet proche.","Sensation et perception"],["Illusion perceptive","Interprétation trompeuse d'un stimulus réel (une hallucination, elle, se produit sans stimulus).","Sensation et perception"],["Neurone","Cellule spécialisée qui reçoit, intègre et transmet des signaux.","Système nerveux"],["Cellule gliale","Cellule de soutien du système nerveux; certaines produisent la myéline.","Système nerveux"],["Dendrites","Prolongements du neurone qui reçoivent les signaux.","Système nerveux"],["Axone","Prolongement du neurone qui conduit le potentiel d'action vers les terminaisons.","Système nerveux"],["Myéline","Gaine isolante qui accélère la conduction de l'influx nerveux (conduction saltatoire).","Système nerveux"],["Synapse","Zone de communication entre deux cellules nerveuses, où passent les neurotransmetteurs.","Système nerveux"],["Neurotransmetteur","Messager chimique libéré dans la synapse (ex. : dopamine, sérotonine, GABA, glutamate, acétylcholine).","Système nerveux"],["Système nerveux central (SNC)","Encéphale et moelle épinière.","Système nerveux"],["Système nerveux périphérique (SNP)","Nerfs situés hors du SNC; il comprend le système somatique et le système autonome.","Système nerveux"],["Système sympathique","Partie du système autonome qui mobilise le corps (fuite ou combat).","Système nerveux"],["Système parasympathique","Partie du système autonome qui favorise le repos, la récupération et la digestion.","Système nerveux"],["Neurone afférent","Neurone qui conduit l'information de la périphérie vers le SNC (sensoriel).","Système nerveux"],["Neurone efférent","Neurone qui conduit les commandes du SNC vers les muscles (moteur).","Système nerveux"],["Arc réflexe","Circuit qui produit une réponse rapide et automatique organisée par la moelle épinière.","Système nerveux"],["Sclérose en plaques","Maladie qui endommage la myéline du système nerveux central.","Système nerveux"],["Thalamus","Structure qui relaie la plupart des informations sensorielles vers le cortex.","Cerveau"],["Hypothalamus","Structure qui maintient l'homéostasie : faim, soif, température.","Cerveau"],["Homéostasie","Maintien des paramètres internes du corps dans des limites qui permettent son bon fonctionnement.","Cerveau"],["Hippocampe","Structure essentielle à la formation de nouveaux souvenirs (cas H. M.).","Cerveau"],["Amygdale","Structure qui évalue l'importance émotionnelle des stimuli et détecte les menaces.","Cerveau"],["Cervelet","Structure qui coordonne les mouvements et l'équilibre.","Cerveau"],["Bulbe rachidien","Partie du tronc cérébral qui contrôle des fonctions vitales comme la respiration et le rythme cardiaque.","Cerveau"],["Corps calleux","Faisceau de fibres qui relie les deux hémisphères.","Cerveau"],["Lobe frontal","Planification, prise de décision, contrôle des impulsions, mouvement volontaire.","Cerveau"],["Lobe pariétal","Sensations corporelles et repérage dans l'espace.","Cerveau"],["Lobe temporal","Audition, langage et mémoire.","Cerveau"],["Lobe occipital","Traitement visuel.","Cerveau"],["Amnésie antérograde","Incapacité de former de nouveaux souvenirs durables (cas H. M.).","Cerveau"],["Apprentissage","Modification relativement durable des connaissances ou des comportements, due à l'expérience.","Apprentissage"],["Habituation","Diminution de la réponse à un stimulus répété et sans conséquence.","Apprentissage"],["Sensibilisation","Augmentation de la réaction à un stimulus après une expérience marquante.","Apprentissage"],["Conditionnement classique","Apprentissage d'une association entre deux stimuli (Pavlov).","Apprentissage"],["Stimulus inconditionnel (SI)","Stimulus qui provoque naturellement une réponse (la nourriture, chez Pavlov).","Apprentissage"],["Stimulus conditionnel (SC)","Stimulus d'abord neutre qui, après association, déclenche la réponse apprise (la cloche).","Apprentissage"],["Réponse conditionnelle (RC)","Réponse apprise au stimulus conditionnel (saliver à la cloche).","Apprentissage"],["Extinction","Diminution de la réponse conditionnelle quand le SC est présenté sans le SI.","Apprentissage"],["Généralisation","Réagir aussi à des stimuli semblables au stimulus conditionnel.","Apprentissage"],["Conditionnement opérant","Apprentissage où la fréquence d'un comportement change selon ses conséquences (Skinner).","Apprentissage"],["Renforcement positif","Ajouter une conséquence agréable pour augmenter un comportement.","Apprentissage"],["Renforcement négatif","Retirer une conséquence désagréable pour augmenter un comportement (ce n'est pas une punition).","Apprentissage"],["Punition positive","Ajouter une conséquence désagréable pour diminuer un comportement.","Apprentissage"],["Punition négative","Retirer quelque chose d'agréable pour diminuer un comportement.","Apprentissage"],["Façonnement","Renforcer de petites étapes successives vers un comportement cible.","Apprentissage"],["Apprentissage latent","Apprentissage qui n'apparaît pas tout de suite et se manifeste quand il devient utile (Tolman).","Apprentissage"],["Apprentissage par intuition","Solution soudaine d'un problème après réflexion, l'effet « eurêka » (Köhler).","Apprentissage"],["Apprentissage par observation","Apprendre en observant un modèle et les conséquences de ses actes (Bandura).","Apprentissage"]],"MTI":[["Métier d'étudiant","L'idée qu'étudier est un vrai travail, qui demande de l'autonomie, du sens des responsabilités, de l'assiduité, une bonne gestion du temps et de la persévérance.","Métier d'étudiant"],["Prise de notes","Technique qui sert à garder une trace des idées essentielles d'un cours, à rester attentif et à faciliter l'étude.","Métier d'étudiant"],["Méthode Cornell","Méthode de prise de notes où la page est divisée en trois zones : les notes à droite, les mots-clés et questions dans une colonne à gauche, et un résumé en bas.","Métier d'étudiant"],["Motivation (Viau)","Selon Viau, la motivation aux études dépend de trois perceptions : la valeur de l'activité, sa propre compétence et la contrôlabilité de la tâche.","Métier d'étudiant"],["Perception de la valeur","Jugement que l'étudiant porte sur l'utilité et l'intérêt d'une activité (« ça sert à quelque chose »).","Métier d'étudiant"],["Perception de compétence","Jugement que l'étudiant porte sur sa capacité à réussir une activité (« je suis capable »).","Métier d'étudiant"],["Perception de contrôlabilité","Sentiment d'avoir du pouvoir sur le déroulement et le résultat d'une activité.","Métier d'étudiant"],["Équipe de travail","Groupe de personnes interdépendantes qui collaborent pour atteindre un objectif commun.","Travail d'équipe"],["Écoute active","Attitude qui consiste à porter une réelle attention à l'autre, à reformuler ce qu'il dit et à poser des questions pour bien comprendre.","Travail d'équipe"],["Message au « je »","Façon de s'exprimer qui décrit son propre ressenti (« je trouve difficile… ») au lieu d'accuser l'autre (« tu fais jamais… »).","Travail d'équipe"],["Rétroaction","Commentaire constructif et respectueux donné à quelqu'un sur son travail ou son comportement.","Travail d'équipe"],["Intégrité intellectuelle","Honnêteté dans tout son travail intellectuel : présenter un travail qui est vraiment le sien et respecter la propriété intellectuelle des autres.","Intégrité"],["Propriété intellectuelle","Principe selon lequel les idées, les textes et les œuvres appartiennent à leurs auteurs, qu'il faut citer quand on les utilise.","Intégrité"],["Plagiat","Fait de s'approprier les mots, les idées ou le travail de quelqu'un d'autre sans en indiquer la source (copier-coller, traduire, paraphraser sans référence).","Intégrité"],["Fraude","Fait de tricher pour obtenir un avantage : copier à un examen, utiliser du matériel interdit, faire faire son travail, falsifier des données ou recycler un ancien travail.","Intégrité"],["Les 5 questions de l'intégrité","Ai-je recyclé un travail? Ai-je utilisé une image, une musique ou une vidéo? Ai-je fait du copier-coller? Ai-je tout formulé dans mes mots? Ai-je travaillé seul ou en équipe? (outil « Mon travail est-il prêt à être remis? »)","Intégrité"],["Projet de recherche","Démarche organisée en étapes, qui va du choix d'un sujet jusqu'à la remise du travail, en passant par la recherche documentaire, l'analyse et la rédaction.","Recherche"],["Problématisation","Démarche qui transforme un sujet en problème de recherche, en trois étapes : le sujet, la question de recherche, puis l'hypothèse.","Recherche"],["Sujet de recherche","Thème choisi et délimité (lieu, période, groupe) qu'on veut approfondir. On le choisit selon son intérêt et sa faisabilité.","Recherche"],["Question de recherche préliminaire","Question formulée au début, avant la recherche documentaire, qui sert à guider la recherche. Elle sera ajustée par la suite.","Recherche"],["Question de recherche définitive","Question précisée et ajustée après la recherche documentaire. C'est celle à laquelle le travail répondra.","Recherche"],["Règles d'or de la question de recherche","Une bonne question est claire, précise (délimitée), réaliste et ouverte : on ne peut pas y répondre par oui ou non, et elle ne contient pas de jugement de valeur.","Recherche"],["Hypothèse","Réponse provisoire à la question de recherche, qui oriente la recherche et qui sera confirmée ou infirmée.","Recherche"],["Discipline","Champ d'étude des sciences humaines qui donne un angle au sujet : psychologie, sociologie, économie, administration, histoire, géographie, anthropologie, science politique, sciences des religions.","Recherche"],["Recherche documentaire","Démarche pour trouver de l'information fiable : préparer la recherche, trouver l'information, évaluer les sources, puis citer les sources.","Sources"],["Mots-clés","Termes essentiels qui représentent les idées principales d'un sujet. On y ajoute des synonymes, des termes connexes et des termes en anglais pour diversifier les sources.","Sources"],["Koha","Catalogue de la bibliothèque du cégep, qui sert à trouver des livres et leur cote.","Sources"],["Cote","« Adresse » d'un livre sur les rayons de la bibliothèque.","Sources"],["Érudit","Base de données d'articles scientifiques, surtout québécois et francophones.","Sources"],["Cairn","Base de données d'articles scientifiques et de revues francophones.","Sources"],["Critères d'une bonne source","Une bonne source est pertinente (liée à la question), fiable (crédible), variée (types différents) et accessible (on peut la consulter).","Sources"],["Les 6 questions d'évaluation","Qui (auteur, compétences)? Quoi (contenu, pertinence)? Où (lieu, territoire)? Quand (date, actualité)? Comment (méthode, données)? Pourquoi (intention : informer, convaincre, vendre)?","Sources"],["Monographie","Livre qui traite d'un sujet précis, écrit par un ou quelques auteurs.","Sources"],["Ouvrage collectif","Livre dont les chapitres sont écrits par plusieurs auteurs, sous la direction d'une ou de plusieurs personnes.","Sources"],["Ouvrage de référence","Ouvrage qu'on consulte pour des définitions ou une vue d'ensemble : dictionnaire, encyclopédie, atlas.","Sources"],["Article scientifique","Texte publié dans une revue savante, écrit par des chercheurs et révisé par des pairs, avec une méthode et des références.","Sources"],["Publication gouvernementale","Document publié par un gouvernement ou un organisme public, comme Statistique Canada ou un ministère.","Sources"],["Rapport de recherche","Document qui présente la démarche et les résultats d'une étude, souvent produit par une chaire ou un institut de recherche.","Sources"],["Fiche synthèse","Fiche qui résume une source : titre, auteur, année, type, comment on l'a trouvée, comment y accéder et son utilité justifiée par les 6 questions.","Sources"],["Fait","Énoncé objectif et vérifiable.","Sources"],["Opinion","Énoncé subjectif qui exprime un jugement personnel (« je pense », « devrait », « meilleur »).","Sources"],["Méthode APA","Méthode de référencement auteur-date : on indique (Nom, année, p. X) directement dans le texte.","Citer"],["Méthode traditionnelle","Méthode de référencement où un appel de note dans le texte renvoie à une référence complète en note de bas de page.","Citer"],["Ibid.","Abréviation utilisée en note de bas de page pour dire « même source que la note juste avant ».","Citer"],["Op. cit.","Abréviation utilisée en note de bas de page pour une source déjà citée plus haut, mais pas dans la note juste avant.","Citer"],["Citation courte","Citation de moins de trois lignes, intégrée au texte entre guillemets français « », avec sa référence.","Citer"],["Citation longue","Citation de trois lignes et plus, présentée en bloc, en retrait, à interligne simple, sans guillemets, avec sa référence.","Citer"],["Paraphrase","Reformulation dans ses propres mots de l'idée d'un auteur, sans guillemets mais toujours avec la référence.","Citer"],["Crochets [ ]","Signes qui indiquent une modification dans une citation : un mot ajouté ou changé, un passage coupé […], ou [sic] pour une erreur présente dans l'original.","Citer"],["Bibliographie","Liste des documents écrits (livres, articles) utilisés pour un travail.","Citer"],["Médiagraphie","Liste de tous les documents utilisés, peu importe le support (livres, articles, sites web, vidéos, balados). Classée par sections et par ordre alphabétique, avec un alinéa à partir de la 2e ligne.","Citer"],["Lecture de survol","Lecture rapide pour avoir une vue d'ensemble d'un texte : titres, introduction, conclusion (aussi appelée écrémage).","Rédaction et lecture"],["Lecture de repérage","Lecture qui sert à trouver une information précise dans un texte, comme un chiffre ou une date.","Rédaction et lecture"],["Lecture approfondie","Lecture lente et active pour comprendre un texte en détail, en l'annotant.","Rédaction et lecture"],["Lecture critique","Lecture qui évalue la qualité des arguments et la crédibilité d'un texte.","Rédaction et lecture"],["Résumé","Texte qui condense les idées principales d'un autre texte, sans donner d'opinion.","Rédaction et lecture"],["Compte rendu","Texte en six sections : introduction, résumé (150-200 mots), analyse (150-200 mots), critique (150-200 mots), conclusion et médiagraphie.","Rédaction et lecture"],["Analyse (compte rendu)","Section qui examine la conférence : clarté et logique du discours, structure, solidité, pertinence, forces et limites, apport.","Rédaction et lecture"],["Critique (compte rendu)","Section où l'on prend position de façon claire, honnête, nuancée et appuyée par des arguments.","Rédaction et lecture"]]};
const GL_ADD={"Gestion":[["Gestion des ressources humaines","Ensemble des activités qui visent à embaucher le capital humain d'une entreprise, à le motiver, à contribuer à son développement et à sa rétention, et à traiter les problèmes des relations entre l'entreprise et les employés. Responsabilité de tous les cadres.","Ch. 7 — Ressources humaines"],["Service des ressources humaines","Unité administrative qui n'existe que dans les entreprises de grande taille.","Ch. 7 — Ressources humaines"],["Gestion autoritaire","Façon de gérer les employés entre 1900 et 1940 : on fait ce qu'on nous dit, sinon on perd sa job.","Ch. 7 — Ressources humaines"],["Gestion intégrée","Façon de gérer les ressources humaines entre 1940 et 1980.","Ch. 7 — Ressources humaines"],["4 tendances en GRH","1) Main-d'œuvre flexible et spécialisée · 2) emplois qui coûtent vs emplois qui rapportent · 3) gestion à court terme et sous-traitance · 4) déclin de la population active.","Ch. 7 — Ressources humaines"],["Emplois qui rapportent","Petit nombre de postes clés (règle 80/20) vus comme un investissement : sélection poussée et avantages.","Ch. 7 — Ressources humaines"],["Emplois qui coûtent","La majorité des postes, soumis aux lois de la concurrence.","Ch. 7 — Ressources humaines"],["Emploi atypique","Emploi qui n'est pas à temps plein (temps partiel, contrat…).","Ch. 7 — Ressources humaines"],["Dotation","Tâche des RH qui consiste à combler les postes en 6 étapes : besoins, recrutement, sélection, choix final, accueil, évaluation du processus.","Ch. 7 — Ressources humaines"],["Description de poste","Document qui précise les tâches (savoir-faire), les exigences de formation et d'expérience (savoir) et les compétences et aptitudes (savoir-être) d'un poste.","Ch. 7 — Ressources humaines"],["Recrutement","Étape 2 de la dotation : attirer des candidats (employés actuels, candidatures non sollicitées ou recommandées, agences, écoles, associations).","Ch. 7 — Ressources humaines"],["Sélection","Étape 3 de la dotation : choisir les meilleurs candidats selon des critères objectifs et subjectifs (CV, entrevues, tests, antécédents, période d'essai).","Ch. 7 — Ressources humaines"],["Curriculum vitæ (CV)","Document de présentation d'un candidat qui indique sa formation, ses expériences professionnelles et autres réalisations pertinentes.","Ch. 7 — Ressources humaines"],["Grille de sélection","Outil essentiel de l'entrevue qui permet d'éviter l'effet halo.","Ch. 7 — Ressources humaines"],["Effet halo","Jugement erroné, favorable ou défavorable, porté sur un candidat, souvent à partir d'un élément frappant.","Ch. 7 — Ressources humaines"],["Entrevue de sélection","Entretien qui évalue dans quelle mesure les caractéristiques du candidat satisfont aux exigences d'un poste donné.","Ch. 7 — Ressources humaines"],["Accueil du nouvel employé","Étape 5 de la dotation, déterminante pour la réussite de l'employé : programme d'accueil, documentation, parrainage.","Ch. 7 — Ressources humaines"],["Formation","Processus permettant à une personne d'acquérir les habiletés et les compétences nécessaires à une tâche.","Ch. 7 — Ressources humaines"],["6 modes de formation","Dans l'entreprise, générale, non structurée, continue, stages, sur mesure.","Ch. 7 — Ressources humaines"],["Évaluation du rendement","Faite 1 fois par année par le supérieur immédiat; porte sur le rendement (pas la personnalité) et est orientée vers l'avenir.","Ch. 7 — Ressources humaines"],["Discipline préventive","Informer les employés des comportements inacceptables, des normes et des sanctions pour qu'ils s'autodisciplinent.","Ch. 7 — Ressources humaines"],["Discipline punitive","Appliquer une sanction (ex. suspension sans salaire) pour pousser l'employé à changer ou à partir.","Ch. 7 — Ressources humaines"],["Discipline non punitive (responsable)","Aider l'employé à trouver des solutions à ses problèmes et à se responsabiliser.","Ch. 7 — Ressources humaines"],["Rémunération","Montant d'argent (salaire) et avantages divers accordés à un employé en contrepartie d'un travail ou de la prestation d'un service.","Ch. 7 — Ressources humaines"],["Intéressement","Rémunération incitative : participation des employés aux bénéfices.","Ch. 7 — Ressources humaines"],["Avantages sociaux","Éléments de la rémunération dont bénéficie le salarié en plus de son salaire : imposés (AE, FSS, CNESST, RRQ, RQAP, FDRCMO) ou consentis (assurances, voiture, rabais…).","Ch. 7 — Ressources humaines"],["Convention collective","Contrat négocié entre le syndicat et l'employeur sur les salaires et les conditions de travail.","Ch. 7 — Ressources humaines"],["Grève","Arrêt de travail décidé par les employés.","Ch. 7 — Ressources humaines"],["Lock-out","Fermeture décidée par l'employeur.","Ch. 7 — Ressources humaines"],["Grief","Plainte déposée quand la convention collective n'est pas respectée.","Ch. 7 — Ressources humaines"],["Comptabilité","Système d'information qui permet de rassembler l'information financière relative aux activités économiques des entreprises.","Ch. 8 — Comptabilité"],["Cycle comptable","1) Collecte et tri de l'information · 2) enregistrement chronologique dans les journaux · 3) analyse, classification et synthèse des comptes · 4) communication aux utilisateurs.","Ch. 8 — Comptabilité"],["États financiers","Documents de synthèse qui présentent de façon organisée et standardisée les données financières d'une entité, pour communiquer des informations utiles aux utilisateurs.","Ch. 8 — Comptabilité"],["État des résultats","Mesure la performance de l'entreprise pour une période : produits − charges = bénéfice ou perte.","Ch. 8 — Comptabilité"],["État des capitaux propres","Explique les variations de la valeur de l'investissement et fait le lien entre l'état des résultats et le bilan.","Ch. 8 — Comptabilité"],["Bilan","Photo de la situation financière de l'entreprise à une date donnée : Actif = Passif + Capitaux propres.","Ch. 8 — Comptabilité"],["Produits d'exploitation","Revenus de l'entreprise qui proviennent de ses activités courantes (ventes, services rendus, honoraires…).","Ch. 8 — Comptabilité"],["Charges","Dépenses de l'entreprise engagées pour gagner des produits (salaires, loyer, publicité…).","Ch. 8 — Comptabilité"],["Apport","Somme d'argent ou d'autres biens que le propriétaire investit dans la création ou l'exploitation de l'entreprise.","Ch. 8 — Comptabilité"],["Retrait","Somme d'argent ou d'autres biens que le propriétaire retire du fonctionnement de l'entreprise.","Ch. 8 — Comptabilité"],["Actif","Ce que l'entreprise possède ou ce qu'on lui doit (encaisse, clients, stocks, immeubles…).","Ch. 8 — Comptabilité"],["Passif","Ce que l'entreprise doit à des tiers ou à des créanciers : ses dettes (fournisseurs, marge de crédit, hypothèque…).","Ch. 8 — Comptabilité"],["Capitaux propres","Financement reçu du propriétaire et financement engendré par l'exploitation courante de l'entreprise (apports + bénéfices réinvestis).","Ch. 8 — Comptabilité"],["Équation comptable","Actif = Passif + Capitaux propres.","Ch. 8 — Comptabilité"],["Fonds de roulement","Différence entre l'actif à court terme et le passif à court terme.","Ch. 9 — Gestion financière"],["Analyse financière","Permet de connaître l'efficacité de la gestion et les besoins de financement : analyse du seuil de rentabilité et analyse avec ratios.","Ch. 9 — Gestion financière"],["Ratios","Rapports mathématiques entre deux données des états financiers (ratios de rentabilité, de gestion ou d'activité).","Ch. 9 — Gestion financière"],["Seuil de rentabilité","Point mort où les ventes = frais fixes + frais variables : le bénéfice est nul. En unités : frais fixes ÷ (prix − frais variables unitaires).","Ch. 9 — Gestion financière"],["Frais fixes","Frais qui ne changent pas avec la quantité produite (loyer, assurances…).","Ch. 9 — Gestion financière"],["Frais variables","Frais qui augmentent avec chaque unité produite (matières premières…).","Ch. 9 — Gestion financière"],["Investissement (entreprise)","Dépense effectuée pour acquérir, construire, développer ou améliorer une immobilisation qui procurera des avantages pendant plusieurs exercices.","Ch. 9 — Gestion financière"],["Formes de financement","Financement personnel (ton argent, les proches) · associés ou actionnaires · crédit fournisseur · institutions privées · marché des valeurs mobilières · programmes gouvernementaux (subventions).","Ch. 9 — Gestion financière"],["Crédit fournisseur","Le fournisseur laisse l'entreprise payer plus tard : il lui fait crédit.","Ch. 9 — Gestion financière"],["Action","Titre qui donne la propriété d'une partie du capital, avec le droit d'intervenir dans la gestion et de recevoir un dividende.","Ch. 9 — Gestion financière"],["Dividende","Partie du bénéfice distribuée aux actionnaires en proportion de leurs actions.","Ch. 9 — Gestion financière"],["Courtier","Personne qui a un permis pour acheter des actions; intermédiaire sur le marché primaire.","Ch. 9 — Gestion financière"]],"Économie":[["Conjoncture économique","Étude de la situation momentanée d'une économie et de son évolution à court terme : un portrait à un moment donné.","DA et OA"],["Cycles économiques","Fluctuations périodiques, mais irrégulières, de l'activité économique (du PIB réel) dans le temps.","DA et OA"],["Expansion","Phase du cycle durant laquelle le PIB et l'emploi augmentent.","DA et OA"],["Reprise","Partie de l'expansion qui part du creux et dure jusqu'au retour au niveau du sommet précédent.","DA et OA"],["Sommet","Point qui sépare la fin d'une expansion et le début d'une récession.","DA et OA"],["Récession (phase)","Phase du cycle durant laquelle le PIB et l'emploi diminuent.","DA et OA"],["Creux","Point qui sépare la fin d'une récession et le début d'une expansion.","DA et OA"],["Demande agrégée (DA)","Relation entre la quantité demandée de PIB réel et le niveau des prix, ceteris paribus : DA = Cp + Ip + Gp + XNp.","DA et OA"],["Ceteris paribus","Toutes choses étant égales par ailleurs.","DA et OA"],[ async function loadCfg(){
 if(admin()){try{const j=await gh("GET","/contents/site.json");cfgSha=j.sha;Object.assign(cfg,JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))))));return;}catch(e){if(e.status!==404)console.warn(e);}}
 try{const r=await fetch("site.json?"+Date.now());if(r.ok){Object.assign(cfg,await r.json());return;}}catch(e){}
 try{const r=await fetch("emplacements.json?"+Date.now());if(r.ok)cfg.slots=(await r.json()).map(s=>({subject:s.subject,title:s.title}));}catch(e){}}
async function saveCfg(msg){if(cfgSha===null){try{cfgSha=(await gh("GET","/contents/site.json")).sha;}catch(e){cfgSha=undefined;}}
 const body={message:msg,content:b64txt(JSON.stringify(cfg,null,2))};if(cfgSha)body.sha=cfgSha;
 const r=await gh("PUT","/contents/site.json",body);cfgSha=r.content.sha;}

async function loadGl(){
 if(admin()){try{const j=await gh("GET","/contents/glossaire.json");glSha=j.sha;GL=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));return;}catch(e){if(e.status!==404)console.warn(e);}}
 try{const r=await fetch("glossaire.json?"+Date.now());if(r.ok)GL=await r.json();}catch(e){}}
function mergeAdd(){for(const c in GL_ADD){if(!GL[c])GL[c]=[];const have=new Set(GL[c].map(x=>nrm(x[0])));GL_ADD[c].forEach(x=>{if(!have.has(nrm(x[0])))GL[c].push(x);});}}

 const body={message:msg,content:b64txt(JSON.stringify(GL,null,1))};if(glSha)body.sha=glSha;const r=await gh("PUT","/contents/glossaire.json",body);glSha=r.content.sha;}
